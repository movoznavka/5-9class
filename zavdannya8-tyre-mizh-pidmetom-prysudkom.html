<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тире між підметом і присудком · Завдання</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FBE8CB;--bg-soft:#FFF4E2;--card:#FFFFFF;--ink:#3A2410;--ink-soft:#8A6A4A;--line:rgba(58,36,16,.1);
--c1-a:#FFC46B;--c1-b:#D9730D;--c1-sh:rgba(217,115,13,.4);--blue:#2F6FE0;--c3-b:#17A863;--c2-b:#EF6A66;--terra:#EF6A66;--amber:#C56A0E;
--correct-bg:#E2F6EA;--correct-ink:#128A54;--wrong-bg:#FBE6E1;--wrong-ink:#C8442B;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px;position:relative}
.wrap{max-width:760px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(58,36,16,.12)}
.kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,5.5vw,38px);line-height:1.12;margin:0 0 22px;text-transform:uppercase}
h1 .hl{color:var(--c1-b)}
.topictoggle{display:flex;gap:10px;margin-bottom:14px}
.topictoggle button{flex:1;padding:15px;border-radius:20px;border:none;background:var(--card);font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;color:var(--ink-soft);cursor:pointer;box-shadow:0 8px 18px -14px rgba(58,36,16,.4)}
.topictoggle button.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -10px var(--c1-sh)}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.tab{padding:10px 15px 10px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:#fff;color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 20px -12px rgba(58,36,16,.5);transition:transform .13s ease}
.tab:hover{transform:translateY(-2px)}
.tab .dot{width:22px;height:22px;border-radius:8px;background:rgba(217,115,13,.15);color:var(--c1-b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.tab.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;border-color:transparent;box-shadow:0 12px 22px -8px var(--c1-sh)}
.tab.active .dot{background:rgba(255,255,255,.28);color:#fff}
.card{background:var(--card);border-radius:28px;padding:40px 24px 28px;box-shadow:0 20px 44px -28px rgba(58,36,16,.5)}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;margin:0 0 8px}
.section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px}
.section-intro b{color:var(--ink)}
.s{background:#17A863;color:#fff;border-radius:6px;padding:1px 7px;font-weight:700}
.m{background:var(--terra);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700}
.d{background:var(--c1-b);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700}
.cardwrap{position:relative}
.qflag{position:absolute;top:-24px;right:14px;z-index:20;width:fit-content;max-width:calc(100% - 28px);padding:10px 16px;border-radius:18px;line-height:1.3;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;box-shadow:0 12px 22px -8px var(--c1-sh);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.qflag.drag{cursor:grabbing;transform:scale(1.06)}
.demo{padding:30px 18px 20px;text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:clamp(17px,3.4vw,22px);line-height:1.7;background:var(--bg-soft);border-radius:20px}
.subj{position:relative;display:inline-block}
.subj .lbl{position:absolute;left:50%;transform:translateX(-50%);top:-1.45em;font-size:.5em;font-weight:800;letter-spacing:.02em;color:var(--c3-b);white-space:nowrap}
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.cardgrid{grid-template-columns:1fr}}
.flip{perspective:1200px;height:170px;cursor:pointer;position:relative}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;border-radius:20px;padding:16px 18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.flip-front{background:var(--bg-soft)}
.flip-back{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;transform:rotateY(180deg);align-items:center;text-align:center}
.flip-rule{font-family:'Manrope',sans-serif;font-weight:800;font-size:15.5px;line-height:1.32}
.flip-desc{font-size:12.5px;margin-top:7px;opacity:.8;line-height:1.4}
.flip-example{font-size:15px;font-weight:700;margin-bottom:5px;line-height:1.4}
.flip-hint{position:absolute;bottom:9px;right:14px;font-size:10px;font-weight:700;opacity:.45}
.qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.qtext{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;line-height:1.4;margin:0 0 18px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--bg-soft);cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);transition:transform .12s ease}
.opt:hover{transform:translateY(-1px)}
.opt[disabled]{cursor:default}.opt[disabled]:hover{transform:none}
.tile{position:relative;width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--c1-b);background:linear-gradient(150deg,rgba(255,255,255,.8),rgba(217,115,13,.2));border:1px solid rgba(255,255,255,.7)}
.badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff}
.badge.ok{background:var(--c3-b)}.badge.no{background:var(--c2-b)}
.opt.correct{background:var(--correct-bg)}.opt.wrong{background:var(--wrong-bg)}.opt.dim{opacity:.5}
.feedback{margin-top:16px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--correct-bg);color:var(--correct-ink)}
.feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.btn{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;border:none;cursor:pointer}
.btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh)}
.btn.ghost{background:transparent;color:var(--ink-soft)}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.tab.pressed{transform:scale(.95);box-shadow:inset 0 3px 8px rgba(58,36,16,.25)}
.topictoggle button.pressed{transform:scale(.97)}
.opt.pressed{transform:scale(.98)}.btn.pressed{transform:scale(.95);filter:brightness(.94)}
.flip.pressed .flip-inner{transform:scale(.97)}.flip.open.pressed .flip-inner{transform:rotateY(180deg) scale(.97)}
.done-screen{text-align:center}
.done-screen .ring{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 16px 30px -12px var(--c1-sh);display:flex;align-items:center;justify-content:center}
.done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff}
footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
#drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none}
#drawToggleBtn{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:linear-gradient(150deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 14px 28px -10px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
#drawToggleBtn svg{width:24px;height:24px;transition:transform .25s ease}
#drawToggleBtn:active{transform:scale(.9)}
#drawToggleBtn.on{background:linear-gradient(150deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,#3A8DEB,var(--blue))}
#drawToggleBtn.on svg{transform:rotate(90deg)}
#drawToolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(130%) scale(.94);opacity:0;display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,rgba(255,255,255,.7),rgba(255,255,255,.25));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.7);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(58,36,16,.5);z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none}
#drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
#drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(.94);opacity:0;pointer-events:none}
#drawToolbarMini{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(.9);opacity:0;width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,.5);background:linear-gradient(155deg,var(--c1-a),var(--c1-b));display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none}
#drawToolbarMini svg{width:18px;height:18px}
#drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
.swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(58,36,16,.35);cursor:pointer;padding:0;transition:transform .15s}
.swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(.7);transition:all .15s}
.swatch.selected{transform:scale(1.08)}.swatch.selected::after{opacity:1;transform:scale(1)}
.tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.55);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tool-btn svg{width:16px;height:16px}.tool-btn .dot{border-radius:50%;background:currentColor}
#xthinBtn .dot{width:3.5px;height:3.5px}#thinBtn .dot{width:7px;height:7px}#thickBtn .dot{width:12.5px;height:12.5px}
.tool-btn.selected{background:var(--c1-b);color:#fff;transform:scale(1.06)}
.tool-sep{width:1px;height:22px;background:rgba(58,36,16,.15)}
@media(max-width:480px){#drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px}.swatch{width:21px;height:21px}.tool-btn{width:30px;height:30px}}
.feedback.show{display:flex;align-items:center;gap:9px}.send-status{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:10px;min-height:18px}.send-status.ok{color:var(--correct-ink)}.send-status.bad{color:var(--c2-b)}.btn{display:flex;align-items:center;gap:6px}.btn.ghost.small{padding:8px 14px;font-size:12px}u{text-decoration-thickness:2px;text-underline-offset:3px}
.words{display:flex;flex-wrap:wrap;gap:8px}.w{padding:11px 15px;border-radius:14px;border:none;background:var(--bg-soft);font-family:Inter,sans-serif;font-weight:600;font-size:16px;color:var(--ink);cursor:pointer;transition:transform .12s}.w:hover{transform:translateY(-1px)}.w.pressed{transform:scale(.97)}.w[disabled]{cursor:default}.w[disabled]:hover{transform:none}.w.correct{background:var(--correct-bg);color:var(--correct-ink)}.w.wrong{background:var(--wrong-bg);color:var(--wrong-ink)}.w.dim{opacity:.5}
.gapline{display:flex;flex-wrap:wrap;align-items:center;row-gap:10px;line-height:1.4}.gw{font-family:Inter,sans-serif;font-weight:600;font-size:17px}.gp{width:20px;height:30px;border-radius:8px;border:1.5px dashed rgba(58,36,16,.2);background:transparent;padding:0;margin:0 2px;cursor:pointer;font-family:Manrope,sans-serif;font-weight:800;font-size:16px;color:var(--c1-b)}.gp.on{background:var(--bg-soft);border-style:solid;border-color:var(--c1-b)}.gp.ok{background:var(--correct-bg);border-style:solid;border-color:var(--correct-ink);color:var(--correct-ink)}.gp.bad{background:var(--wrong-bg);border-style:solid;border-color:var(--wrong-ink);color:var(--wrong-ink)}.gp.miss{border-style:solid;border-color:var(--correct-ink);color:var(--correct-ink)}.gp:disabled{cursor:default}.chk{flex-basis:100%;margin-top:8px}.titlerow{display:flex;align-items:center;gap:10px;margin-bottom:10px}.info-btn{width:26px;height:26px;border-radius:50%;border:none;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;font-style:italic;cursor:pointer;box-shadow:0 6px 12px -6px var(--c1-sh)}
.wi{width:100%;padding:13px 15px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg-soft);font-family:Inter,sans-serif;font-size:16px;font-weight:500;color:var(--ink);resize:vertical}.wi:focus{outline:none;border-color:var(--c1-b)}.wi.ok{background:var(--correct-bg);border-color:var(--correct-ink)}.wi.bad{background:var(--wrong-bg);border-color:var(--wrong-ink)}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="kicker">Тире · 8 клас · Завдання</div><div class="kicker" style="opacity:.4"></div></div>
  <h1>Завдання</h1>
  <div class="tabbar" id="subtabbar"></div>
  <div class="card" id="lessonArea"></div>
  <footer>@movoznavka</footer>
</div>
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg></button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#3A2410" data-color="#3A2410"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="tool-btn" id="clearBtn" title="Очистити все"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script>
const mk=a=>a.map(x=>({q:x[0],a:x[1],opts:x[2],t:x[3]}));
const gp=a=>a.map(t=>{const R=[],O=[],w=t.split(' ').map((x,i)=>{if(x.includes('§'))R.push(i);if(x.includes('¤'))O.push(i);return x.replace(/[§¤]/g,'')});return{w,a:R,o:O,q:w.join(' ')}});
const EXPL=["підмет і присудок — одна частина мови","один член речення — інфінітив, а інший — іменник","перед присудком є частка (то, це, ось) або слово значить"];
const wr=a=>a.map(x=>({q:x[0],ans:x.slice(1),a:[],opts:[]}));
const norm=s=>s.toLowerCase().replace(/[«»"“”.!]/g,'').replace(/\s*[–—]\s*/g,' — ').replace(/\s+-\s+/g,' — ').replace(/\s+/g,' ').trim();
const GI="Прочитайте речення. Натисніть на проміжок між словами, де потрібне тире (їх може бути кілька), і натисніть «Перевірити». Якщо тире не потрібне — одразу натискайте «Перевірити». Інші розділові знаки вже розставлено.";
const TOPICS={exercises:{subs:[
{tab:"Завдання 1",dot:"1",testName:"Тире (завдання)",title:"Завдання 1",intro:GI,gap:true,opts:[],questions:gp([
"Вуха й очі§ то сонце й місяць. А серце§ Господар.",
"Століття§ зморшка на чолі землі.",
"Книги§ морська глибина.",
"Кров¤ людська не водиця.",
"Мова¤ мамина свята.",
"Хмари в небі мов сива шаль.",
"Зрозуміти культуру далеких предків§ це значить зрозуміти себе.",
"Ніч мов криниця без дна.",
"Вовка боятися§ в ліс не ходити."])},
{tab:"Завдання 2",dot:"2",testName:"Тире (завдання)",title:"Завдання 2",intro:GI,gap:true,opts:[],questions:gp([
"Чорна туга і біль§ мої вічні жнива.",
"Хворому і мед гіркий.",
"Кохання, вірність§ істини одвічні.",
"Я в твоїх очах надрукована таємним шрифтом твоєї ніжності.",
"Уже дерева як рогаті олені.",
"Чорна ніч інкрустована ніжністю.",
"Мова не полова.",
"Люди§ браття, а природа§ мати.",
"Два та два§ чотири."])},
{tab:"Завдання 3",dot:"3",testName:"Тире (завдання)",title:"Завдання 3",intro:"Прочитайте речення. Поясніть, чому між підметом і присудком стоїть тире.",opts:EXPL,questions:mk([
["Яка совість — така й честь.",0],
["Совість — найкращий порадник.",0],
["Земля — хлібодарка і медоносиця.",0],
["Кров людська — не водиця, проливати не годиться.",0],
["Щастя — це вміння трудитись.",[0,2]],

const API_URL="https://script.google.com/macros/s/AKfycbxWkeJYw7gUdEjM9H2oeMVTMhBLEq1dDa2DcqNS5vSQjJb19aXyR7p7kDz_otyK3sTggw/exec";

let introOpen=false,activeSub=0,quizIdx=0,quizAnswers={},_rs='idle';
// ?hw=2 | 2-3 | "1 3" — показати лише вказані завдання
(function(){const hw=new URLSearchParams(location.search).get('hw');if(!hw)return;const set=new Set();hw.split(/[\s,;+]+/).forEach(t=>{const m=t.match(/^(\d+)-(\d+)$/);if(m){for(let n=+m[1];n<=+m[2];n++)set.add(String(n))}else if(/^\d+$/.test(t))set.add(t)});const f=TOPICS.exercises.subs.filter(s=>set.has(s.dot));if(f.length)TOPICS.exercises.subs=f})();
const subs=()=>TOPICS.exercises.subs,area=document.getElementById('lessonArea'),tabs=document.getElementById('subtabbar'),drawStore={};
const dkey=()=>activeSub+'__q'+quizIdx;
const saveDraw=()=>{if(window.getDrawingSnapshot)drawStore[dkey()]=window.getDrawingSnapshot()};
function attachTapToggle(el,h){if(!el)return;let sx=0,sy=0,pen=false,tr=false;
el.addEventListener('pointerdown',e=>{tr=true;sx=e.clientX;sy=e.clientY;pen=e.pointerType==='pen';el.classList.add('pressed')},{passive:true});
el.addEventListener('pointerup',e=>{el.classList.remove('pressed');if(!tr)return;tr=false;if(pen&&window.isDrawingActive&&window.isDrawingActive())return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)return;h(e)});
el.addEventListener('pointercancel',()=>{tr=false;el.classList.remove('pressed')});
el.addEventListener('pointerleave',()=>{if(tr)el.classList.remove('pressed')})}
function renderSubs(){tabs.innerHTML=subs().map((s,i)=>`<button class="tab ${i===activeSub?'active':''}"><span class="dot">${s.dot}</span>${s.tab}</button>`).join('');
tabs.querySelectorAll('.tab').forEach((b,i)=>attachTapToggle(b,()=>{saveDraw();activeSub=i;introOpen=false;quizIdx=0;quizAnswers={};_rs='idle';renderSubs();renderContent()}))}
function renderContent(){const s=subs()[activeSub];area.innerHTML=`<div class="titlerow"><p class="section-title" style="margin:0">${s.title}</p><button class="info-btn" id="infoBtn" title="Що робити?">i</button></div><p class="section-intro" id="introBox" style="${introOpen?'':'display:none;'}">${s.intro}</p>`;attachTapToggle(document.getElementById('infoBtn'),()=>{introOpen=!introOpen;document.getElementById('introBox').style.display=introOpen?'':'none'});renderQuiz(s);
if(window.resizeDrawCanvas)requestAnimationFrame(()=>requestAnimationFrame(()=>{resizeDrawCanvas();setDrawingSnapshot(drawStore[dkey()]||null)}))}
function score(s){let c=0,n=0;s.questions.forEach((_,i)=>{const r=quizAnswers[i];if(r){n++;if(r.correct)c++}});return{correct:c,answered:n,total:s.questions.length}}
async function sendResult(s){
if(_rs==='sending'||_rs==='sent')return;
const student=new URLSearchParams(location.search).get('student'),st=document.getElementById('sendStatus');
if(!student){if(st)st.textContent='';return}
_rs='sending';st.textContent='Надсилаємо результат...';st.className='send-status';
const {correct,answered,total}=score(s),wrongList=[];
s.questions.forEach((_,i)=>{const r=quizAnswers[i];if(r&&!r.correct)wrongList.push(s.dot+'.'+(i+1))});
try{const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'quiz_result',student,testName:s.testName||s.title,correct,answered,total,wrongList,reviewLink:'',flaggedList:[]})});
if(!resp||!resp.ok)throw 0;_rs='sent';st.textContent='Результат надіслано вчителю ✓';st.className='send-status ok'}
catch(e){_rs='failed';st.innerHTML='Не вдалося надіслати результат (перевірте інтернет). <button class="btn ghost small" id="retrySendBtn">Спробувати ще раз</button>';st.className='send-status bad';document.getElementById('retrySendBtn').onclick=()=>{_rs='idle';sendResult(s)}}}
function renderQuiz(s){
const total=s.questions.length;
if(quizIdx>=total){const {correct}=score(s),d=document.createElement('div');
d.innerHTML=`<div class="done-screen"><div class="ring"><div class="big">${correct}/${total}</div></div><p class="section-intro" style="margin-top:10px">${correct===total?'Ідеально! Матеріал засвоєно 🎉':'Непогано — можна пройти ще раз.'}</p><div class="send-status" id="sendStatus"></div><button class="btn primary" id="quizRestart" style="margin:6px auto 0">Пройти ще раз</button></div>`;
area.appendChild(d);attachTapToggle(document.getElementById('quizRestart'),()=>{quizIdx=0;quizAnswers={};_rs='idle';renderContent()});sendResult(s);return}
const q=s.questions[quizIdx],rec=quizAnswers[quizIdx],opts=q.opts||s.opts,A=[].concat(q.a),box=document.createElement('div');
box.innerHTML=`<div class="qprog">Питання ${quizIdx+1} з ${total}</div><p class="qtext">«${q.q}»</p>
<div class="options">${opts.map((o,i)=>`<button class="opt" data-i="${i}" ${rec?'disabled':''}><span class="tile"><span>${LETTERS[i]}</span></span><span>${o}</span></button>`).join('')}</div>
<div class="feedback ${rec?'show '+(rec.correct?'ok':'bad'):''}">${rec?(rec.correct?'<span><b>Правильно.</b></span>':`<span>Правильна відповідь — ${A.map(i=>LETTERS[i]+'. '+opts[i]).join(' або ')}</span>`):''}</div>
<div class="nav-row"><button class="btn ghost" id="quizPrev" ${quizIdx===0?'disabled':''}>← Назад</button><button class="btn primary" id="quizNext" ${rec?'':'disabled'}>${quizIdx===total-1?'До результату':'Далі →'}</button></div>`;
area.appendChild(box);
if(s.gap){box.querySelector('.qtext').remove();const o=box.querySelector('.options'),ws=q.w,R=q.a,O=q.o||[],sel=new Set(rec?rec.picked:[]);o.className='gapline';
const draw=()=>{o.innerHTML=ws.map((w,i)=>'<span class="gw">'+w+'</span>'+(i<ws.length-1?'<button class="gp'+(sel.has(i)?' on':'')+(rec?(sel.has(i)?(R.includes(i)||O.includes(i)?' ok':' bad'):(R.includes(i)?' miss':'')):'')+'" data-i="'+i+'"'+(rec?' disabled':'')+'>'+(sel.has(i)||(rec&&R.includes(i))?'—':'')+'</button>':'')).join('')+(rec?'':'<div class="chk"><button class="btn primary" id="gapCheck">Перевірити</button></div>');
if(!rec){o.querySelectorAll('.gp').forEach(b=>attachTapToggle(b,()=>{const i=+b.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);draw()}));attachTapToggle(document.getElementById('gapCheck'),()=>{const p=[...sel].sort((x,y)=>x-y);quizAnswers[quizIdx]={picked:p,correct:R.every(i=>sel.has(i))&&p.every(i=>R.includes(i)||O.includes(i))};renderContent()})}};draw();
if(rec){const sn=ws.map((w,i)=>w+(R.includes(i)?' —':(O.includes(i)?' (—)':''))).join(' ');box.querySelector('.feedback').innerHTML=(rec.correct?'<span><b>Правильно.</b> ':'<span>Має бути: ')+((R.length||O.length)?sn:'Тире тут не потрібне.')+(O.length?' <i>Тире в дужках — необов’язкове (логічна пауза).</i>':'')+'</span>'}}
if(s.write){const o=box.querySelector('.options');o.className='';o.innerHTML='<textarea class="wi" id="wIn" rows="2" placeholder="Запишіть речення з тире…" '+(rec?'disabled':'')+'></textarea>'+(rec?'':'<div class="chk" style="margin-top:12px"><button class="btn primary" id="wCheck">Перевірити</button></div>');
const ta=document.getElementById('wIn'),fb=box.querySelector('.feedback');
if(rec){ta.value=rec.picked;ta.classList.add(rec.correct?'ok':'bad');fb.innerHTML=rec.correct?'<span><b>Правильно.</b></span>':'<span>Правильна відповідь — '+q.ans[0]+'</span>'}
else attachTapToggle(document.getElementById('wCheck'),()=>{const v=ta.value.trim();if(!v)return;quizAnswers[quizIdx]={picked:v,correct:q.ans.some(x=>norm(x)===norm(v))};renderContent()})}
if(s.pick){box.querySelector('.qtext').remove();const o=box.querySelector('.options'),ws=q.q.split(' ');o.className='words';
o.innerHTML=ws.map((w,i)=>`<button class="w" data-i="${i}" ${rec?'disabled':''}>${w}</button>`).join('');
if(rec){const fb=box.querySelector('.feedback');if(!rec.correct)fb.innerHTML='<span>Підмет — «'+(q.t||q.a.map(i=>ws[i].replace(/[.,!?:;]/g,'')).join(' '))+'».</span>';
o.querySelectorAll('.w').forEach((b,i)=>b.classList.add(q.a.includes(i)?'correct':(i===rec.picked?'wrong':'dim')))}
o.querySelectorAll('.w').forEach(b=>attachTapToggle(b,()=>{if(quizAnswers[quizIdx])return;const pk=+b.dataset.i;quizAnswers[quizIdx]={picked:pk,correct:q.a.includes(pk)};renderContent()}))}
if(rec)box.querySelectorAll('.opt').forEach((b,i)=>{const t=b.querySelector('.tile');
if(A.includes(i)){b.classList.add('correct');t.insertAdjacentHTML('beforeend','<span class="badge ok">✓</span>')}
else if(i===rec.picked){b.classList.add('wrong');t.insertAdjacentHTML('beforeend','<span class="badge no">✕</span>')}
else b.classList.add('dim')});
box.querySelectorAll('.opt').forEach(b=>attachTapToggle(b,()=>{if(quizAnswers[quizIdx])return;const p=+b.dataset.i;quizAnswers[quizIdx]={picked:p,correct:A.includes(p)};renderContent()}));
attachTapToggle(document.getElementById('quizPrev'),()=>{saveDraw();quizIdx--;renderContent()});
attachTapToggle(document.getElementById('quizNext'),()=>{saveDraw();quizIdx++;renderContent()})}
renderSubs();renderContent();

(function(){
  const canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d');
  const toggleBtn=document.getElementById('drawToggleBtn'),toolbar=document.getElementById('drawToolbar'),toolbarMini=document.getElementById('drawToolbarMini');
  const xthinBtn=document.getElementById('xthinBtn'),thinBtn=document.getElementById('thinBtn'),thickBtn=document.getElementById('thickBtn'),eraserBtn=document.getElementById('eraserBtn');
  const swatches=document.querySelectorAll('.swatch');
  let drawingActive=false,isDrawing=false,currentColor="#F5304A",currentWidth=4,eraserMode=false,lastX=0,lastY=0,activePointerId=null;
  window.isDrawingActive=()=>drawingActive;
  function resizeCanvas(){
    const w=document.documentElement.clientWidth,h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,window.innerHeight);
    const prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;
    if(canvas.width&&canvas.height)prev.getContext('2d').drawImage(canvas,0,0);
    canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    if(prev.width&&prev.height)ctx.drawImage(prev,0,0,prev.width/devicePixelRatio,prev.height/devicePixelRatio);
  }
  window.resizeDrawCanvas=resizeCanvas;resizeCanvas();
  window.addEventListener('resize',resizeCanvas);window.addEventListener('orientationchange',resizeCanvas);
  if(window.ResizeObserver)new ResizeObserver(()=>resizeCanvas()).observe(document.body);
  window.clearDrawing=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  window.getDrawingSnapshot=()=>{try{return(canvas.width&&canvas.height)?canvas.toDataURL('image/png'):null;}catch(e){return null;}};
  window.setDrawingSnapshot=function(url){
    ctx.clearRect(0,0,canvas.width,canvas.height);if(!url)return;
    const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);img.src=url;
  };
  function setActive(on){
    drawingActive=on;toolbar.classList.toggle('show',on);toolbar.classList.remove('mini');toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on',on);toggleBtn.title=on?'Вимкнути малювання':'Малювати';
  }
  toggleBtn.addEventListener('click',()=>setActive(!drawingActive));
  document.getElementById('minimizeBtn').addEventListener('click',()=>{toolbar.classList.remove('show');toolbar.classList.add('mini');toolbarMini.classList.add('show');});
  toolbarMini.addEventListener('click',()=>{toolbar.classList.remove('mini');toolbar.classList.add('show');toolbarMini.classList.remove('show');});
  swatches.forEach(sw=>sw.addEventListener('click',()=>{
    swatches.forEach(s=>s.classList.remove('selected'));sw.classList.add('selected');
    currentColor=sw.dataset.color;eraserMode=false;eraserBtn.classList.remove('selected');
  }));
  function setW(btn,w){btn.addEventListener('click',()=>{currentWidth=w;[xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');});}
  setW(xthinBtn,2);setW(thinBtn,5);setW(thickBtn,11);
  eraserBtn.addEventListener('click',()=>{eraserMode=!eraserMode;eraserBtn.classList.toggle('selected',eraserMode);});
  document.getElementById('clearBtn').addEventListener('click',()=>window.clearDrawing());
  function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure||.5};}
  const onControls=e=>!!(e.target.closest&&e.target.closest('#drawToolbar, #drawToolbarMini, #drawToggleBtn'));
  document.addEventListener('pointerdown',e=>{
    if(!drawingActive||e.pointerType!=='pen'||onControls(e))return;
    e.preventDefault();isDrawing=true;activePointerId=e.pointerId;const p=pos(e);lastX=p.x;lastY=p.y;
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!drawingActive||!isDrawing||e.pointerId!==activePointerId)return;
    e.preventDefault();const p=pos(e);
    ctx.globalCompositeOperation=eraserMode?'destination-out':'source-over';ctx.strokeStyle=currentColor;
    ctx.lineWidth=(eraserMode?currentWidth*3:currentWidth)*(0.6+(p.pressure||.5)*.8);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;
  },{passive:false});
  function stop(e){if(e&&e.pointerId!==undefined&&e.pointerId!==activePointerId)return;isDrawing=false;activePointerId=null;}
  document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop);
  document.addEventListener('touchmove',e=>{if(drawingActive&&e.touches&&e.touches[0]&&e.touches[0].touchType==='stylus')e.preventDefault();},{passive:false});
})();
