<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Головні члени речення · Тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#EBDFFB;--bg-soft:#F4EEFD;--card:#FFFBEA;--ink:#241934;--ink-soft:#8577A0;--line:rgba(36,25,52,0.08);
--c1-a:#C9A6FF;--c1-b:#8B5CF6;--c1-sh:rgba(139,92,246,0.45);--c3-b:#17A863;--c2-b:#D8393E;
--correct-bg:#E6F8EE;--correct-ink:#128A54;--wrong-bg:#FDECEC;--wrong-ink:#D8393E;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px;position:relative;}
.wrap{max-width:760px;margin:0 auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(36,25,52,0.14);}
.kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.55;}
.kicker.tag{opacity:.4;}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,5.6vw,36px);line-height:1.08;letter-spacing:-0.01em;margin:0 0 18px;text-transform:uppercase;}
.card{background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:0 20px 44px -28px rgba(36,25,52,0.35);}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;margin:0 0 8px;}
.section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
.qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
.qtext{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;line-height:1.4;margin:0 0 18px;}
.options{display:flex;flex-direction:column;gap:10px;}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--bg-soft);cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);transition:transform .12s ease,background .15s ease;}
.opt:hover{transform:translateY(-1px);}
.opt[disabled]{cursor:default;}
.opt[disabled]:hover{transform:none;}
.opt u,.qtext u{text-decoration-thickness:2px;text-underline-offset:2px;}
.tile{position:relative;width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--c1-b);background:linear-gradient(150deg,rgba(255,255,255,0.75),rgba(139,92,246,0.22));border:1px solid rgba(255,255,255,0.7);box-shadow:0 4px 12px -7px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,0.8);}
.badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;}
.badge.ok{background:var(--c3-b);}
.badge.no{background:var(--c2-b);}
.opt.correct{background:var(--correct-bg);}
.opt.wrong{background:var(--wrong-bg);}
.opt.dim{opacity:.5;}
.feedback{margin-top:16px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;display:none;align-items:center;gap:9px;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--correct-bg);color:var(--correct-ink);}
.feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink);}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
.btn{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh);}
.btn.ghost{background:transparent;color:var(--ink-soft);}
.btn.ghost.small{padding:8px 14px;font-size:12px;}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
.opt.pressed{transform:scale(0.98);background:#EEE6FB;}
.btn.pressed{transform:scale(0.95);filter:brightness(0.94);}
.done-screen{text-align:center;}
.done-screen .ring{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 16px 30px -12px var(--c1-sh);display:flex;align-items:center;justify-content:center;}
.done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;}
.send-status{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:10px;min-height:18px;}
.send-status.ok{color:var(--correct-ink);}
.send-status.bad{color:var(--c2-b);}
footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}
#drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none;}
#drawToggleBtn{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(150deg,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 14px 28px -10px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,0.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
#drawToggleBtn svg{width:24px;height:24px;display:block;transition:transform .25s ease;}
#drawToggleBtn:active{transform:scale(0.90);}
#drawToggleBtn.on{background:linear-gradient(150deg,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,#FF8A65,var(--c2-b));}
#drawToggleBtn.on svg{transform:rotate(90deg);}
#drawToolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,rgba(255,255,255,0.6),rgba(255,255,255,0.15));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.7);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(36,25,52,0.45),inset 0 1px 1px rgba(255,255,255,0.9);z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none;}
#drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
#drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;pointer-events:none;}
#drawToolbarMini{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(0.9);opacity:0;width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(155deg,var(--c1-a),var(--c1-b));display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none;}
#drawToolbarMini svg{width:18px;height:18px;}
#drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
.swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(36,25,52,0.35);cursor:pointer;padding:0;transition:transform .15s;}
.swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(0.7);transition:opacity .15s,transform .15s;}
.swatch.selected{transform:scale(1.08);}
.swatch.selected::after{opacity:1;transform:scale(1);}
.tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.5);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,transform .15s;}
.tool-btn svg{width:16px;height:16px;}
.tool-btn .dot{border-radius:50%;background:currentColor;}
#xthinBtn .dot{width:3.5px;height:3.5px;}
#thinBtn .dot{width:7px;height:7px;}
#thickBtn .dot{width:12.5px;height:12.5px;}
.tool-btn.selected{background:var(--c1-b);color:#fff;transform:scale(1.06);}
.tool-sep{width:1px;height:22px;background:rgba(36,25,52,0.14);}
@media(max-width:480px){#drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px;}.swatch{width:21px;height:21px;}.tool-btn{width:30px;height:30px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="kicker">Головні члени речення · Тест</div><div class="kicker tag" id="totalTag"></div></div>
  <h1>Тест</h1>
  <div class="card" id="lessonArea"></div>
  <footer>@movoznavka</footer>
</div>
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg></button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#241934" data-color="#241934"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="tool-btn" id="clearBtn" title="Очистити все"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
<script>
// ВАЖЛИВО: це значення має ТОЧНО збігатися з назвою в каталозі бота (Catalog89.gs),
// інакше бот не покаже «Це ДЗ N» і не зніме ДЗ після виконання.
// Для сторінки «завдань» назва має вигляд «Назва теми (завдання)».
const TEST_NAME = "Головні члени речення";

// Слово в [[подвійних дужках]] автоматично підкреслюється.
const RAW = [
  {q:"Підмет виділено в реченні", opts:["Шипшина важко віддає [[плоди]].","Вода заливала хліви, кошари, [[клуні]].","Далеко в тишині чулися важкі [[кроки]].","Пам'ятаю правічний [[спокій]] полів."], a:2},
  {q:"Підмет виділено в реченні", opts:["Під ноги чужинцям гостинно сипали [[квіти]].","Земними плодами під зорями зоріє людини [[подвиг]].","Нехай тендітні пальці етики торкнуть вам серце і [[вуста]].","Мені поля задумано шептали свої ніким не співані [[пісні]]."], a:1},
  {q:"Присудок виділено в реченні", opts:["Вийшли з хати батько й мати в садок [[погуляти]].","Не пішов би я з ганьбою [[шукать]] ганьби на чужині.","Звичай [[фарбувати]] яйця на Великдень існує давно.","Весна ледачого не любить, вона проворного [[голубить]]."], a:3},
  {q:"Простий присудок ужито в реченні", opts:["На світі можна жить без еталонів, по-різному дивитися на світ...","Поету, кажуть, треба знати мову та ще потрібно вправно римувать.","Все на світі можна вибирати, сину, вибрати не можна тільки Батьківщину.","Будуть тебе кликати у сади зелені хлопців чорночубих диво-наречені."], a:3},
  {q:"Простий присудок виділено в реченні", opts:["Коли б злодійством збагачувались, миша [[стала б]] мільйонеркою.","Скільки б ворона не купалася, а гускою вона [[не стане]].","Дідусь уже занадто старий, щоб [[ставати]] до коси.","Зв'яжися з дурнем, то й сам дурнем [[станеш]]."], a:2},
  {q:"Іменну частину складеного присудка виражено дієприкметником у реченні", opts:["Шевченко близький нам своїм ідеалом вільної людини.","Вже день здається сивим і безсилим.","Степ у цю пору весь залитий сонцем.","Яким же ти розкішним став, наш степе!"], a:2},
  {q:"НЕМАЄ складеного іменного присудка в реченні", opts:["Печаль моя щаслива і гірка.","У морі чисті ми і душами високі.","Небо високе дарує нам радість.","Вона була схвильована, мов сад."], a:2},
  {q:"НЕМАЄ складеного іменного присудка в реченні", opts:["Промені як вії сонячних очей!","Співає соловей — співець любові.","Дуби поважні, а клени гордовиті.","Оманливою видалася погода."], a:1},
  {q:"Простий присудок ужито в реченні", opts:["Своє щастя можна шукати все життя.","Виспавшись, вовк побіг шукати поживу.","Треба шукати, а не пасивно спостерігати.","Ми починаємо шукати скарб — неопалиму купину."], a:1},
  {q:"НЕМАЄ складеного дієслівного присудка в реченні", opts:["Я хочу сказати серцем вистраждане слово.","Обрій почала огортати все густіша темрява.","Осляча голова мусить думати не менше за конячу.","Розпрягайте, хлопці, коні та лягайте спочивать."], a:3},
  {q:"НЕМАЄ складеного дієслівного присудка в реченні", opts:["Людські тривоги і боління я прагну в слово перелить.","Я хочу в пісню колискову вернутися бодай на мить.","Скорить повинні дощову ми непокірну хмару.","Осінь сіла відпочити на сосновому пеньку."], a:3},
  {q:"НЕМАЄ складеного дієслівного присудка в реченні", opts:["Зоря на небі рожева уже починала займатись.","Принаймні хоч гордині ніхто не сміє збавити людині.","Я квітку не можу зірвати, бо їй, як людині, болить.","Землю рідну, кревну і багату, будемо з тобою боронить."], a:3},
  {q:"НЕМАЄ складеного дієслівного присудка в реченні", opts:["Буду я в морі коня напувати, буду край моря доленьки шукати.","В години лихоліть важких і скрути біда нас намагалася зігнути.","Я трудно зиму пережити мушу і сподіватися на щедру душу.","А молодиці й підлітки малі хати білити разом заходились."], a:3},
  {q:"Простий підмет ужито в реченні", opts:["Чумацький Шлях освічує дорогу від Криму до Києва.","Крізь щілину пробивається кілька сонячних променів.","Кілька парубків скочило до танцю, потягши за собою дівчат.","Оця реальна мить вже завтра буде спомином.","Стежкою наближалися дві молодиці."], a:3},
  {q:"Простий підмет ужито в реченні", opts:["Хвилею зеленою піднімається навесні Батиєва гора.","П'ятірка сивих плотарів сиділа в тінях яворів.","Тут ми з Піратом і кинулися до моркви.","Усі ми прагнемо красу природи осягнуть.","Багряне сонце сутінню лісною у просвіт хмар показує кіно."], a:4},
  {q:"Простий підмет ужито в реченні", opts:["Твоє життя — то зорі світанкові, то сонце у негоду, дощ у спеку.","Десятки шкіл розпочали навчальний рік у нових приміщеннях.","Кожен з нас любов свою зберіг від зради, від зневаги й від смерті.","Чорне море омиває Кримський півострів.","Ой три шляхи широкії докупи зійшлися."], a:0},
  {q:"Підмет виражено неозначеною формою дієслова в реченні", opts:["Визволені не можуть забути своїх визволителів.","Потрапити в той дім було для нас усмішкою дитячої фортуни.","І залишився стояти дуб на злість усім вітрам і грозам.","Буде змушений упасти мертвим хижий птах.","Починає світати за лісом червоною барвою."], a:1},
  {q:"Підмет виражено неозначеною формою дієслова в реченні", opts:["Ми нічого спинити не в силі.","Сідати за стайню збирається сонце.","Намотати на вус — означає добре запам'ятати.","Іти мені додому неблизький світ.","Стати хліборобом радили мені з дитинства."], a:3},
  {q:"Простий дієслівний присудок ужито в реченні", opts:["Море було безбарвне, аж чорне.","Гірські печери ще затоплені водою.","Будуть тебе кликать у сади зелені хлопців чорночубих диво-наречені.","Щире кохання не вкрите серпанками.","У ці дні починає світати о шостій."], a:2},
  {q:"Простий дієслівний присудок ужито в реченні", opts:["Вести всі роботи з дотриманням графіка — золоте правило.","Найбільша наша турбота — виробити спільні рекомендації.","Гарним був Київ цього свіжого осіннього ранку.","Передавати досвід молодим — найбільше щастя.","О вісімнадцятій тридцять будь обов'язково вдома."], a:4},
  {q:"Складений іменний присудок ужито в реченні", opts:["Будить спогад давня пісня, пада в трави і зника.","Художник щоразу все мусить відкривати заново.","Сорок вісім могутніх струменів злилися в один велетенський водоспад.","А три покоління селянського дому вмістилися на знімках старого альбому.","Благословенна кожна мить життя на цих всесвітніх косовицях смерті!"], a:4},
  {q:"Іменну частину складеного присудка виражено прикметником у реченні", opts:["У містах земля одягнена в камінь і залізо.","Гомоніти з великим начальством було для мене втіхою.","У справедливих армій доля завжди прекрасна.","На гіллі рясному цвіт немов сніжинки.","Горобці в піску сипкому — ніби діти у ставку."], a:2},
  {q:"Складений дієслівний присудок ужито в реченні", opts:["Ліс стояв розхристаний, спустошений та дикий.","Золоточубий вересень прийшов позолотити дерева.","Життя стає радістю для кожного в рідному краю.","Хмари починають темніти, стають синьо-чорні.","Боятися смерті — на світі не жити."], a:3},
  {q:"Складений дієслівний присудок ужито в реченні", opts:["Заміж вийти — не дощову погоду пересидіти.","А ось тепер будемо вечеряти всі разом.","Любить людей мене навчила мати.","Моє серце прагне буять на просторі!","На дніпровській долині ромашка побита зів'яла."], a:3},
  {q:"Простий підмет є в реченні", opts:["Ми з тобою наче пара голубів.","Ми усі розбіжимося по русифікованих містах.","Кожен із нас розумів серйозність ситуації.","Ці дві жінки такі несхожі.","І місяць по кімнаті розкинув сатин."], a:4},
  {q:"Складений дієслівний присудок є в реченні", opts:["Твоя весна прийде нехай.","Хлопці й вухом не повели.","Ніч безмежна і пуста.","Ти в мене єдина.","І не треба нести мені квітку надії."], a:4},
  {q:"Складений іменний присудок є в реченні", opts:["Вибрати не можна тільки Батьківщину.","Нам треба поспішати.","Я можу не знати правильних слів.","Твоя врода — чистая вода.","Та хіба зуміє голос подолати ту печаль?"], a:3},
  {q:"Підмет виділено в реченні", opts:["Сірий кіт на призьбі біля хати шукає в тихих снах минулі [[дні]].","Нехай тендітні пальці етики торкнуть вам серце і [[вуста]].","Над синім бором у рудих корчах мела-крутила крута [[зима]].","Малі озерця блискають незлісно, колише хмара втомлені [[громи]].","Багряне сонце сутінню лісною у просвіт хмар показує [[кіно]]."], a:2},
  {q:"Підмет виділено в реченні", opts:["[[Циферблат]] годинника на розі хуртовини снігом замело.","Нещадний грудень з рук обох кладе на шлях [[замети]] сизі.","Суворий грудень зачинає [[заспів]] на довгі ночі, сизі холоди.","Вище всякої в світі краси — ніжна [[вдячність]] людської сльози.","А зоря вже кладе свій провісницький [[перст]] на далеку невидиму віху."], a:3}
];
const u_ = s => s.replace(/\[\[([^\]]+)\]\]/g, '<u>$1</u>');
const TEST = RAW.map(q => ({q: u_(q.q), opts: q.opts.map(u_), a: q.a}));

const SUB = {testName:TEST_NAME, title:"Тест: Головні члени речення", intro:"Формат НМТ — оберіть одну правильну відповідь у кожному питанні.", rawQ:true, questions:TEST};
const API_URL = "https://script.google.com/macros/s/AKfycbxWkeJYw7gUdEjM9H2oeMVTMhBLEq1dDa2DcqNS5vSQjJb19aXyR7p7kDz_otyK3sTggw/exec";
const LETTERS=["А","Б","В","Г","Д"];
let quizIdx=0, quizAnswers={}, _resultState='idle';
const lessonArea=document.getElementById('lessonArea');

// ?hw=... : "5" = з 5-го і далі; "5-10" = діапазон; "22-28,36-46" або "3 7 12" = лише ці питання
(function(){
  const hw=new URLSearchParams(location.search).get('hw'); if(!hw) return;
  const tokens=hw.replace(/[\u2010-\u2015\u2212]/g,'-').split(/[\s,;+]+/).filter(Boolean), multi=tokens.length>1, len=TEST.length, nums=new Set();
  tokens.forEach(t=>{let m;
    if((m=t.match(/^(\d+)-(\d+)$/))){for(let n=+m[1];n<=Math.min(len,+m[2]);n++)nums.add(n);}
    else if((m=t.match(/^(\d+)-$/))){for(let n=+m[1];n<=len;n++)nums.add(n);}
    else if((m=t.match(/^(\d+)$/))){ if(multi)nums.add(+m[1]); else for(let n=+m[1];n<=len;n++)nums.add(n); }});
  if(!nums.size) return;
  SUB._total=len;
  SUB.questions=TEST.map((q,i)=>Object.assign({},q,{_n:i+1})).filter(q=>nums.has(q._n));
})();
document.getElementById('totalTag').textContent = SUB.questions.length + ' завдань';

function wrongLabel(i){const q=SUB.questions[i];return (q&&q._n)||(i+1);}
function reviewLink(){
  const items=[];
  SUB.questions.forEach((q,i)=>{const r=quizAnswers[i]; if(r&&!r.correct) items.push(wrongLabel(i)+':'+r.picked);});
  return items.length ? location.origin+location.pathname+'?review='+encodeURIComponent(items.join('|')) : '';
}
function quizScore(){let c=0,a=0;SUB.questions.forEach((_,i)=>{const r=quizAnswers[i];if(r){a++;if(r.correct)c++;}});return {correct:c,answered:a,total:SUB.questions.length};}

async function sendResultOnce(){
  if(_resultState==='sending'||_resultState==='sent') return;
  const student=new URLSearchParams(location.search).get('student');
  const st=document.getElementById('sendStatus');
  if(!student||!API_URL){ if(st) st.textContent=''; return; }
  _resultState='sending';
  if(st){st.textContent='Надсилаємо результат...';st.className='send-status';}
  const {correct,answered,total}=quizScore();
  const wrongList=[]; SUB.questions.forEach((_,i)=>{const r=quizAnswers[i]; if(r&&!r.correct) wrongList.push(wrongLabel(i));});
  try{
    const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type:'quiz_result',student,testName:SUB.testName,correct,answered,total:(SUB._total||total),wrongList,reviewLink:reviewLink(),flaggedList:[]})});
    if(!resp||!resp.ok) throw new Error('bad status');
    _resultState='sent';
    if(st){st.textContent='Результат надіслано вчителю ✓';st.className='send-status ok';}
  }catch(e){
    _resultState='failed';
    if(st){
      st.innerHTML='Не вдалося надіслати результат (перевірте інтернет). <button class="btn ghost small" id="retrySendBtn">Спробувати ще раз</button>';
      st.className='send-status bad';
      document.getElementById('retrySendBtn').onclick=()=>{_resultState='idle';sendResultOnce();};
    }
  }
}

function renderReview(){
  let html='<p class="section-title">Розбір відповідей</p><p class="section-intro">Питання, в яких були помилки.</p>';
  String(window.__reviewMode).split('|').forEach(it=>{
    const k=it.indexOf(':'); if(k<0) return;
    const n=parseInt(it.slice(0,k),10), p=parseInt(it.slice(k+1),10), q=TEST[n-1]; if(!q) return;
    html+='<div style="margin:18px 0 6px;"><div class="qprog">Питання '+n+'</div><p class="qtext">'+q.q+'</p><div class="options">'+
      q.opts.map((o,i)=>{
        const cls=i===q.a?'correct':(i===p?'wrong':'dim');
        const b=i===q.a?'<span class="badge ok">✓</span>':(i===p?'<span class="badge no">✕</span>':'');
        return '<button class="opt '+cls+'" disabled><span class="tile"><span>'+LETTERS[i]+'</span>'+b+'</span><span>'+o+'</span></button>';
      }).join('')+'</div></div>';
  });
  lessonArea.innerHTML=html;
}

function attachTap(el,handler){
  if(!el) return;
  let sx=0,sy=0,penTap=false,tracking=false;
  el.addEventListener('pointerdown',e=>{tracking=true;sx=e.clientX;sy=e.clientY;penTap=e.pointerType==='pen';el.classList.add('pressed');},{passive:true});
  el.addEventListener('pointerup',e=>{
    el.classList.remove('pressed'); if(!tracking) return; tracking=false;
    if(penTap&&window.isDrawingActive&&window.isDrawingActive()) return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>10) return;
    handler(e);
  });
  el.addEventListener('pointercancel',()=>{tracking=false;el.classList.remove('pressed');});
  el.addEventListener('pointerleave',()=>{if(tracking)el.classList.remove('pressed');});
}

const drawStore={};
function drawKey(){return 'q'+quizIdx;}
function saveDrawing(){if(window.getDrawingSnapshot) drawStore[drawKey()]=window.getDrawingSnapshot();}
function restoreDrawing(){if(window.setDrawingSnapshot) window.setDrawingSnapshot(drawStore[drawKey()]||null);}
function syncCanvas(){
  if(window.resizeDrawCanvas) requestAnimationFrame(()=>requestAnimationFrame(()=>{window.resizeDrawCanvas();restoreDrawing();}));
}

function render(){
  const total=SUB.questions.length;
  lessonArea.innerHTML='<p class="section-title">'+SUB.title+'</p><p class="section-intro">'+SUB.intro+'</p>';
  if(quizIdx>=total){
    const {correct}=quizScore();
    const d=document.createElement('div');
    d.innerHTML='<div class="done-screen"><div class="ring"><div class="big">'+correct+'/'+total+'</div></div><p class="section-intro" style="margin-top:10px;">'+(correct===total?'Ідеально! Матеріал засвоєно 🎉':'Непогано — можна пройти ще раз.')+'</p><div class="send-status" id="sendStatus"></div><button class="btn primary" id="quizRestart" style="margin-top:6px;">Пройти ще раз</button></div>';
    lessonArea.appendChild(d);
    attachTap(document.getElementById('quizRestart'),()=>{quizIdx=0;quizAnswers={};_resultState='idle';render();});
    sendResultOnce(); syncCanvas(); return;
  }
  const q=SUB.questions[quizIdx], rec=quizAnswers[quizIdx], box=document.createElement('div');
  box.innerHTML='<div class="qprog">'+(q._n?('Питання '+q._n+' ('+(quizIdx+1)+' з '+total+')'):('Питання '+(quizIdx+1)+' з '+total))+'</div>'+
    '<p class="qtext">'+q.q+'</p><div class="options">'+
    q.opts.map((o,i)=>'<button class="opt" data-i="'+i+'" '+(rec?'disabled':'')+'><span class="tile"><span>'+LETTERS[i]+'</span></span><span>'+o+'</span></button>').join('')+'</div>'+
    '<div class="feedback '+(rec?'show '+(rec.correct?'ok':'bad'):'')+'">'+(rec?(rec.correct?'<span><b>Правильно.</b></span>':'<span>Правильна відповідь — '+LETTERS[q.a]+'.</span>'):'')+'</div>'+
    '<div class="nav-row"><button class="btn ghost" id="quizPrev" '+(quizIdx===0?'disabled':'')+'>← Назад</button><button class="btn primary" id="quizNext" '+(rec?'':'disabled')+'>'+(quizIdx===total-1?'До результату':'Далі →')+'</button></div>';
  lessonArea.appendChild(box);
  if(rec) box.querySelectorAll('.opt').forEach((btn,i)=>{
    const t=btn.querySelector('.tile');
    if(i===q.a){btn.classList.add('correct');t.insertAdjacentHTML('beforeend','<span class="badge ok">✓</span>');}
    else if(i===rec.picked){btn.classList.add('wrong');t.insertAdjacentHTML('beforeend','<span class="badge no">✕</span>');}
    else btn.classList.add('dim');
  });
  box.querySelectorAll('.opt').forEach(btn=>attachTap(btn,()=>{
    if(quizAnswers[quizIdx]) return;
    const picked=+btn.dataset.i; quizAnswers[quizIdx]={picked,correct:picked===q.a}; render();
  }));
  attachTap(document.getElementById('quizPrev'),()=>{saveDrawing();quizIdx--;render();});
  attachTap(document.getElementById('quizNext'),()=>{saveDrawing();quizIdx++;render();});
  syncCanvas();
}

const rv=new URLSearchParams(location.search).get('review');
if(rv){window.__reviewMode=rv;renderReview();} else render();

// ===== малювання поверх екрана (режим «учитель») =====
(function(){
  const canvas=document.getElementById('drawCanvas'), ctx=canvas.getContext('2d');
  const toggleBtn=document.getElementById('drawToggleBtn'), toolbar=document.getElementById('drawToolbar'), toolbarMini=document.getElementById('drawToolbarMini');
  const minimizeBtn=document.getElementById('minimizeBtn'), xthinBtn=document.getElementById('xthinBtn'), thinBtn=document.getElementById('thinBtn'), thickBtn=document.getElementById('thickBtn');
  const eraserBtn=document.getElementById('eraserBtn'), clearBtn=document.getElementById('clearBtn'), swatches=document.querySelectorAll('.swatch');
  let active=false, isDrawing=false, color="#F5304A", width=2, eraser=false, lastX=0, lastY=0, pid=null;
  window.isDrawingActive=()=>active;
  function docH(){return Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,window.innerHeight);}
  function resize(){
    const w=document.documentElement.clientWidth,h=docH();
    const prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;
    if(canvas.width&&canvas.height) prev.getContext('2d').drawImage(canvas,0,0);
    canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    if(prev.width&&prev.height) ctx.drawImage(prev,0,0,prev.width/devicePixelRatio,prev.height/devicePixelRatio);
  }
  window.resizeDrawCanvas=resize; resize();
  window.addEventListener('resize',resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(document.body);
  window.clearDrawing=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  window.getDrawingSnapshot=()=>{try{return(canvas.width&&canvas.height)?canvas.toDataURL('image/png'):null;}catch(e){return null;}};
  window.setDrawingSnapshot=function(url){
    ctx.clearRect(0,0,canvas.width,canvas.height); if(!url) return;
    const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio); img.src=url;
  };
  function setActive(on){active=on;toolbar.classList.toggle('show',on);toolbar.classList.remove('mini');toolbarMini.classList.remove('show');toggleBtn.classList.toggle('on',on);toggleBtn.title=on?'Вимкнути малювання':'Малювати';}
  toggleBtn.addEventListener('click',()=>setActive(!active));
  minimizeBtn.addEventListener('click',()=>{toolbar.classList.remove('show');toolbar.classList.add('mini');toolbarMini.classList.add('show');});
  toolbarMini.addEventListener('click',()=>{toolbar.classList.remove('mini');toolbar.classList.add('show');toolbarMini.classList.remove('show');});
  swatches.forEach(sw=>sw.addEventListener('click',()=>{swatches.forEach(s=>s.classList.remove('selected'));sw.classList.add('selected');color=sw.dataset.color;eraser=false;eraserBtn.classList.remove('selected');}));
  function setW(w,btn){width=w;[xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}
  xthinBtn.addEventListener('click',()=>setW(2,xthinBtn));
  thinBtn.addEventListener('click',()=>setW(5,thinBtn));
  thickBtn.addEventListener('click',()=>setW(11,thickBtn));
  eraserBtn.addEventListener('click',()=>{eraser=!eraser;eraserBtn.classList.toggle('selected',eraser);});
  clearBtn.addEventListener('click',()=>window.clearDrawing());
  function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||0.5};}
  const onCtl=e=>!!(e.target.closest&&e.target.closest('#drawToolbar,#drawToolbarMini,#drawToggleBtn'));
  document.addEventListener('pointerdown',e=>{
    if(!active||e.pointerType!=='pen'||onCtl(e)) return;
    e.preventDefault();isDrawing=true;pid=e.pointerId;const p=pos(e);lastX=p.x;lastY=p.y;
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!active||!isDrawing||e.pointerId!==pid) return;
    e.preventDefault();const p=pos(e);
    ctx.globalCompositeOperation=eraser?'destination-out':'source-over';ctx.strokeStyle=color;
    ctx.lineWidth=(eraser?width*3:width)*(0.6+p.p*0.8);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;
  },{passive:false});
  const stop=e=>{if(e&&e.pointerId!==undefined&&e.pointerId!==pid) return;isDrawing=false;pid=null;};
  document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop);
  document.addEventListener('touchmove',e=>{if(active&&e.touches&&e.touches[0]&&e.touches[0].touchType==='stylus') e.preventDefault();},{passive:false});
})();
</script>
