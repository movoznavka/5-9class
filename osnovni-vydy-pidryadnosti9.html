<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Основні види підрядності · Тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FDE6CF; --bg-soft:#FFF3E6; --card:#FFFFFF; --ink:#0F2238; --ink-soft:#5B7690;
    --line: rgba(15,34,56,0.1);
    --c1-a:#FFC58A; --c1-b:#EC7A1C; --c1-sh: rgba(236,122,28,0.4);
    --c3-b:#17A863; --c2-b:#EF6A66;
    --correct-bg:#E2F6EA; --correct-ink:#128A54; --wrong-bg:#FBE6E1; --wrong-ink:#C8442B;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px;position:relative;}
  .wrap{max-width:760px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(36,25,52,0.14);}
  .kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.55;}
  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,5.6vw,36px);line-height:1.08;letter-spacing:-0.01em;margin:0 0 18px;text-transform:uppercase;}
  .card{background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:0 20px 44px -28px rgba(36,25,52,0.35);}
  .section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;letter-spacing:-0.005em;margin:0 0 8px;}
  .section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}

  .qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .qtext{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;line-height:1.4;margin:0 0 18px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--bg-soft);cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);transition:transform .12s ease, background .15s ease;}
  .opt:hover{transform:translateY(-1px);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:hover{transform:none;}
  .tile{position:relative;width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--c1-b);background:linear-gradient(150deg, rgba(255,255,255,0.75), rgba(139,92,246,0.22));border:1px solid rgba(255,255,255,0.7);box-shadow:0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);}
  .badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;}
  .badge.ok{background:var(--c3-b);} .badge.no{background:var(--c2-b);}
  .opt.correct{background:var(--correct-bg);} .opt.wrong{background:var(--wrong-bg);} .opt.dim{opacity:.5;}

  .feedback{margin-top:16px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;display:none;align-items:center;gap:9px;}
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--correct-bg);color:var(--correct-ink);}
  .feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink);}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .btn{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
  .btn.ghost.small{padding:8px 14px;font-size:12px;}
  .opt.pressed{transform:scale(0.98);background:#EEE6FB;}
  .btn.pressed{transform:scale(0.95);filter:brightness(0.94);}

  .done-screen{text-align:center;}
  .done-screen .ring{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 16px 30px -12px var(--c1-sh);display:flex;align-items:center;justify-content:center;}
  .done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;}
  .done-screen .send-status{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:10px;min-height:18px;}
  .done-screen .send-status.ok{color:var(--correct-ink);}
  .done-screen .send-status.bad{color:var(--c2-b);}
  .hint-box{margin-top:10px;padding:12px 15px;border-radius:14px;background:var(--bg-soft);color:var(--ink);font-size:13.5px;line-height:1.5;font-weight:500;}
  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}

  /* ===== DRAWING / TEACHER MODE ===== */
  #drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none;}
  #drawToggleBtn{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));backdrop-filter:blur(10px) saturate(160%);-webkit-backdrop-filter:blur(10px) saturate(160%);box-shadow:0 14px 28px -10px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.6), inset 0 -6px 10px -4px rgba(0,0,0,0.15);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .18s cubic-bezier(.34,1.56,.64,1), background .2s ease;}
  #drawToggleBtn svg{width:24px;height:24px;display:block;transition:transform .25s ease;}
  #drawToggleBtn:active{transform:scale(0.90);}
  #drawToggleBtn.on{background:linear-gradient(150deg, rgba(255,255,255,0.35), rgba(255,255,255,0) 60%),linear-gradient(155deg,#FF8A65,var(--c2-b));}
  #drawToggleBtn.on svg{transform:rotate(90deg);}
  #drawToolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;display:flex;align-items:center;gap:12px;background:linear-gradient(150deg, rgba(255,255,255,0.6), rgba(255,255,255,0.15));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.7);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(36,25,52,0.45), inset 0 1px 1px rgba(255,255,255,0.9);z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;pointer-events:none;}
  #drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
  #drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;pointer-events:none;}
  #drawToolbarMini{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(0.9);opacity:0;width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 10px 20px -10px var(--c1-sh);display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1), opacity .2s ease;pointer-events:none;}
  #drawToolbarMini svg{width:18px;height:18px;}
  #drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(36,25,52,0.35), inset 0 1px 1px rgba(255,255,255,0.5);cursor:pointer;padding:0;transition:transform .15s cubic-bezier(.34,1.56,.64,1);}
  .swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(0.7);transition:opacity .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);}
  .swatch.selected{transform:scale(1.08);} .swatch.selected::after{opacity:1;transform:scale(1);}
  .tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.5);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s ease, color .15s ease, transform .15s cubic-bezier(.34,1.56,.64,1);}
  .tool-btn svg{width:16px;height:16px;}
  .tool-btn .dot{border-radius:50%;background:currentColor;}
  #xthinBtn .dot{width:3.5px;height:3.5px;} #thinBtn .dot{width:7px;height:7px;} #thickBtn .dot{width:12.5px;height:12.5px;}
  .tool-btn.selected{background:var(--c1-b);color:#fff;transform:scale(1.06);}
  .tool-sep{width:1px;height:22px;background:rgba(36,25,52,0.14);}
  @media (max-width:480px){
    #drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px;}
    .swatch{width:21px;height:21px;} .tool-btn{width:30px;height:30px;} .tool-btn svg{width:14px;height:14px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Види підрядності · 9 клас · Тест</div>
  </div>

  <h1>Тест</h1>

  <div class="card" id="lessonArea"></div>

  <footer>@movoznavka</footer>
</div>

<canvas id="drawCanvas"></canvas>

<button id="drawToggleBtn" title="Малювати">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#241934" data-color="#241934"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
    </svg>
  </button>
  <button class="tool-btn" id="clearBtn" title="Очистити все">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</button>

<script>
/* ============================================================
   ТЕСТ. Питання — у масиві questions: {q, opts:[варіанти], a:індекс правильного, hint:пояснення}.
   testName має збігатись з назвою тесту в списку TOPICS у Code89.gs
   (тоді бот підписує результат як ДЗ).
   ============================================================ */
const TOPICS = {
  test: { label:"Тест", subs:[
    { title:"Основні види підрядності",
      intro:"",
      testName:"Основні види підрядності",
      rawQ:true,
      questions:[
        {q:"Визначте вид підрядності в реченні:<br><i>Він зізнався, що чув, що завтра відмінять уроки.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:2,
         hint:"Перша підрядна «що чув» залежить від головної, а друга «що завтра відмінять уроки» пояснює слово «чув» у першій підрядній. Це ланцюжок — послідовна підрядність, хоч сполучне слово однакове."},
        {q:"Визначте вид підрядності в реченні:<br><i>Мати хотіла, щоб діти виросли чесними і щоб вони не забували рідну домівку.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:0,
         hint:"Обидві підрядні залежать від слова «хотіла», відповідають на те саме питання (чого?), мають однакове сполучне слово й з'єднані сурядним сполучником «і»."},
        {q:"Визначте вид підрядності в реченні:<br><i>Я люблю книжки, які вчать добра, і друзів, які вміють підтримати.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:1,
         hint:"Сполучне слово однакове, але підрядні пояснюють різні слова головної частини («книжки» і «друзів»), тому підрядність неоднорідна."},
        {q:"Визначте вид підрядності в реченні:<br><i>Коли настала весна, ми пішли до лісу, де співали птахи.</i>",
         opts:["Послідовна","Мішана","Однорідна","Неоднорідна (паралельна)"], a:3,
         hint:"Обидві підрядні залежать від головної частини, але відповідають на різні питання: «коли?» (до дієслова «пішли») та «якого?» (до слова «лісу»)."},
        {q:"Визначте вид підрядності в реченні:<br><i>Я переконаний, що ти знаєш, де ми ховали скарб, і що розкажеш про це.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:3,
         hint:"Підрядна «де ми ховали скарб» залежить від першої підрядної (послідовність), а «що ти знаєш» і «що розкажеш» — однорідні підрядні до слова «переконаний». Поєднання двох видів — мішана підрядність."},
        {q:"У якому реченні підрядність послідовна?",
         opts:["Ми чекали, поки вщухне дощ і поки розвиднеється.","Учителька пояснила, що слова, які ми вивчили, треба вживати правильно.","Коли зійшло сонце, ми вирушили туди, де починалася стежка.","Ми знали, що він чесний і що він не зрадить."], a:1,
         hint:"У другому реченні підрядна «які ми вивчили» залежить від слова «слова» у підрядній частині «що слова … треба вживати правильно»."},
        {q:"У якому реченні всі підрядні частини однорідні?",
         opts:["Коли настав вечір, ми повернулися до села, яке сховалося в долині.","Він сказав, що знає, де лежить ключ.","Ми дивилися, як сонце сідає за гору, як небо палає багрянцем.","Я тримаю слово, яке дав, бо так велить совість."], a:2,
         hint:"У третьому реченні обидві підрядні залежать від слова «дивилися», відповідають на те саме питання й мають однакове сполучне слово «як»."},
        {q:"Скільки підрядних частин у реченні та який вид підрядності?<br><i>Ми зрозуміли, що перемога буде за тими, хто не здається, і що сила — в єдності.</i>",
         opts:["Три підрядні; мішана","Три підрядні; послідовна","Дві підрядні; однорідна","Три підрядні; однорідна"], a:0,
         hint:"Підрядна «хто не здається» залежить від слова «тими» в першій підрядній (послідовність), а «що перемога буде…» і «що сила — в єдності» однорідні. Разом — мішана підрядність."},
        {q:"Визначте вид підрядності в реченні:<br><i>Книжка, яку я прочитав, переконала мене, що добро перемагає.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:1,
         hint:"Підрядна «яку я прочитав» пояснює слово «книжка», а «що добро перемагає» — слово «переконала». Обидві залежать від головної частини й відповідають на різні питання."},
        {q:"У якому реченні підрядна частина залежить не від головної, а від іншої підрядної?",
         opts:["Ми зупинилися там, де річка робить поворот.","Батько радив, щоб ми пам'ятали, звідки ми родом.","Коли заходило сонце, хмари палали, ніби хтось розпалив вогнище.","Я прийшов, бо хотів тебе побачити."], a:1,
         hint:"У другому реченні підрядна «звідки ми родом» залежить від слова «пам'ятали» у підрядній «щоб ми пам'ятали»."},
        {q:"Визначте вид підрядності в реченні:<br><i>Ми знали, що, якщо будемо старатися, то досягнемо мети.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:2,
         hint:"Підрядна «якщо будемо старатися» вставлена всередину підрядної «що … досягнемо мети» і залежить від її присудка «досягнемо». Це послідовна підрядність."},
        {q:"Скільки підрядних частин і який вид підрядності в реченні?<br><i>Він сказав, що чув, як учителі говорили, що екзамени перенесли.</i>",
         opts:["Три підрядні; однорідна","Три підрядні; послідовна","Дві підрядні; послідовна","Три підрядні; мішана"], a:1,
         hint:"Утворюється ланцюжок: головна → «що чув» → «як учителі говорили» → «що екзамени перенесли». Кожна наступна залежить від попередньої."},
        {q:"Скільки підрядних частин і який вид підрядності в реченні?<br><i>Я бачив, як зорі згасали, як птахи прокидалися і як сонце виринало з туману.</i>",
         opts:["Три підрядні; однорідна","Три підрядні; послідовна","Дві підрядні; однорідна","Три підрядні; неоднорідна"], a:0,
         hint:"Усі три підрядні залежать від слова «бачив», відповідають на те саме питання (що?) і мають однакове сполучне слово «як»."},
        {q:"Визначте вид підрядності в реченні:<br><i>Коли минуло літо, я повернувся до міста, де жив, і зрозумів, що скучив.</i>",
         opts:["Однорідна","Неоднорідна (паралельна)","Послідовна","Мішана"], a:1,
         hint:"Усі підрядні залежать від головної частини, але відповідають на різні питання: «коли?», «якого?» (до слова «міста»), «що?» (до слова «зрозумів»)."},
        {q:"Яке твердження про речення правильне?<br><i>Усі помітили, що хлопець, який стояв осторонь, збентежений.</i>",
         opts:["Обидві підрядні залежать від головної частини, підрядність неоднорідна.","Підрядна «який стояв осторонь» залежить від слова «хлопець» у першій підрядній, підрядність послідовна.","Підрядні однорідні, бо мають сполучні слова «що» і «який».","Підрядність мішана, бо в реченні є дві підрядні частини."], a:1,
         hint:"Друга підрядна вставлена в першу («що хлопець … збентежений») і пояснює слово «хлопець». Тому підрядність послідовна."},
        {q:"У якому реченні підрядність неоднорідна?",
         opts:["Мене тішило, що ти повернувся і що ми знову разом.","Ми вирішили, що поїдемо тоді, коли спаде спека.","Хоч надворі було холодно, діти гралися на вулиці, де лежав сніг.","Я не знаю, чи він прийде і чи буде з нами."], a:2,
         hint:"У третьому реченні підрядна «хоч надворі було холодно» належить до головної частини (умова, значення допусту), а «де лежав сніг» пояснює слово «на вулиці» (місце) — різні питання."},
        {q:"Скільки підрядних частин і який вид підрядності в реченні?<br><i>Дід розповів, що, коли він був малим, у селі стояв млин, який давно зруйнували, і що там колись жив мірошник.</i>",
         opts:["Три підрядні; послідовна","Чотири підрядні; мішана","Чотири підрядні; послідовна","Чотири підрядні; однорідна"], a:1,
         hint:"Підрядні «що … стояв млин» і «що там колись жив мірошник» однорідні (залежать від «розповів»). До першої з них належать «коли він був малим» і «який давно зруйнували». Поєднання кількох видів — мішана підрядність."},
        {q:"У якому реченні є і послідовна, і однорідна підрядність?",
         opts:["Я знаю, що ти прийдеш і що принесеш книжку.","Брат розповів, що бачив, як птахи летіли на південь і як зникали за обрієм.","Ми вийшли, коли розвиднілося, і прийшли туди, де чекав друг.","Я бачив, що ти знаєш, як це зробити."], a:1,
         hint:"Підрядні «як птахи летіли…» і «як зникали…» однорідні й залежать від слова «бачив» у підрядній «що бачив» (послідовність щодо головної)."},
        {q:"Скільки підрядних частин і який вид підрядності в реченні?<br><i>Хто не вміє цінувати те, що має, той ніколи не буде щасливим.</i>",
         opts:["Дві підрядні; однорідна","Дві підрядні; неоднорідна","Дві підрядні; послідовна","Дві підрядні; мішана"], a:2,
         hint:"Підрядна «що має» залежить від слова «те» в підрядній «хто не вміє цінувати те», яка стоїть перед головною частиною й розривається. Це послідовна підрядність."},
        {q:"Яка підрядна частина залежить від дієслова «побачимо» в реченні?<br><i>Я чув, що коли зійде сонце, туман розтане, і що тоді ми побачимо, куди йти.</i>",
         opts:["«що коли зійде сонце, туман розтане»","«куди йти»","«коли зійде сонце»","«що тоді ми побачимо»"], a:1,
         hint:"Підрядна «куди йти» залежить від слова «побачимо» у підрядній «що тоді ми побачимо». Підрядні «що … туман розтане» і «що тоді ми побачимо» однорідні, а «коли зійде сонце» залежить від слова «розтане»."}
      ]
    }
  ]}
};
/* /exec-посилання Apps Script проєкту бота @resultat89_bot (те саме, що HOMEWORK_API_URL в index89.html) */
const API_URL = "https://script.google.com/macros/s/AKfycbxWkeJYw7gUdEjM9H2oeMVTMhBLEq1dDa2DcqNS5vSQjJb19aXyR7p7kDz_otyK3sTggw/exec";
let _resultState = 'idle'; // idle | sending | sent | failed

async function sendResultOnce_(s){
  if(_resultState === 'sending' || _resultState === 'sent') return;
  const student = new URLSearchParams(location.search).get('student');
  const statusEl = document.getElementById('sendStatus');
  if(!student || !API_URL || API_URL.indexOf('ВСТАВТЕ') === 0){
    if(statusEl) statusEl.textContent = '';
    return;
  }
  _resultState = 'sending';
  if(statusEl){ statusEl.textContent = 'Надсилаємо результат...'; statusEl.className = 'send-status'; }
  const {correct, answered, total} = quizScore(s.questions);
  const wrongList = [];
  s.questions.forEach((_,i)=>{ const r = quizAnswers[i]; if(r && !r.correct) wrongList.push(__wrongLabel_(s,i)); });
  try{
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({type:'quiz_result', student, testName: s.testName, correct, answered, total: (s._total||total), wrongList, reviewLink: __reviewLink_(s), flaggedList:[]})
    });
    if(!resp || !resp.ok) throw new Error('bad status');
    _resultState = 'sent';
    if(statusEl){ statusEl.textContent = 'Результат надіслано вчителю ✓'; statusEl.className = 'send-status ok'; }
  }catch(e){
    _resultState = 'failed';
    if(statusEl){
      statusEl.innerHTML = 'Не вдалося надіслати результат (перевірте інтернет). <button class="btn ghost small" id="retrySendBtn">Спробувати ще раз</button>';
      statusEl.className = 'send-status bad';
      const retryBtn = document.getElementById('retrySendBtn');
      if(retryBtn) retryBtn.onclick = ()=>{ _resultState = 'idle'; sendResultOnce_(s); };
    }
  }
}

const LETTERS = ["А","Б","В","Г","Д","Е","Є"];
let activeTopic = "test";
let activeSub = 0;
let quizIdx = 0;
let quizAnswers = {};

// ?hw=... — що відкривати (задає бот): "5" = питання 5 і далі; "5-10" = діапазон; "3 7 12" = лише ці питання.
function __hwParse_(hwParam, subs){
  const tokens = String(hwParam||'').split(/[\s,;+]+/).filter(Boolean);
  if(!tokens.length) return null;
  const multi = tokens.length > 1;
  const sub = subs[0];
  const len = (sub.questions||[]).length;
  const nums = new Set();
  tokens.forEach(function(tok){
    let m;
    if((m = tok.match(/^(\d+)-$/))){ for(let n=+m[1]; n<=len; n++) nums.add(n); }
    else if((m = tok.match(/^(\d+)-(\d+)$/))){ for(let n=+m[1]; n<=Math.min(len,+m[2]); n++) nums.add(n); }
    else if((m = tok.match(/^(\d+)$/))){ if(multi) nums.add(+m[1]); else for(let n=+m[1]; n<=len; n++) nums.add(n); }
  });
  if(!nums.size) return null;
  const qs = sub.questions.map(function(q,i){ return Object.assign({}, q, {_n:i+1}); }).filter(function(q){ return nums.has(q._n); });
  if(!qs.length) return null;
  return [Object.assign({}, sub, {questions: qs, _total: len})];
}

(function applyHomeworkParam_(){
  const P = new URLSearchParams(location.search);
  if(P.get('review')){ window.__reviewMode = P.get('review'); return; }
  const hwParam = P.get('hw');
  if(!hwParam) return;
  const res = __hwParse_(hwParam, TOPICS[activeTopic].subs);
  if(res){ TOPICS[activeTopic].subs = res; activeSub = 0; quizIdx = 0; }
})();

function __wrongLabel_(s, i){ return (s.questions[i] && s.questions[i]._n) || (i+1); }
function __reviewLink_(s){
  const items = [];
  s.questions.forEach(function(q,i){
    const r = quizAnswers[i];
    if(r && !r.correct) items.push(__wrongLabel_(s,i) + ':' + r.picked);
  });
  if(!items.length) return '';
  return location.origin + location.pathname + '?review=' + encodeURIComponent(items.join('|'));
}
function renderReview_(){
  const s = TOPICS[activeTopic].subs[0];
  const area = document.getElementById('lessonArea');
  let html = '<p class="section-title">Розбір відповідей</p><p class="section-intro">Питання, в яких були помилки.</p>';
  String(window.__reviewMode).split('|').forEach(function(it){
    const k = it.indexOf(':');
    const n = parseInt(k < 0 ? it : it.slice(0,k), 10);
    const p = k < 0 ? -1 : parseInt(it.slice(k+1), 10);
    const q = s.questions[n-1];
    if(!q) return;
    html += '<div style="margin:18px 0 6px;"><div class="qprog">Питання ' + n + '</div>';
    html += '<p class="qtext">' + q.q + '</p><div class="options">' + q.opts.map(function(o,i){
      const cls = i === q.a ? 'correct' : (i === p ? 'wrong' : 'dim');
      const badge = i === q.a ? '<span class="badge ok">✓</span>' : (i === p ? '<span class="badge no">✕</span>' : '');
      return '<button class="opt ' + cls + '" disabled><span class="tile"><span>' + LETTERS[i] + '</span>' + badge + '</span><span>' + o + '</span></button>';
    }).join('') + '</div>';
    if(q.hint) html += '<div class="hint-box">' + q.hint + '</div>';
    html += '</div>';
  });
  area.innerHTML = html;
}

const lessonArea = document.getElementById('lessonArea');
function resetQuiz(){ quizIdx = 0; quizAnswers = {}; _resultState = 'idle'; }
function currentSub(){ return TOPICS[activeTopic].subs[activeSub]; }

const drawStore = {};
function sectionKey(){ return activeTopic + '__' + activeSub + '__q' + quizIdx; }
function saveCurrentDrawing(){ if(window.getDrawingSnapshot) drawStore[sectionKey()] = window.getDrawingSnapshot(); }
function restoreCurrentDrawing(){ if(window.setDrawingSnapshot) window.setDrawingSnapshot(drawStore[sectionKey()] || null); }

function renderContent(){
  const s = currentSub();
  lessonArea.innerHTML = `<p class="section-title">${s.title}</p>${s.intro ? `<p class="section-intro">${s.intro}</p>` : ""}`;
  renderQuiz(s);
  syncCanvasAfterRender();
}

function syncCanvasAfterRender(){
  if(window.resizeDrawCanvas){
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ window.resizeDrawCanvas(); restoreCurrentDrawing(); }));
  }
}

function quizScore(qs){
  let correct = 0, answered = 0;
  qs.forEach((_,i)=>{ const r = quizAnswers[i]; if(r){ answered++; if(r.correct) correct++; } });
  return {correct, answered, total: qs.length};
}

function renderQuiz(s){
  const total = s.questions.length;

  if(quizIdx >= total){
    const {correct} = quizScore(s.questions);
    const extra = document.createElement('div');
    extra.innerHTML = `
      <div class="done-screen">
        <div class="ring"><div class="big">${correct}/${total}</div></div>
        <p class="section-intro" style="margin-top:10px;">${correct===total ? 'Ідеально! Матеріал засвоєно 🎉' : 'Непогано — можна пройти ще раз.'}</p>
        <div class="send-status" id="sendStatus"></div>
        <button class="btn primary" id="quizRestart" style="margin:6px auto 0;">Пройти ще раз</button>
      </div>`;
    lessonArea.appendChild(extra);
    attachTapToggle(document.getElementById('quizRestart'), ()=>{ resetQuiz(); renderContent(); });
    sendResultOnce_(s);
    return;
  }

  const q = s.questions[quizIdx];
  const rec = quizAnswers[quizIdx];
  const box = document.createElement('div');
  const opts = q.opts;
  box.innerHTML = `
    <div class="qprog">${q._n ? ('Питання '+q._n+' ('+(quizIdx+1)+' з '+total+')') : ('Питання '+(quizIdx+1)+' з '+total)}</div>
    <p class="qtext">${s.rawQ ? q.q : '«'+q.q+'»'}</p>
    <div class="options">
      ${opts.map((o,i)=>`
        <button class="opt" data-i="${i}" ${rec?'disabled':''}>
          <span class="tile"><span>${LETTERS[i]}</span></span><span>${o}</span>
        </button>`).join('')}
    </div>
    <div class="feedback ${rec?'show '+(rec.correct?'ok':'bad'):''}">
      ${rec ? (rec.correct ? `<span><b>Правильно.</b></span>` : `<span>Правильна відповідь — ${LETTERS[q.a]}. ${opts[q.a]}</span>`) : ''}
    </div>
    ${rec && q.hint ? '<div class="hint-box">'+q.hint+'</div>' : ''}
    <div class="nav-row">
      <button class="btn ghost" id="quizPrev" ${quizIdx===0?'disabled':''}>← Назад</button>
      <button class="btn primary" id="quizNext" ${rec?'':'disabled'}>${quizIdx===total-1?'До результату':'Далі →'}</button>
    </div>`;
  lessonArea.appendChild(box);

  if(rec){
    box.querySelectorAll('.opt').forEach((btn,i)=>{
      const tile = btn.querySelector('.tile');
      if(i===q.a){ btn.classList.add('correct'); tile.insertAdjacentHTML('beforeend','<span class="badge ok">✓</span>'); }
      else if(i===rec.picked){ btn.classList.add('wrong'); tile.insertAdjacentHTML('beforeend','<span class="badge no">✕</span>'); }
      else { btn.classList.add('dim'); }
    });
  }
  box.querySelectorAll('.opt').forEach(btn=>{
    attachTapToggle(btn, ()=>{
      if(quizAnswers[quizIdx]) return;
      const picked = +btn.dataset.i;
      quizAnswers[quizIdx] = {picked, correct: picked===q.a};
      renderContent();
    });
  });

  const prevBtn = document.getElementById('quizPrev');
  const nextBtn = document.getElementById('quizNext');
  if(prevBtn) attachTapToggle(prevBtn, ()=>{ saveCurrentDrawing(); quizIdx--; renderContent(); });
  if(nextBtn) attachTapToggle(nextBtn, ()=>{ saveCurrentDrawing(); quizIdx++; renderContent(); });
}

function attachTapToggle(el, handler){
  if(!el) return;
  let sx = 0, sy = 0, penTap = false, tracking = false;
  el.addEventListener('pointerdown', (e)=>{
    tracking = true; sx = e.clientX; sy = e.clientY; penTap = e.pointerType === 'pen';
    el.classList.add('pressed');
  }, {passive:true});
  el.addEventListener('pointerup', (e)=>{
    el.classList.remove('pressed');
    if(!tracking) return;
    tracking = false;
    if(penTap && window.isDrawingActive && window.isDrawingActive()) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if(Math.hypot(dx,dy) > 10) return;
    handler(e);
  });
  el.addEventListener('pointercancel', ()=>{ tracking = false; el.classList.remove('pressed'); });
  el.addEventListener('pointerleave', ()=>{ if(tracking) el.classList.remove('pressed'); });
}
window.attachTapToggle = attachTapToggle;

if(window.__reviewMode){ renderReview_(); } else { renderContent(); }

// МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель")

(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const toolbarMini = document.getElementById('drawToolbarMini');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const xthinBtn = document.getElementById('xthinBtn');
  const thinBtn = document.getElementById('thinBtn');
  const thickBtn = document.getElementById('thickBtn');
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false, isDrawing = false, currentColor = "#F5304A", currentWidth = 4;
  let eraserMode = false, lastX = 0, lastY = 0, activePointerId = null;

  window.isDrawingActive = function(){ return drawingActive; };
  function currentDocHeight(){ return Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, window.innerHeight); }

  function resizeCanvas(){
    const docWidth = document.documentElement.clientWidth;
    const docHeight = currentDocHeight();
    const prev = document.createElement('canvas');
    prev.width = canvas.width; prev.height = canvas.height;
    if(canvas.width && canvas.height){ prev.getContext('2d').drawImage(canvas, 0, 0); }
    canvas.width = docWidth * devicePixelRatio;
    canvas.height = docHeight * devicePixelRatio;
    canvas.style.width = docWidth + 'px';
    canvas.style.height = docHeight + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if(prev.width && prev.height){ ctx.drawImage(prev, 0, 0, prev.width / devicePixelRatio, prev.height / devicePixelRatio); }
  }
  window.resizeDrawCanvas = resizeCanvas;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);
  if(window.ResizeObserver){ new ResizeObserver(()=> resizeCanvas()).observe(document.body); }

  window.clearDrawing = function(){ ctx.clearRect(0, 0, canvas.width, canvas.height); };
  window.getDrawingSnapshot = function(){ try{ return (canvas.width && canvas.height) ? canvas.toDataURL('image/png') : null; }catch(e){ return null; } };
  window.setDrawingSnapshot = function(dataURL){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!dataURL) return;
    const img = new Image();
    img.onload = function(){ ctx.drawImage(img, 0, 0, canvas.width / devicePixelRatio, canvas.height / devicePixelRatio); };
    img.src = dataURL;
  };

  function setActive(on){
    drawingActive = on;
    toolbar.classList.toggle('show', on);
    toolbar.classList.remove('mini');
    if(toolbarMini) toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on', on);
    toggleBtn.title = on ? 'Вимкнути малювання' : 'Малювати';
  }
  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));

  minimizeBtn.addEventListener('click', ()=>{ toolbar.classList.remove('show'); toolbar.classList.add('mini'); toolbarMini.classList.add('show'); });
  toolbarMini.addEventListener('click', ()=>{ toolbar.classList.remove('mini'); toolbar.classList.add('show'); toolbarMini.classList.remove('show'); });

  swatches.forEach(sw=>{
    sw.addEventListener('click', ()=>{
      swatches.forEach(s=>s.classList.remove('selected'));
      sw.classList.add('selected');
      currentColor = sw.dataset.color;
      eraserMode = false;
      eraserBtn.classList.remove('selected');
    });
  });
  function setWidth(w, btn){ currentWidth = w; [xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); }
  xthinBtn.addEventListener('click', ()=> setWidth(2, xthinBtn));
  thinBtn.addEventListener('click', ()=> setWidth(5, thinBtn));
  thickBtn.addEventListener('click', ()=> setWidth(11, thickBtn));
  eraserBtn.addEventListener('click', ()=>{ eraserMode = !eraserMode; eraserBtn.classList.toggle('selected', eraserMode); });
  clearBtn.addEventListener('click', ()=>{ window.clearDrawing(); });

  function pointerPos(e){
    const rect = canvas.getBoundingClientRect();
    return { x: e.clientX - rect.left, y: e.clientY - rect.top, pressure: e.pressure || 0.5 };
  }
  function isOnControls(e){ return !!(e.target.closest && e.target.closest('#drawToolbar, #drawToolbarMini, #drawToggleBtn')); }

  document.addEventListener('pointerdown', (e)=>{
    if(!drawingActive || e.pointerType !== 'pen' || isOnControls(e)) return;
    e.preventDefault();
    isDrawing = true; activePointerId = e.pointerId;
    const p = pointerPos(e); lastX = p.x; lastY = p.y;
  }, { passive: false });

  document.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing || e.pointerId !== activePointerId) return;
    e.preventDefault();
    const p = pointerPos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    const pressureFactor = 0.6 + (p.pressure || 0.5) * 0.8;
    ctx.lineWidth = (eraserMode ? currentWidth * 3 : currentWidth) * pressureFactor;
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  }, { passive: false });

  function stopDrawing(e){
    if(e && e.pointerId !== undefined && e.pointerId !== activePointerId) return;
    isDrawing = false; activePointerId = null;
  }
  document.addEventListener('pointerup', stopDrawing);
  document.addEventListener('pointercancel', stopDrawing);
  document.addEventListener('touchmove', function(e){
    if(drawingActive && e.touches && e.touches[0] && e.touches[0].touchType === 'stylus'){ e.preventDefault(); }
  }, { passive: false });
})();
</script>
