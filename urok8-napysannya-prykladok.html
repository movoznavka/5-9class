<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Правопис прикладок · Урок</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFE9DC;--bg-soft:#FFF4EC;--card:#FFFFFF;--ink:#0F2238;--ink-soft:#5B7690;--line:rgba(15,34,56,.1);
--c1-a:#FFB27A;--c1-b:#E8590C;--c1-sh:rgba(232,89,12,.4);--c3-b:#17A863;--c2-b:#EF6A66;--terra:#EF6A66;--amber:#C56A0E;
--correct-bg:#E2F6EA;--correct-ink:#128A54;--wrong-bg:#FBE6E1;--wrong-ink:#C8442B;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px;position:relative}
.wrap{max-width:760px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(15,34,56,.12)}
.kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(28px,6.5vw,44px);line-height:1.08;margin:0 0 22px;text-transform:uppercase}
h1 .hl{color:var(--c1-b)}
.topictoggle{display:flex;gap:10px;margin-bottom:14px}
.topictoggle button{flex:1;padding:15px;border-radius:20px;border:none;background:var(--card);font-family:'Manrope',sans-serif;font-weight:800;font-size:14.5px;color:var(--ink-soft);cursor:pointer;box-shadow:0 8px 18px -14px rgba(15,34,56,.4)}
.topictoggle button.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -10px var(--c1-sh)}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.tab{padding:10px 15px 10px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:#fff;color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 20px -12px rgba(15,34,56,.5);transition:transform .13s ease}
.tab:hover{transform:translateY(-2px)}
.tab .dot{width:22px;height:22px;border-radius:8px;background:rgba(232,89,12,.15);color:var(--c1-b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.tab.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;border-color:transparent;box-shadow:0 12px 22px -8px var(--c1-sh)}
.tab.active .dot{background:rgba(255,255,255,.28);color:#fff}
.card{background:var(--card);border-radius:28px;padding:40px 24px 28px;box-shadow:0 20px 44px -28px rgba(15,34,56,.5)}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;margin:0 0 8px}
.section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px}
.section-intro b{color:var(--ink)}
.s{background:#17A863;color:#fff;border-radius:6px;padding:1px 7px;font-weight:700}
.m{background:var(--terra);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700}
.d{background:var(--c1-b);color:#fff;border-radius:6px;padding:1px 7px;font-weight:700}
.cardwrap{position:relative}
.qflag{position:absolute;top:-24px;right:14px;z-index:20;width:fit-content;max-width:calc(100% - 28px);padding:10px 16px;border-radius:18px;line-height:1.3;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;box-shadow:0 12px 22px -8px var(--c1-sh);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.qflag.drag{cursor:grabbing;transform:scale(1.06)}
.demo{padding:30px 18px 20px;text-align:center;font-family:'Manrope',sans-serif;font-weight:700;font-size:clamp(17px,3.4vw,22px);line-height:1.7;background:var(--bg-soft);border-radius:20px;margin-bottom:14px}
.subj{position:relative;display:inline-block}
.subj .lbl{position:absolute;left:50%;transform:translateX(-50%);top:-1.45em;font-size:.5em;font-weight:800;letter-spacing:.02em;color:var(--c3-b);white-space:nowrap}
.cardgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:560px){.cardgrid{grid-template-columns:1fr}}
.flip{perspective:1200px;height:170px;cursor:pointer;position:relative}
.flip-inner{position:relative;width:100%;height:100%;transition:transform .5s cubic-bezier(.4,.2,.2,1);transform-style:preserve-3d}
.flip.open .flip-inner{transform:rotateY(180deg)}
.flip-face{position:absolute;inset:0;border-radius:20px;padding:16px 18px;backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center}
.flip-front{background:var(--bg-soft)}
.flip-back{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;transform:rotateY(180deg);align-items:center;text-align:center}
.flip-rule{font-family:'Manrope',sans-serif;font-weight:800;font-size:15.5px;line-height:1.32}
.flip-desc{font-size:12.5px;margin-top:7px;opacity:.8;line-height:1.4}
.flip-example{font-size:15px;font-weight:700;margin-bottom:5px;line-height:1.4}
.flip-hint{position:absolute;bottom:9px;right:14px;font-size:10px;font-weight:700;opacity:.45}
.qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.qtext{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;line-height:1.4;margin:0 0 18px}
.options{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--bg-soft);cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);transition:transform .12s ease}
.opt:hover{transform:translateY(-1px)}
.opt[disabled]{cursor:default}.opt[disabled]:hover{transform:none}
.tile{position:relative;width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--c1-b);background:linear-gradient(150deg,rgba(255,255,255,.8),rgba(232,89,12,.2));border:1px solid rgba(255,255,255,.7)}
.badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff}
.badge.ok{background:var(--c3-b)}.badge.no{background:var(--c2-b)}
.opt.correct{background:var(--correct-bg)}.opt.wrong{background:var(--wrong-bg)}.opt.dim{opacity:.5}
.feedback{margin-top:16px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--correct-bg);color:var(--correct-ink)}
.feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px}
.btn{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;border:none;cursor:pointer}
.btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh)}
.btn.ghost{background:transparent;color:var(--ink-soft)}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.tab.pressed{transform:scale(.95);box-shadow:inset 0 3px 8px rgba(15,34,56,.25)}
.topictoggle button.pressed{transform:scale(.97)}
.opt.pressed{transform:scale(.98)}.btn.pressed{transform:scale(.95);filter:brightness(.94)}
.flip.pressed .flip-inner{transform:scale(.97)}.flip.open.pressed .flip-inner{transform:rotateY(180deg) scale(.97)}
.done-screen{text-align:center}
.done-screen .ring{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 16px 30px -12px var(--c1-sh);display:flex;align-items:center;justify-content:center}
.done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff}
footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
#drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none}
#drawToggleBtn{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,.5);background:linear-gradient(150deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 14px 28px -10px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .18s cubic-bezier(.34,1.56,.64,1)}
#drawToggleBtn svg{width:24px;height:24px;transition:transform .25s ease}
#drawToggleBtn:active{transform:scale(.9)}
#drawToggleBtn.on{background:linear-gradient(150deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,#FFB020,var(--c2-b))}
#drawToggleBtn.on svg{transform:rotate(90deg)}
#drawToolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(130%) scale(.94);opacity:0;display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,rgba(255,255,255,.7),rgba(255,255,255,.25));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,.7);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(15,34,56,.5);z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none}
#drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
#drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(.94);opacity:0;pointer-events:none}
#drawToolbarMini{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(.9);opacity:0;width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,.5);background:linear-gradient(155deg,var(--c1-a),var(--c1-b));display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none}
#drawToolbarMini svg{width:18px;height:18px}
#drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
.swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(15,34,56,.35);cursor:pointer;padding:0;transition:transform .15s}
.swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(.7);transition:all .15s}
.swatch.selected{transform:scale(1.08)}.swatch.selected::after{opacity:1;transform:scale(1)}
.tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,.55);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.tool-btn svg{width:16px;height:16px}.tool-btn .dot{border-radius:50%;background:currentColor}
#xthinBtn .dot{width:3.5px;height:3.5px}#thinBtn .dot{width:7px;height:7px}#thickBtn .dot{width:12.5px;height:12.5px}
.tool-btn.selected{background:var(--c1-b);color:#fff;transform:scale(1.06)}
.tool-sep{width:1px;height:22px;background:rgba(15,34,56,.15)}
@media(max-width:480px){#drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px}.swatch{width:21px;height:21px}.tool-btn{width:30px;height:30px}}

.card{padding:26px 22px;margin-bottom:16px}
.lbl-card{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--c1-b);margin-bottom:10px}
.th p{font-size:15.5px;line-height:1.65;margin:0 0 12px}
.th ul{margin:0 0 12px;padding-left:20px;line-height:1.7;font-size:15px}
.memo{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;border-radius:20px;padding:15px 18px;font-weight:700;font-size:14.5px;line-height:1.5;box-shadow:0 12px 22px -12px var(--c1-sh)}
.it{display:block;width:100%;text-align:left;padding:12px 14px;border-radius:16px;border:none;background:var(--bg-soft);font:500 15px Inter,sans-serif;color:var(--ink);cursor:pointer;margin-bottom:8px}
.it.sel{box-shadow:inset 0 0 0 2px var(--c1-b);background:#fff}.it.correct{background:var(--correct-bg)}.it.wrong{background:var(--wrong-bg)}.it.miss{outline:2px dashed var(--correct-ink)}.it.dim{opacity:.5}.it[disabled]{cursor:default}
.srow{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 12px;border-radius:16px;background:var(--bg-soft);margin-bottom:8px}
.srow .t{font-weight:600;font-size:15px}.srow.correct{background:var(--correct-bg)}.srow.wrong{background:var(--wrong-bg)}
.pill{padding:7px 12px;border-radius:999px;border:none;background:#fff;font:800 12px Manrope,sans-serif;color:var(--ink-soft);cursor:pointer;margin:2px}
.pill.on{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{margin-top:12px;padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;line-height:1.55}
.fb.ok{background:var(--correct-bg);color:var(--correct-ink)}.fb.bad{background:var(--wrong-bg);color:var(--wrong-ink)}.fb.info{background:var(--bg-soft);color:var(--ink)}
.ta{width:100%;padding:12px 14px;border-radius:14px;border:2px solid transparent;background:var(--bg-soft);font:500 15px Inter,sans-serif;color:var(--ink);resize:vertical;margin-bottom:6px}
.tk{display:inline-block;padding:6px 7px;border-radius:10px;border:none;background:#fff;font:600 16px Inter,sans-serif;color:var(--ink);cursor:pointer;margin:3px 2px}
.tk.ok{background:var(--correct-bg);color:var(--correct-ink);box-shadow:inset 0 0 0 2px var(--correct-ink)}.tk.bad{background:var(--wrong-bg);color:var(--wrong-ink)}.tk.miss{outline:2px dashed var(--correct-ink)}.tk.on{box-shadow:inset 0 0 0 2px var(--c1-b)}
.btn{margin-top:10px}.tabbar{margin-bottom:22px}

h1,.section-title,.pghead{color:#5C2A0F}
.pghead{font-family:'Manrope',sans-serif;font-weight:800;font-size:22px;line-height:1.25;margin:0 0 14px}
.pghead small{display:block;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--c1-b);margin-top:4px}
h1{font-size:clamp(22px,5vw,34px)}
.blank{display:inline-block;min-width:68px;padding:2px 10px;border-radius:10px;border:none;background:#fff;box-shadow:inset 0 0 0 2px var(--c1-b);font:700 15px Inter,sans-serif;color:var(--c1-b);cursor:pointer;margin:0 2px}
.blank.ok{background:var(--correct-bg);color:var(--correct-ink);box-shadow:inset 0 0 0 2px var(--correct-ink)}.blank.bad{background:var(--wrong-bg);color:var(--wrong-ink);box-shadow:inset 0 0 0 2px var(--wrong-ink)}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chip{padding:10px 14px;border-radius:14px;border:none;background:var(--bg-soft);font:600 15px Inter,sans-serif;color:var(--ink);cursor:pointer}
.chip.sel{box-shadow:inset 0 0 0 2px var(--c1-b);background:#fff}.chip.dim{opacity:.4}

.pk{background:#FFC9A0;color:#5C2400;border-radius:7px;padding:1px 7px;font-weight:800}
.rule{font-size:16px;line-height:1.65;margin:0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
@media(max-width:560px){.pair{grid-template-columns:1fr}}
.pc{border-radius:20px;padding:16px 18px}
.pc h4{margin:0 0 10px;font:800 13px Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.pc.g{background:#E6F8EE}.pc.g h4{color:#128A54}
.pc.v{background:#FFE8D6}.pc.v h4{color:#C2410C}
.pc.w{background:#FDECEC}.pc.w h4{color:#D8393E}
.ex{font:700 18px Manrope,sans-serif;padding:6px 0;line-height:1.4;color:#5C2400}
.ex small{display:block;font:500 13px Inter,sans-serif;color:var(--ink-soft)}
.swap{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;background:var(--bg-soft);margin-bottom:10px;font:700 18px Manrope,sans-serif;color:#5C2400}
.swap b{color:var(--c1-b);font-size:22px}.swap span:last-child{text-align:right}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:10px;font:800 12px Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.cols2 span:first-child{color:#128A54}.cols2 span:last-child{color:#C2410C;text-align:right}
.note{background:#FFF6D9;border-radius:20px;padding:16px 18px;font-size:15px;line-height:1.6}
.note h4{margin:0 0 6px;font:800 15px Manrope,sans-serif;color:#7A5200}
.big{font:700 clamp(19px,4vw,24px)/1.6 Manrope,sans-serif;text-align:center;padding:26px 16px;background:var(--bg-soft);border-radius:20px;margin:14px 0;color:#5C2400}
.sub{font:800 17px Manrope,sans-serif;color:#5C2A0F;margin:0 0 10px}
.card+.card{margin-top:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="kicker">Правопис прикладок · 8 клас</div><div class="kicker" style="opacity:.4">Синтаксис</div></div>
  <h1>При<span class="hl">кладка</span></h1>
  <div class="tabbar" id="subtabbar"></div>
  <div id="lessonArea"></div>
  <footer>@movoznavka</footer>
</div>
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg></button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#0F2238" data-color="#0F2238"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="tool-btn" id="clearBtn" title="Очистити все"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script>

const P=s=>'<span class="pk">'+s+'</span>';
const ex=a=>a.map(x=>`<div class="ex">${x}</div>`).join('');
const pair=(a,b,ta,tb)=>`<div class="pair"><div class="pc g"><h4>🟢 ${ta||'Окремо'}</h4>${ex(a)}</div><div class="pc v"><h4>🟣 ${tb||'Через дефіс'}</h4>${ex(b)}</div></div>`;
const swap=(a,b)=>`<div class="swap"><span>${a}</span><b>⇄</b><span>${b}</span></div>`;
const hdr=`<div class="cols2"><span>🟢 Окремо</span><span>🟣 Через дефіс</span></div>`;
const TABS=[
{tab:"Родова й видова назва",e:"🔎",t:"Пишемо окремо чи через дефіс?",html:`
<div class="card"><p class="rule">Якщо спочатку стоїть <b>родова (ширша) назва</b>, а потім <b>видова (конкретніша)</b> — пишемо окремо. Якщо навпаки — через дефіс.</p>
${pair(['риба '+P('карась'),'гриб '+P('мухомор')],['карась-'+P('риба'),'мухомор-'+P('гриб')])}</div>
<div class="note"><h4>📌 Виняток</h4>Якщо прикладка входить до складу терміна, пишемо через дефіс:<div class="ex" style="margin-top:6px">гриб-${P('паразит')}, жук-${P('короїд')}, заєць-${P('русак')}, заєць-${P('біляк')}, льон-${P('довгунець')}.</div></div>`},
{tab:"Загальна та власна назва",e:"📍",t:"Порядок слів має значення",html:`
<div class="card"><p class="rule">Якщо спочатку стоїть <b>загальна назва</b>, а потім <b>власна</b> — пишемо окремо. Якщо спочатку власна, а потім загальна — через дефіс.</p>
<div style="margin-top:16px">${hdr}${swap('ріка '+P('Дунай'),P('Дунай')+'-ріка')}${swap('гора '+P('Еверест'),P('Еверест')+'-гора')}</div></div>
<div class="memo">💡 Запам’ятай:<br>Загальна назва + власна назва → окремо.<br>Власна назва + загальна назва → дефіс.</div>`},
{tab:"Прикладка характеризує особу",e:"👤",t:"Коли прикладка схожа на прикметник?",html:`
<div class="card"><p class="rule">Якщо прикладку можна замінити прикметником, її написання залежить від порядку слів.</p>
${pair([P('хвалько')+' Павло<small>→ хвалькуватий Павло</small>',P('нечема')+' сусід<small>→ нечемний сусід</small>'],['Павло-'+P('хвалько'),'сусід-'+P('нечема')])}</div>
<div class="card"><p class="sub">👥 Назви за фахом, віком, національністю</p><p class="rule" style="margin-bottom:12px">Якщо обидва іменники можуть мінятися місцями, а другий характеризує перший, пишемо через дефіс.</p>
${swap('дівчина-'+P('вірменка'),'вірменка-'+P('дівчина'))}${swap('учитель-'+P('фізик'),'фізик-'+P('учитель'))}${swap('поет-'+P('початківець'),'початківець-'+P('поет'))}</div>
<div class="note"><h4>📌 Зверни увагу!</h4>Загальноприйняті ввічливі назви людей пишемо окремо:<div class="ex" style="margin-top:6px">${P('добродій')} Степан, ${P('добродій')} лікар, ${P('пан')} професор.</div></div>`},
{tab:"Прикладка зі словом «як»",e:"💬",t:"Прикладка зі словом «як»",html:`
<div class="card"><p class="rule">Прикладка може приєднуватися за допомогою слова <b>як</b>. Якщо вона означає <b>«у ролі кого?», «у ролі чого?»</b>, комами її не відокремлюємо.</p>
<div class="big">Вишиванка ${P('як символ України')} відома далеко за її межами.</div>
<p class="rule" style="text-align:center">Вишиванка відома в ролі чого? → <b>символу України</b>.</p></div>
<div class="card"><p class="sub">⚠️ Говорімо правильно!</p><div class="pair" style="margin-top:0"><div class="pc g"><h4>✅ Правильно</h4><div class="ex">Липа ${P('як лікарська рослина')} дуже корисна.</div></div><div class="pc w"><h4>❌ Неправильно</h4><div class="ex">Липа в якості лікарської рослини дуже корисна.</div></div></div></div>
<div class="memo">💡 Запам’ятай: замість «у якості» вживаємо «як».</div>`},
{tab:"Прикладки в лапках",e:"📖",t:"Коли використовуємо лапки?",html:`
<div class="card"><p class="rule">Назви газет, журналів, установ, творів мистецтва, підприємств і продуктів пишемо <b>з великої літери та в лапках</b>.</p>
<div class="pair"><div class="pc v"><h4>У лапках</h4>${ex(['📰 журнал '+P('«Дивослово»'),'🏭 завод '+P('«Арсенал»'),'🍽️ ресторан '+P('«Астур»'),'📚 оповідання '+P('«Федько-халамидник»'),'🎂 торт '+P('«Київський»')])}</div>
<div class="pc g"><h4>Без лапок</h4><p style="margin:0 0 8px;font-size:14.5px;line-height:1.5">Назви, що приєднуються словами <b>імені, на ім’я, пам’яті</b>, у лапки не беремо.</p><div class="ex">🎓 Львівський національний університет імені І. Франка.</div></div></div></div>`}
];
let act=0;const drawStore={};
const area=document.getElementById('lessonArea'),tabs=document.getElementById('subtabbar');
function render(){
 const t=TABS[act];
 tabs.innerHTML=TABS.map((x,i)=>`<button class="tab ${i===act?'active':''}" data-t="${i}"><span class="dot">${i+1}</span>${x.tab}</button>`).join('');
 area.innerHTML=`<div class="pghead">${t.e} ${t.t}</div>`+t.html;
 if(window.resizeDrawCanvas)requestAnimationFrame(()=>requestAnimationFrame(()=>{resizeDrawCanvas();setDrawingSnapshot(drawStore[act]||null)}));
}
tabs.addEventListener('click',e=>{const b=e.target.closest('[data-t]');if(!b)return;if(window.getDrawingSnapshot)drawStore[act]=getDrawingSnapshot();act=+b.dataset.t;render();window.scrollTo(0,0)});
render();

// МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель"), чорнило кожної вкладки/питання зберігається окремо
(function(){
  const canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d');
  const toggleBtn=document.getElementById('drawToggleBtn'),toolbar=document.getElementById('drawToolbar'),toolbarMini=document.getElementById('drawToolbarMini');
  const xthinBtn=document.getElementById('xthinBtn'),thinBtn=document.getElementById('thinBtn'),thickBtn=document.getElementById('thickBtn'),eraserBtn=document.getElementById('eraserBtn');
  const swatches=document.querySelectorAll('.swatch');
  let drawingActive=false,isDrawing=false,currentColor="#F5304A",currentWidth=4,eraserMode=false,lastX=0,lastY=0,activePointerId=null;
  window.isDrawingActive=()=>drawingActive;
  function resizeCanvas(){
    const w=document.documentElement.clientWidth,h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,window.innerHeight);
    const prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;
    if(canvas.width&&canvas.height)prev.getContext('2d').drawImage(canvas,0,0);
    canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    if(prev.width&&prev.height)ctx.drawImage(prev,0,0,prev.width/devicePixelRatio,prev.height/devicePixelRatio);
  }
  window.resizeDrawCanvas=resizeCanvas;resizeCanvas();
  window.addEventListener('resize',resizeCanvas);window.addEventListener('orientationchange',resizeCanvas);
  if(window.ResizeObserver)new ResizeObserver(()=>resizeCanvas()).observe(document.body);
  window.clearDrawing=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  window.getDrawingSnapshot=()=>{try{return(canvas.width&&canvas.height)?canvas.toDataURL('image/png'):null;}catch(e){return null;}};
  window.setDrawingSnapshot=function(url){
    ctx.clearRect(0,0,canvas.width,canvas.height);if(!url)return;
    const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);img.src=url;
  };
  function setActive(on){
    drawingActive=on;toolbar.classList.toggle('show',on);toolbar.classList.remove('mini');toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on',on);toggleBtn.title=on?'Вимкнути малювання':'Малювати';
  }
  toggleBtn.addEventListener('click',()=>setActive(!drawingActive));
  document.getElementById('minimizeBtn').addEventListener('click',()=>{toolbar.classList.remove('show');toolbar.classList.add('mini');toolbarMini.classList.add('show');});
  toolbarMini.addEventListener('click',()=>{toolbar.classList.remove('mini');toolbar.classList.add('show');toolbarMini.classList.remove('show');});
  swatches.forEach(sw=>sw.addEventListener('click',()=>{
    swatches.forEach(s=>s.classList.remove('selected'));sw.classList.add('selected');
    currentColor=sw.dataset.color;eraserMode=false;eraserBtn.classList.remove('selected');
  }));
  function setW(btn,w){btn.addEventListener('click',()=>{currentWidth=w;[xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');});}
  setW(xthinBtn,2);setW(thinBtn,5);setW(thickBtn,11);
  eraserBtn.addEventListener('click',()=>{eraserMode=!eraserMode;eraserBtn.classList.toggle('selected',eraserMode);});
  document.getElementById('clearBtn').addEventListener('click',()=>window.clearDrawing());
  function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure||.5};}
  const onControls=e=>!!(e.target.closest&&e.target.closest('#drawToolbar, #drawToolbarMini, #drawToggleBtn'));
  document.addEventListener('pointerdown',e=>{
    if(!drawingActive||e.pointerType!=='pen'||onControls(e))return;
    e.preventDefault();isDrawing=true;activePointerId=e.pointerId;const p=pos(e);lastX=p.x;lastY=p.y;
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!drawingActive||!isDrawing||e.pointerId!==activePointerId)return;
    e.preventDefault();const p=pos(e);
    ctx.globalCompositeOperation=eraserMode?'destination-out':'source-over';ctx.strokeStyle=currentColor;
    ctx.lineWidth=(eraserMode?currentWidth*3:currentWidth)*(0.6+(p.pressure||.5)*.8);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;
  },{passive:false});
  function stop(e){if(e&&e.pointerId!==undefined&&e.pointerId!==activePointerId)return;isDrawing=false;activePointerId=null;}
  document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop);
  document.addEventListener('touchmove',e=>{if(drawingActive&&e.touches&&e.touches[0]&&e.touches[0].touchType==='stylus')e.preventDefault();},{passive:false});
})();




</script>
