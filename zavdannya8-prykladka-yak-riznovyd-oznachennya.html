<style>
:root{--bg:#DCE9FF;--bg-soft:#EEF4FF;--card:#FFFFFF;--ink:#0F2238;--ink-soft:#5B7690;--line:rgba(15,34,56,.1);
--c1-a:#6EA8FF;--c1-b:#2F5FD0;--c1-sh:rgba(47,95,208,.4);--c3-b:#17A863;--c2-b:#EF6A66;--terra:#EF6A66;--amber:#C56A0E;
--correct-bg:#E2F6EA;--correct-ink:#128A54;--wrong-bg:#FBE6E1;--wrong-ink:#C8442B;}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px;position:relative}
.wrap{max-width:760px;margin:0 auto}
.topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(15,34,56,.12)}
.kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.6}
h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(28px,6.5vw,44px);line-height:1.08;margin:0 0 22px;text-transform:uppercase}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:34px}
.tab{padding:10px 15px 10px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.9);background:#fff;color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 20px -12px rgba(15,34,56,.5);transition:transform .13s ease}
.tab:hover{transform:translateY(-2px)}
.tab .dot{width:22px;height:22px;border-radius:8px;background:rgba(47,95,208,.15);color:var(--c1-b);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800}
.tab.active{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;border-color:transparent;box-shadow:0 12px 22px -8px var(--c1-sh)}
.tab.active .dot{background:rgba(255,255,255,.28);color:#fff}
.card{background:var(--card);border-radius:28px;padding:40px 24px 28px;box-shadow:0 20px 44px -28px rgba(15,34,56,.5)}
.section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;margin:0 0 8px}
.section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px}
.section-intro b{color:var(--ink)}
.qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px}
.qtext{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;line-height:1.4;margin:0 0 18px}
.options{display:flex;flex-direction:column;gap:10px}

.opt:hover{transform:translateY(-1px)}
.opt[disabled]{cursor:default}.opt[disabled]:hover{transform:none}

.opt.correct{background:var(--correct-bg)}.opt.wrong{background:var(--wrong-bg)}.opt.dim{opacity:.5}

.feedback.show{display:block}
.feedback.ok{background:var(--correct-bg);color:var(--correct-ink)}
.feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink)}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px}

.btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh)}
.btn.ghost{background:transparent;color:var(--ink-soft)}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none}
.tab.pressed{transform:scale(.95);box-shadow:inset 0 3px 8px rgba(15,34,56,.25)}
.opt.pressed{transform:scale(.98)}.btn.pressed{transform:scale(.95);filter:brightness(.94)}
.done-screen{text-align:center}

.done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff}
footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:600}
#drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none}

#drawToggleBtn.on{background:linear-gradient(150deg,rgba(255,255,255,.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,#FFB020,var(--c2-b))}

#drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
#drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(.94);opacity:0;pointer-events:none}

#drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto}
.swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(15,34,56,.35);cursor:pointer;padding:0;transition:transform .15s}
.swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(.7);transition:all .15s}

.feedback.show{display:flex;align-items:center;gap:9px}.send-status{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:10px;min-height:18px}.send-status.ok{color:var(--correct-ink)}.send-status.bad{color:var(--c2-b)}.btn{display:flex;align-items:center;gap:6px}.btn.ghost.small{padding:8px 14px;font-size:12px}u{text-decoration-thickness:2px;text-underline-offset:3px}.chk{flex-basis:100%;margin-top:8px}.pressed{transform:scale(.97)}
.w.m1{background:var(--correct-bg);color:var(--correct-ink)}.w.miss{outline:2px dashed var(--correct-ink)}.words.txt{gap:4px}.words.txt .w{padding:6px 8px;font-size:15px;border-radius:10px}
.wi{width:100%;padding:12px 14px;border-radius:14px;border:2px solid transparent;background:var(--bg-soft);font-family:Inter,sans-serif;font-size:16px;color:var(--ink);resize:none}.wi.ok{background:var(--correct-bg)}.wi.bad{background:var(--wrong-bg)}</style>

el.addEventListener('pointerup',e=>{el.classList.remove('pressed');if(!tr)return;tr=false;if(pen&&window.isDrawingActive&&window.isDrawingActive())return;if(Math.hypot(e.clientX-sx,e.clientY-sy)>10)return;h(e)});
el.addEventListener('pointercancel',()=>{tr=false;el.classList.remove('pressed')});
el.addEventListener('pointerleave',()=>{if(tr)el.classList.remove('pressed')})}
function renderSubs(){tabs.innerHTML=subs().map((s,i)=>`<button class="tab ${i===activeSub?'active':''}"><span class="dot">${s.dot}</span>${s.tab}</button>`).join('');
tabs.querySelectorAll('.tab').forEach((b,i)=>attachTapToggle(b,()=>{saveDraw();activeSub=i;introOpen=false;quizIdx=0;quizAnswers={};stage={};_rs='idle';renderSubs();renderContent()}))}
function renderContent(){const s=subs()[activeSub];area.innerHTML=`<div class="titlerow"><p class="section-title" style="margin:0">${s.title}</p><button class="info-btn" id="infoBtn" title="Що робити?">i</button></div><p class="section-intro" id="introBox" style="${introOpen?'':'display:none;'}">${s.intro}</p>`;attachTapToggle(document.getElementById('infoBtn'),()=>{introOpen=!introOpen;document.getElementById('introBox').style.display=introOpen?'':'none'});renderQuiz(s);
if(window.resizeDrawCanvas)requestAnimationFrame(()=>requestAnimationFrame(()=>{resizeDrawCanvas();setDrawingSnapshot(drawStore[dkey()]||null)}))}
function score(s){let c=0,n=0;s.questions.forEach((_,i)=>{const r=quizAnswers[i];if(r){n++;if(r.correct)c++}});return{correct:c,answered:n,total:s.questions.length}}
async function sendResult(s){
if(_rs==='sending'||_rs==='sent')return;
const student=new URLSearchParams(location.search).get('student'),st=document.getElementById('sendStatus');
if(!student){if(st)st.textContent='';return}
_rs='sending';st.textContent='Надсилаємо результат...';st.className='send-status';
const {correct,answered,total}=score(s),wrongList=[];
s.questions.forEach((_,i)=>{const r=quizAnswers[i];if(r&&!r.correct)wrongList.push(s.dot+'.'+(i+1))});
try{const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({type:'quiz_result',student,testName:s.testName||s.title,correct,answered,total,wrongList,reviewLink:'',flaggedList:[]})});
if(!resp||!resp.ok)throw 0;_rs='sent';st.textContent='Результат надіслано вчителю ✓';st.className='send-status ok'}
catch(e){_rs='failed';st.innerHTML='Не вдалося надіслати результат (перевірте інтернет). <button class="btn ghost small" id="retrySendBtn">Спробувати ще раз</button>';st.className='send-status bad';document.getElementById('retrySendBtn').onclick=()=>{_rs='idle';sendResult(s)}}}
function renderQuiz(s){
const total=s.questions.length;
if(quizIdx>=total){const {correct}=score(s),d=document.createElement('div');
d.innerHTML=`<div class="done-screen"><div class="ring"><div class="big">${correct}/${total}</div></div><p class="section-intro" style="margin-top:10px">${correct===total?'Ідеально! Матеріал засвоєно 🎉':'Непогано — можна пройти ще раз.'}</p><div class="send-status" id="sendStatus"></div><button class="btn primary" id="quizRestart" style="margin:6px auto 0">Пройти ще раз</button></div>`;
area.appendChild(d);attachTapToggle(document.getElementById('quizRestart'),()=>{quizIdx=0;quizAnswers={};stage={};_rs='idle';renderContent()});sendResult(s);return}
const q=s.questions[quizIdx],rec=quizAnswers[quizIdx],opts=q.opts||s.opts,A=[].concat(q.a),box=document.createElement('div');
box.innerHTML=`<div class="qprog">Питання ${quizIdx+1} з ${total}</div><p class="qtext">«${q.q}»</p>
<div class="options">${opts.map((o,i)=>`<button class="opt" data-i="${i}" ${rec?'disabled':''}><span class="tile"><span>${LETTERS[i]}</span></span><span>${o}</span></button>`).join('')}</div>
<div class="feedback ${rec?'show '+(rec.correct?'ok':'bad'):''}">${rec?(rec.correct?'<span><b>Правильно.</b></span>':`<span>Правильна відповідь — ${A.map(i=>LETTERS[i]+'. '+opts[i]).join(' або ')}</span>`):''}</div>
<div class="nav-row"><button class="btn ghost" id="quizPrev" ${quizIdx===0?'disabled':''}>← Назад</button><button class="btn primary" id="quizNext" ${rec?'':'disabled'}>${quizIdx===total-1?'До результату':'Далі →'}</button></div>`;
area.appendChild(box);
if(s.write){const o=box.querySelector('.options');o.className='';o.innerHTML='<textarea class="wi" id="wIn" rows="2" placeholder="Запишіть відповідь…" '+(rec?'disabled':'')+'></textarea>'+(rec?'':'<div class="chk" style="margin-top:12px"><button class="btn primary" id="wCheck">Перевірити</button></div>');
const ta=document.getElementById('wIn'),fb=box.querySelector('.feedback');
if(rec){ta.value=rec.picked;ta.classList.add(rec.correct?'ok':'bad');fb.innerHTML=rec.correct?'<span><b>Правильно.</b></span>':'<span>Правильна відповідь — '+q.ans[0]+'</span>'}
else attachTapToggle(document.getElementById('wCheck'),()=>{const v=ta.value.trim();if(!v)return;quizAnswers[quizIdx]={picked:v,correct:q.ans.some(x=>norm(x)===norm(v))};renderContent()})}
if(s.mark){box.querySelector('.qtext').remove();const o=box.querySelector('.options'),ws=q.w,K=q.key,N=Object.keys(K).length,st=rec?rec.picked:{};o.className='words txt';
const cls=i=>{const e=K[i]||0,g=st[i]||0;return rec?(e&&e===g?' correct':(g?' wrong':(e?' miss':''))):(g?' m'+g:'')};
o.innerHTML=ws.map((w,i)=>`<button class="w${cls(i)}" data-i="${i}" ${rec?'disabled':''}>${w}</button>`).join('')+(rec?'':'<div class="chk" style="margin-top:12px"><div class="send-status">Натисніть на слово — позначити, ще раз — зняти позначку.</div><button class="btn primary" id="mCheck">Перевірити</button></div>');
if(rec){let hit=0;for(const i in K)if(st[i]===K[i])hit++;box.querySelector('.feedback').innerHTML='<span>'+(rec.correct?'<b>Правильно.</b> Усі прикладки знайдено.':'Правильно знайдено '+hit+' з '+N+'. Зелене — вірно, червоне — зайве, пунктир — пропущена прикладка.')+'</span>'}
else{o.querySelectorAll('.w').forEach(b=>attachTapToggle(b,()=>{const i=+b.dataset.i;st[i]=((st[i]||0)+1)%2;b.className='w'+(st[i]?' m'+st[i]:'')}));
attachTapToggle(document.getElementById('mCheck'),()=>{let ok=true;ws.forEach((_,i)=>{if((st[i]||0)!==(K[i]||0))ok=false});quizAnswers[quizIdx]={picked:Object.assign({},st),correct:ok};renderContent()})}}
if(s.pick){box.querySelector('.qtext').remove();const o=box.querySelector('.options'),ws=q.q.split(' ');o.className='words';
o.innerHTML=ws.map((w,i)=>`<button class="w" data-i="${i}" ${rec?'disabled':''}>${w}</button>`).join('');
if(rec){const fb=box.querySelector('.feedback');if(!rec.correct)fb.innerHTML='<span>Прикладка — «'+q.t+'».</span>';
o.querySelectorAll('.w').forEach((b,i)=>b.classList.add(q.a.includes(i)?'correct':(i===rec.picked?'wrong':'dim')))}
o.querySelectorAll('.w').forEach(b=>attachTapToggle(b,()=>{if(quizAnswers[quizIdx])return;const pk=+b.dataset.i;quizAnswers[quizIdx]={picked:pk,correct:q.a.includes(pk)};renderContent()}))}
if(rec)box.querySelectorAll('.opt').forEach((b,i)=>{const t=b.querySelector('.tile');
if(A.includes(i)){b.classList.add('correct');t.insertAdjacentHTML('beforeend','<span class="badge ok">✓</span>')}
else if(i===rec.picked){b.classList.add('wrong');t.insertAdjacentHTML('beforeend','<span class="badge no">✕</span>')}
else b.classList.add('dim')});
box.querySelectorAll('.opt').forEach(b=>attachTapToggle(b,()=>{if(quizAnswers[quizIdx])return;const p=+b.dataset.i;quizAnswers[quizIdx]={picked:p,correct:A.includes(p)};renderContent()}));
attachTapToggle(document.getElementById('quizPrev'),()=>{saveDraw();quizIdx--;renderContent()});
attachTapToggle(document.getElementById('quizNext'),()=>{saveDraw();quizIdx++;renderContent()})}
renderSubs();renderContent();

(function(){
  const canvas=document.getElementById('drawCanvas'),ctx=canvas.getContext('2d');
  const toggleBtn=document.getElementById('drawToggleBtn'),toolbar=document.getElementById('drawToolbar'),toolbarMini=document.getElementById('drawToolbarMini');
  const xthinBtn=document.getElementById('xthinBtn'),thinBtn=document.getElementById('thinBtn'),thickBtn=document.getElementById('thickBtn'),eraserBtn=document.getElementById('eraserBtn');
  const swatches=document.querySelectorAll('.swatch');
  let drawingActive=false,isDrawing=false,currentColor="#F5304A",currentWidth=4,eraserMode=false,lastX=0,lastY=0,activePointerId=null;
  window.isDrawingActive=()=>drawingActive;
  function resizeCanvas(){
    const w=document.documentElement.clientWidth,h=Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,window.innerHeight);
    const prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;
    if(canvas.width&&canvas.height)prev.getContext('2d').drawImage(canvas,0,0);
    canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;
    canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    if(prev.width&&prev.height)ctx.drawImage(prev,0,0,prev.width/devicePixelRatio,prev.height/devicePixelRatio);
  }
  window.resizeDrawCanvas=resizeCanvas;resizeCanvas();
  window.addEventListener('resize',resizeCanvas);window.addEventListener('orientationchange',resizeCanvas);
  if(window.ResizeObserver)new ResizeObserver(()=>resizeCanvas()).observe(document.body);
  window.clearDrawing=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  window.getDrawingSnapshot=()=>{try{return(canvas.width&&canvas.height)?canvas.toDataURL('image/png'):null;}catch(e){return null;}};
  window.setDrawingSnapshot=function(url){
    ctx.clearRect(0,0,canvas.width,canvas.height);if(!url)return;
    const img=new Image();img.onload=()=>ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio);img.src=url;
  };
  function setActive(on){
    drawingActive=on;toolbar.classList.toggle('show',on);toolbar.classList.remove('mini');toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on',on);toggleBtn.title=on?'Вимкнути малювання':'Малювати';
  }
  toggleBtn.addEventListener('click',()=>setActive(!drawingActive));
  document.getElementById('minimizeBtn').addEventListener('click',()=>{toolbar.classList.remove('show');toolbar.classList.add('mini');toolbarMini.classList.add('show');});
  toolbarMini.addEventListener('click',()=>{toolbar.classList.remove('mini');toolbar.classList.add('show');toolbarMini.classList.remove('show');});
  swatches.forEach(sw=>sw.addEventListener('click',()=>{
    swatches.forEach(s=>s.classList.remove('selected'));sw.classList.add('selected');
    currentColor=sw.dataset.color;eraserMode=false;eraserBtn.classList.remove('selected');
  }));
  function setW(btn,w){btn.addEventListener('click',()=>{currentWidth=w;[xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');});}
  setW(xthinBtn,2);setW(thinBtn,5);setW(thickBtn,11);
  eraserBtn.addEventListener('click',()=>{eraserMode=!eraserMode;eraserBtn.classList.toggle('selected',eraserMode);});
  document.getElementById('clearBtn').addEventListener('click',()=>window.clearDrawing());
  function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,pressure:e.pressure||.5};}
  const onControls=e=>!!(e.target.closest&&e.target.closest('#drawToolbar, #drawToolbarMini, #drawToggleBtn'));
  document.addEventListener('pointerdown',e=>{
    if(!drawingActive||e.pointerType!=='pen'||onControls(e))return;
    e.preventDefault();isDrawing=true;activePointerId=e.pointerId;const p=pos(e);lastX=p.x;lastY=p.y;
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!drawingActive||!isDrawing||e.pointerId!==activePointerId)return;
    e.preventDefault();const p=pos(e);
    ctx.globalCompositeOperation=eraserMode?'destination-out':'source-over';ctx.strokeStyle=currentColor;
    ctx.lineWidth=(eraserMode?currentWidth*3:currentWidth)*(0.6+(p.pressure||.5)*.8);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;
  },{passive:false});
  function stop(e){if(e&&e.pointerId!==undefined&&e.pointerId!==activePointerId)return;isDrawing=false;activePointerId=null;}
  document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop);
  document.addEventListener('touchmove',e=>{if(drawingActive&&e.touches&&e.touches[0]&&e.touches[0].touchType==='stylus')e.preventDefault();},{passive:false});
})();
</script>
