<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест · Букви И, І</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{--bg:#EDE8D6;--bg2:#F6F2E6;--card:#FFFEFB;--ink:#2B2519;--ink-soft:#8A8061;--line:rgba(43,37,25,.09);
--c1-a:#8A9B5E;--c1-b:#5A6B3A;--c1-sh:rgba(90,107,58,.42);--pill:#E8ECDC;--ok:#17A863;--no:#E04458;--warn:#F2A516;
--ok-bg:#E4F7EC;--no-bg:#FDE9EC;--ok-ink:#0F8A52;--no-ink:#D13A4E;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:radial-gradient(1200px 500px at 85% -10%,#FBF7EA 0,transparent 60%),var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:24px 16px 72px;position:relative;}
.wrap{max-width:820px;margin:0 auto;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.5;}
.hero{position:relative;min-height:420px;border-radius:30px;overflow:hidden;margin-bottom:18px;background-size:cover;background-position:center;box-shadow:0 22px 44px -28px rgba(80,70,30,.55);}
.hero-text{position:relative;margin:20px;padding:20px 24px;max-width:50%;background:rgba(255,251,240,.86);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:24px;box-shadow:0 18px 36px -22px rgba(60,50,20,.5);}
.pill-white{display:inline-block;background:#fff;color:var(--c1-b);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;padding:7px 14px;border-radius:999px;box-shadow:0 6px 14px -8px var(--c1-sh);}
.hero h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(46px,9vw,66px);line-height:1;letter-spacing:-.02em;margin:14px 0 6px;color:#2B2519;}
.hero .sub{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(18px,3.6vw,26px);line-height:1.2;color:#2B2519;margin:0 0 14px;}
.hero .sub .g{color:#4F7A2F;}.hero .sub .o{color:#D9622B;}
.hero .meta{display:flex;gap:8px;flex-wrap:wrap;}
.chip{font-family:'Manrope',sans-serif;font-weight:700;font-size:12.5px;color:var(--ink);background:rgba(255,255,255,.8);padding:6px 11px;border-radius:999px;}
.dots{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 16px;}
.dot{width:26px;height:26px;border-radius:50%;border:none;background:#fff;color:var(--ink-soft);font-family:'Manrope',sans-serif;font-weight:800;font-size:11.5px;cursor:pointer;box-shadow:0 3px 8px -4px rgba(43,37,25,.35);padding:0;transition:transform .12s;}
.dot:hover{transform:translateY(-1px);}
.dot.cur{background:var(--c1-b);color:#fff;box-shadow:0 6px 12px -5px var(--c1-sh);transform:scale(1.12);}
.dot.ok{background:var(--ok);color:#fff;}.dot.bad{background:var(--no);color:#fff;}.dot.part{background:var(--warn);color:#fff;}
.dot[disabled]{opacity:.45;cursor:default;}.dot.cur[disabled]{opacity:1;}
.qcard.even{--c1-a:#E39A5C;--c1-b:#C0642B;--c1-sh:rgba(192,100,43,.4);--pill:#FBE5D3;--bg2:#FCEFE2;background:#FFF8F0;}
.qcard{position:relative;background:var(--card);border-radius:28px;padding:20px 22px 22px;box-shadow:0 24px 48px -30px rgba(80,70,30,.55);overflow:clip;}
.qcard .leaf{position:absolute;pointer-events:none;opacity:.9;}
.qcard .leaf.l1{width:54px;left:-14px;top:-10px;transform:rotate(-20deg);}
.qcard .leaf.l2{width:60px;right:-12px;bottom:-12px;transform:rotate(150deg);}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;position:relative;z-index:1;}
.qnum{display:flex;align-items:center;gap:10px;font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;color:var(--ink-soft);letter-spacing:.02em;}
.qnum b{width:36px;height:36px;border-radius:50%;background:var(--pill);color:var(--c1-b);display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:inset 0 1px 2px #fff,0 4px 10px -6px var(--c1-sh);}
.pts{background:var(--pill);color:var(--c1-b);font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;padding:7px 13px;border-radius:999px;}
.qgrid{display:grid;grid-template-columns:1fr auto;gap:8px 18px;align-items:center;position:relative;z-index:1;}
.qmain{min-width:0;}
.qtext{font-family:'Manrope',sans-serif;font-size:clamp(18px,3.3vw,21px);font-weight:800;line-height:1.35;margin:0 0 6px;}
.qhint{font-size:13px;color:var(--ink-soft);font-weight:600;margin:0 0 12px;}
.qtext+.options{margin-top:14px;}
.qimg{width:clamp(120px,24vw,190px);display:flex;align-items:center;justify-content:center;}
.qimg img{width:100%;height:auto;max-height:190px;object-fit:contain;filter:drop-shadow(0 10px 12px rgba(80,70,30,.25));}
.options{display:flex;flex-direction:column;gap:9px;}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:11px 14px;border-radius:16px;border:2px solid transparent;background:var(--bg2);cursor:pointer;font-family:'Inter',sans-serif;font-size:15px;font-weight:500;color:var(--ink);line-height:1.35;transition:transform .12s ease,background .15s ease,border-color .15s;}
.opt:hover{transform:translateY(-1px);background:var(--pill);}
.opt[disabled]{cursor:default;}.opt[disabled]:hover{transform:none;}
.mark{flex:0 0 auto;width:24px;height:24px;border-radius:50%;border:2.5px solid var(--c1-a);background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#fff;transition:all .15s;}
.mark.sq{border-radius:7px;}
.opt.sel{background:var(--pill);border-color:var(--c1-b);}
.opt.sel .mark{border-color:var(--c1-b);background:var(--c1-b);box-shadow:inset 0 0 0 4px #fff;}
.opt.sel .mark.sq{box-shadow:none;}
.opt.sel .mark.sq::after{content:'✓';}
.let{flex:0 0 auto;font-family:'Manrope',sans-serif;font-weight:800;color:var(--c1-b);width:18px;}
.otxt{flex:1;}
.opt.correct{background:var(--ok-bg);border-color:var(--ok);}
.opt.correct .mark{background:var(--ok);border-color:var(--ok);box-shadow:none;}
.opt.correct .mark::after{content:'✓';}
.opt.wrong{background:var(--no-bg);border-color:var(--no);}
.opt.wrong .mark{background:var(--no);border-color:var(--no);box-shadow:none;}
.opt.wrong .mark::after{content:'✕';}
.opt.missed{background:#fff;border:2px dashed var(--ok);}
.opt.missed .mark{border-color:var(--ok);background:#fff;color:var(--ok);}
.opt.missed .mark::after{content:'✓';}
.opt.dim{opacity:.5;}
.feedback{margin-top:16px;padding:12px 14px;border-radius:16px;font-size:14px;font-weight:600;display:none;align-items:center;gap:11px;position:relative;z-index:1;}
.feedback img{width:34px;height:34px;object-fit:contain;flex:0 0 auto;}
.feedback.show{display:flex;}
.feedback.ok{background:var(--ok-bg);color:var(--ok-ink);}.feedback.bad{background:var(--no-bg);color:var(--no-ink);}.feedback.part{background:#FFF3D6;color:#9A6400;}
.nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px;position:relative;z-index:1;}
.btn{font-family:'Manrope',sans-serif;font-weight:800;font-size:14px;padding:13px 24px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 12px 22px -10px var(--c1-sh);}
.btn.ghost{background:transparent;color:var(--ink-soft);}
.btn.ghost.small{padding:8px 14px;font-size:12px;}
.btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
.opt.pressed{transform:scale(.98);}.btn.pressed{transform:scale(.95);filter:brightness(.94);}
.done-screen{text-align:center;position:relative;z-index:1;padding:6px 0 4px;}
.done-banner{display:block;width:calc(100% + 0px);height:150px;object-fit:cover;border-radius:20px;}
.done-screen .star{width:96px;margin:-4px auto 0;display:block;filter:drop-shadow(0 10px 12px rgba(242,165,22,.35));}
.done-screen h2{font-family:'Manrope',sans-serif;font-weight:800;font-size:26px;margin:6px 0 4px;}
.done-screen .ring{width:128px;height:128px;margin:-58px auto 14px;position:relative;border:5px solid #fff;border-radius:50%;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 18px 32px -14px var(--c1-sh);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;}
.done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:34px;line-height:1;}
.done-screen .ring small{font-family:'Manrope',sans-serif;font-weight:700;font-size:12px;opacity:.85;margin-top:4px;}
.section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 6px;}
.send-status{font-size:13px;font-weight:600;color:var(--ink-soft);margin:10px 0;min-height:18px;}
.send-status.ok{color:var(--ok-ink);}.send-status.bad{color:var(--no);}
footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.rev{margin:0 0 22px;padding:18px;border-radius:22px;background:#fff;box-shadow:0 14px 30px -24px rgba(80,70,30,.5);}
@media(max-width:600px){
 .topbar .kicker:last-child{display:none;}
 body{padding:16px 12px 72px;}
 .hero{min-height:420px;background-position:40% bottom;background-size:auto 100%;}.hero-text{max-width:none;margin:12px;padding:16px 18px;}
 .qcard{padding:16px 14px 18px;}
 .qgrid{grid-template-columns:1fr;}
 .qimg{position:absolute;right:0;top:-56px;width:78px;}
 .qimg img{max-height:78px;}
 .qtext{padding-right:0;}
 .qhead{padding-right:84px;}
 .opt{font-size:14.5px;padding:10px 11px;}
 .dot{width:24px;height:24px;font-size:11px;}
}

#drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none;}
#drawToggleBtn{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(150deg,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 14px 28px -10px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,0.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .18s cubic-bezier(.34,1.56,.64,1);}
#drawToggleBtn svg{width:24px;height:24px;display:block;transition:transform .25s ease;}
#drawToggleBtn:active{transform:scale(0.90);}
#drawToggleBtn.on{background:linear-gradient(150deg,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,#FF8A65,var(--c2-b));}
#drawToggleBtn.on svg{transform:rotate(90deg);}
#drawToolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,rgba(255,255,255,0.6),rgba(255,255,255,0.15));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.7);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(36,25,52,0.45),inset 0 1px 1px rgba(255,255,255,0.9);z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none;}
#drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
#drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;pointer-events:none;}
#drawToolbarMini{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(0.9);opacity:0;width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(155deg,var(--c1-a),var(--c1-b));display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease;pointer-events:none;}
#drawToolbarMini svg{width:18px;height:18px;}
#drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
.swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(36,25,52,0.35);cursor:pointer;padding:0;transition:transform .15s;}
.swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;transform:scale(0.7);transition:opacity .15s,transform .15s;}
.swatch.selected{transform:scale(1.08);}
.swatch.selected::after{opacity:1;transform:scale(1);}
.tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.5);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background .15s,color .15s,transform .15s;}
.tool-btn svg{width:16px;height:16px;}
.tool-btn .dot{border-radius:50%;background:currentColor;}
#xthinBtn .dot{width:3.5px;height:3.5px;}
#thinBtn .dot{width:7px;height:7px;}
#thickBtn .dot{width:12.5px;height:12.5px;}
.tool-btn.selected{background:var(--c1-b);color:#fff;transform:scale(1.06);}
.tool-sep{width:1px;height:22px;background:rgba(36,25,52,0.14);}
@media(max-width:480px){#drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px;}.swatch{width:21px;height:21px;}.tool-btn{width:30px;height:30px;}}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar"><div class="kicker">Українська мова · 6 клас · Тест</div><div class="kicker" style="opacity:.4">16 питань · 16 балів</div></div>
  <div class="hero" id="hero">
    <div class="hero-text">
      <span class="pill-white">Українська мова · 6 клас</span>
      <h1>Тест</h1>
      <p class="sub">Букви <span class="g">И</span>, <span class="o">І</span> у словах іншомовного походження</p>
      <div class="meta"><span class="chip">16 питань</span><span class="chip">16 балів</span></div>
    </div>
  </div>
  <div class="dots" id="dots"></div>
  <div class="qcard" id="lessonArea"></div>
  <footer>@movoznavka</footer>
</div>
<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати"><svg viewBox="0 0 24 24" fill="none"><path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg></button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#241934" data-color="#241934"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="tool-btn" id="clearBtn" title="Очистити все"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>

const API_URL = "https://script.google.com/macros/s/AKfycbxWkeJYw7gUdEjM9H2oeMVTMhBLEq1dDa2DcqNS5vSQjJb19aXyR7p7kDz_otyK3sTggw/exec";
const TOTAL_PTS = 16;
const LETTERS=["А","Б","В","Г","Д"];
let quizIdx=0, quizAnswers={}, selState={}, _resultState='idle';
const lessonArea=document.getElementById('lessonArea'), dotsEl=document.getElementById('dots');
function img(n,cls){return '<img'+(cls?' class="'+cls+'"':'')+' src="'+STK[n]+'" alt="" draggable="false">';}
document.getElementById('hero').style.backgroundImage='url('+STK.hero+')';

// ?hw=... : "5" = з 5-го і далі; "5-10" = діапазон; "3 7 12" = лише ці питання
(function(){
  const hw=new URLSearchParams(location.search).get('hw'); if(!hw) return;
  const tokens=hw.split(/[\s,;+]+/).filter(Boolean), multi=tokens.length>1, len=TEST.length, nums=new Set();
  tokens.forEach(t=>{let m;
    if((m=t.match(/^(\d+)-(\d+)$/))){for(let n=+m[1];n<=Math.min(len,+m[2]);n++)nums.add(n);}
    else if((m=t.match(/^(\d+)-$/))){for(let n=+m[1];n<=len;n++)nums.add(n);}
    else if((m=t.match(/^(\d+)$/))){ if(multi)nums.add(+m[1]); else for(let n=+m[1];n<=len;n++)nums.add(n); }});
  if(!nums.size) return;
  SUB.questions=TEST.map((q,i)=>Object.assign({},q,{_n:i+1})).filter(q=>nums.has(q._n));
})();
const ptsOf=q=>q.pts||1;
const isMulti=q=>Array.isArray(q.a);
const rightText=q=>(isMulti(q)?q.a:[q.a]).map(i=>q.opts[i]).join('; ');
function grade(q,p){
  const pts=ptsOf(q);
  if(isMulti(q)){
    const right=q.a.filter(i=>p.includes(i)).length, wrong=p.filter(i=>!q.a.includes(i)).length;
    if(right===q.a.length&&wrong===0) return pts;
    if(pts>1&&wrong===0&&right>0) return Math.floor(pts/2);
    return 0;
  }
  return p===q.a?pts:0;
}
function wrongLabel(i){const q=SUB.questions[i];return (q&&q._n)||(i+1);}
const pk=r=>Array.isArray(r.picked)?r.picked.join('.'):String(r.picked);
function reviewLink(){
  const items=[];
  SUB.questions.forEach((q,i)=>{const r=quizAnswers[i]; if(r&&r.got<ptsOf(q)) items.push(wrongLabel(i)+':'+pk(r));});
  return items.length ? location.origin+location.pathname+'?review='+encodeURIComponent(items.join('|')) : '';
}
function quizScore(){let c=0,a=0,t=0;SUB.questions.forEach((q,i)=>{t+=ptsOf(q);const r=quizAnswers[i];if(r){a+=ptsOf(q);c+=r.got;}});return {correct:c,answered:a,total:t};}

async function sendResultOnce(){
  if(_resultState==='sending'||_resultState==='sent') return;
  const student=new URLSearchParams(location.search).get('student');
  const st=document.getElementById('sendStatus');
  if(!student||!API_URL){ if(st) st.textContent=''; return; }
  _resultState='sending';
  if(st){st.textContent='Надсилаємо результат...';st.className='send-status';}
  const {correct,answered,total}=quizScore();
  const wrongList=[]; SUB.questions.forEach((q,i)=>{const r=quizAnswers[i]; if(r&&r.got<ptsOf(q)) wrongList.push(wrongLabel(i));});
  try{
    const resp=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
      body:JSON.stringify({type:'quiz_result',student,testName:SUB.testName,correct,answered,total:(TOTAL_PTS&&SUB.questions.length===TEST.length?TOTAL_PTS:total),wrongList,reviewLink:reviewLink(),flaggedList:[]})});
    if(!resp||!resp.ok) throw new Error('bad status');
    _resultState='sent';
    if(st){st.textContent='Результат надіслано вчителю ✓';st.className='send-status ok';}
  }catch(e){
    _resultState='failed';
    if(st){
      st.innerHTML='Не вдалося надіслати результат (перевірте інтернет). <button class="btn ghost small" id="retrySendBtn">Спробувати ще раз</button>';
      st.className='send-status bad';
      document.getElementById('retrySendBtn').onclick=()=>{_resultState='idle';sendResultOnce();};
    }
  }
}

function optsHTML(q,p,locked,review){
  // p: масив обраних індексів
  const multi=isMulti(q);
  return q.opts.map((o,i)=>{
    const chosen=p.includes(i), right=multi?q.a.includes(i):i===q.a;
    let cls='';
    if(locked){
      if(chosen&&right) cls='correct'; else if(chosen&&!right) cls='wrong'; else if(right&&multi) cls='missed'; else if(right) cls='correct'; else cls='dim';
    } else if(chosen) cls='sel';
    return '<button class="opt '+cls+'" data-i="'+i+'" '+(locked?'disabled':'')+'><span class="mark'+(multi?' sq':'')+'"></span><span class="let">'+LETTERS[i]+'</span><span class="otxt">'+o+'</span></button>';
  }).join('');
}

function firstUnanswered(){let i=0;while(i<SUB.questions.length&&quizAnswers[i]) i++;return i;}
function renderDots(){
  const fu=firstUnanswered();
  dotsEl.innerHTML=SUB.questions.map((q,i)=>{
    const r=quizAnswers[i]; let c='';
    if(i===quizIdx) c='cur'; else if(r) c=r.got===ptsOf(q)?'ok':(r.got>0?'part':'bad');
    return '<button class="dot '+c+'" data-i="'+i+'" '+(i>fu?'disabled':'')+'>'+wrongLabel(i)+'</button>';
  }).join('');
  dotsEl.querySelectorAll('.dot').forEach(b=>attachTap(b,()=>{ if(b.disabled) return; saveDrawing(); quizIdx=+b.dataset.i; render(); }));
}

const drawStore={};
function drawKey(){return 'q'+quizIdx;}
function saveDrawing(){if(window.getDrawingSnapshot) drawStore[drawKey()]=window.getDrawingSnapshot();}
function restoreDrawing(){if(window.setDrawingSnapshot) window.setDrawingSnapshot(drawStore[drawKey()]||null);}
function syncCanvas(){
  if(window.resizeDrawCanvas) requestAnimationFrame(()=>requestAnimationFrame(()=>{window.resizeDrawCanvas();restoreDrawing();}));
}

function attachTap(el,handler){
  if(!el) return;
  let sx=0,sy=0,penTap=false,tracking=false;
  el.addEventListener('pointerdown',e=>{tracking=true;sx=e.clientX;sy=e.clientY;penTap=e.pointerType==='pen';el.classList.add('pressed');},{passive:true});
  el.addEventListener('pointerup',e=>{
    el.classList.remove('pressed'); if(!tracking) return; tracking=false;
    if(penTap&&window.isDrawingActive&&window.isDrawingActive()) return;
    if(Math.hypot(e.clientX-sx,e.clientY-sy)>10) return;
    handler(e);
  });
  el.addEventListener('pointercancel',()=>{tracking=false;el.classList.remove('pressed');});
  el.addEventListener('pointerleave',()=>{if(tracking)el.classList.remove('pressed');});
}

function render(){
  const total=SUB.questions.length;
  renderDots();
  lessonArea.className='qcard '+(quizIdx<SUB.questions.length&&wrongLabel(quizIdx)%2===0?'even':'odd');
  const leaves='';
  if(quizIdx>=total){
    const {correct,total:tp}=quizScore(), pc=tp?correct/tp:0;
    const msg=pc===1?'Ідеально! Усі відповіді правильні 🎉':pc>=.75?'Дуже добре! Ще трохи — і буде ідеально.':pc>=.5?'Непогано — перегляньте питання з помилками.':'Варто повторити тему та пройти тест ще раз.';
    lessonArea.innerHTML=leaves+'<div class="done-screen"><img class="done-banner" src="'+STK.banner+'" alt="" draggable="false"><div class="ring"><div class="big">'+correct+'/'+tp+'</div><small>балів</small></div><h2>Тест завершено</h2><p class="section-intro">'+msg+'</p><p class="section-intro" style="font-size:13px;">Натисніть на номер питання, щоб переглянути відповідь.</p><div class="send-status" id="sendStatus"></div><button class="btn primary" id="quizRestart" style="margin:6px auto 0;">Пройти ще раз</button></div>';
    attachTap(document.getElementById('quizRestart'),()=>{quizIdx=0;quizAnswers={};selState={};_resultState='idle';render();window.scrollTo(0,0);});
    sendResultOnce(); syncCanvas(); return;
  }
  const q=SUB.questions[quizIdx], rec=quizAnswers[quizIdx], multi=isMulti(q), pts=ptsOf(q);
  const sel=rec?(multi?rec.picked:[rec.picked]):(selState[quizIdx]||[]);
  let fb='';
  if(rec){
    if(rec.got===pts) fb='<div class="feedback show ok">'+img('check')+'<span>Правильно!'+(pts>1?' +'+pts+' бали':'')+'</span></div>';
    else if(rec.got>0) fb='<div class="feedback show part">'+img('excl')+'<span>Частково правильно: '+rec.got+' з '+pts+' бал. Правильна відповідь — '+rightText(q)+'.</span></div>';
    else fb='<div class="feedback show bad">'+img('x')+'<span>Правильна відповідь — '+rightText(q)+'.</span></div>';
  } else fb='<div class="feedback"></div>';
  const ptsTxt=pts+(pts===1?' бал':(pts<5?' бали':' балів'));
  lessonArea.innerHTML=leaves+
   '<div class="qhead"><div class="qnum"><b>'+wrongLabel(quizIdx)+'</b>'+(q._n?('('+(quizIdx+1)+' з '+total+')'):('з '+total))+'</div><div class="pts">'+ptsTxt+'</div></div>'+
   '<div class="qgrid"><div class="qmain"><p class="qtext">'+q.q+'</p>'+(multi?'<p class="qhint">'+(q.hint||'Можливо кілька правильних відповідей.')+'</p>':'')+'<div class="options">'+optsHTML(q,sel,!!rec)+'</div></div>'+(q.img?'<div class="qimg">'+img(q.img)+'</div>':'')+'</div>'+
   fb+
   '<div class="nav-row"><button class="btn ghost" id="quizPrev" '+(quizIdx===0?'disabled':'')+'>← Назад</button><button class="btn primary" id="quizNext" '+((rec||(multi&&sel.length))?'':'disabled')+'>'+(rec?(quizIdx===total-1?'До результату':'Далі →'):'Перевірити')+'</button></div>';
  if(!rec){
    lessonArea.querySelectorAll('.opt').forEach(btn=>attachTap(btn,()=>{
      const i=+btn.dataset.i;
      if(multi){
        const s=(selState[quizIdx]||[]).slice(); const k=s.indexOf(i); if(k>=0) s.splice(k,1); else s.push(i);
        selState[quizIdx]=s.sort((a,b)=>a-b); render();
      } else { quizAnswers[quizIdx]={picked:i,got:grade(q,i)}; render(); }
    }));
  }
  attachTap(document.getElementById('quizPrev'),()=>{saveDrawing();quizIdx--;render();});
  attachTap(document.getElementById('quizNext'),()=>{
    if(!quizAnswers[quizIdx]){
      const p=(selState[quizIdx]||[]); if(!p.length) return;
      quizAnswers[quizIdx]={picked:p,got:grade(q,p)}; render(); return;
    }
    saveDrawing();quizIdx++;render();window.scrollTo({top:0,behavior:'smooth'});
  });
  syncCanvas();
}

function renderReview(){
  document.getElementById('hero').style.display='none'; dotsEl.style.display='none';
  let html='<div class="rev" style="box-shadow:none;padding:0;"><p class="qtext">Розбір відповідей</p><p class="section-intro">Питання, в яких були помилки.</p></div>';
  String(window.__reviewMode).split('|').forEach(it=>{
    const k=it.indexOf(':'); if(k<0) return;
    const n=parseInt(it.slice(0,k),10), q=TEST[n-1]; if(!q) return;
    const p=it.slice(k+1).split('.').map(x=>parseInt(x,10)).filter(x=>!isNaN(x));
    html+='<div class="rev"><div class="qhead"><div class="qnum"><b>'+n+'</b></div><div class="pts">'+ptsOf(q)+' б.</div></div><p class="qtext">'+q.q+'</p><div class="options">'+optsHTML(q,p,true)+'</div></div>';
  });
  lessonArea.className=''; lessonArea.style.background='transparent'; lessonArea.style.boxShadow='none'; lessonArea.style.padding='0';
  lessonArea.innerHTML=html;
}

const rv=new URLSearchParams(location.search).get('review');
if(rv){window.__reviewMode=rv;renderReview();} else render();

// ===== малювання поверх екрана (режим «учитель») =====
(function(){
  const canvas=document.getElementById('drawCanvas'), ctx=canvas.getContext('2d');
  const toggleBtn=document.getElementById('drawToggleBtn'), toolbar=document.getElementById('drawToolbar'), toolbarMini=document.getElementById('drawToolbarMini');
  const minimizeBtn=document.getElementById('minimizeBtn'), xthinBtn=document.getElementById('xthinBtn'), thinBtn=document.getElementById('thinBtn'), thickBtn=document.getElementById('thickBtn');
  const eraserBtn=document.getElementById('eraserBtn'), clearBtn=document.getElementById('clearBtn'), swatches=document.querySelectorAll('.swatch');
  let active=false, isDrawing=false, color="#F5304A", width=2, eraser=false, lastX=0, lastY=0, pid=null;
  window.isDrawingActive=()=>active;
  function docH(){return Math.max(document.documentElement.scrollHeight,document.body.scrollHeight,window.innerHeight);}
  function resize(){
    const w=document.documentElement.clientWidth,h=docH();
    const prev=document.createElement('canvas');prev.width=canvas.width;prev.height=canvas.height;
    if(canvas.width&&canvas.height) prev.getContext('2d').drawImage(canvas,0,0);
    canvas.width=w*devicePixelRatio;canvas.height=h*devicePixelRatio;canvas.style.width=w+'px';canvas.style.height=h+'px';
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);ctx.lineCap='round';ctx.lineJoin='round';
    if(prev.width&&prev.height) ctx.drawImage(prev,0,0,prev.width/devicePixelRatio,prev.height/devicePixelRatio);
  }
  window.resizeDrawCanvas=resize; resize();
  window.addEventListener('resize',resize);
  if(window.ResizeObserver) new ResizeObserver(resize).observe(document.body);
  window.clearDrawing=()=>ctx.clearRect(0,0,canvas.width,canvas.height);
  window.getDrawingSnapshot=()=>{try{return(canvas.width&&canvas.height)?canvas.toDataURL('image/png'):null;}catch(e){return null;}};
  window.setDrawingSnapshot=function(url){
    ctx.clearRect(0,0,canvas.width,canvas.height); if(!url) return;
    const img=new Image(); img.onload=()=>ctx.drawImage(img,0,0,canvas.width/devicePixelRatio,canvas.height/devicePixelRatio); img.src=url;
  };
  function setActive(on){active=on;toolbar.classList.toggle('show',on);toolbar.classList.remove('mini');toolbarMini.classList.remove('show');toggleBtn.classList.toggle('on',on);toggleBtn.title=on?'Вимкнути малювання':'Малювати';}
  toggleBtn.addEventListener('click',()=>setActive(!active));
  minimizeBtn.addEventListener('click',()=>{toolbar.classList.remove('show');toolbar.classList.add('mini');toolbarMini.classList.add('show');});
  toolbarMini.addEventListener('click',()=>{toolbar.classList.remove('mini');toolbar.classList.add('show');toolbarMini.classList.remove('show');});
  swatches.forEach(sw=>sw.addEventListener('click',()=>{swatches.forEach(s=>s.classList.remove('selected'));sw.classList.add('selected');color=sw.dataset.color;eraser=false;eraserBtn.classList.remove('selected');}));
  function setW(w,btn){width=w;[xthinBtn,thinBtn,thickBtn].forEach(b=>b.classList.remove('selected'));btn.classList.add('selected');}
  xthinBtn.addEventListener('click',()=>setW(2,xthinBtn));
  thinBtn.addEventListener('click',()=>setW(5,thinBtn));
  thickBtn.addEventListener('click',()=>setW(11,thickBtn));
  eraserBtn.addEventListener('click',()=>{eraser=!eraser;eraserBtn.classList.toggle('selected',eraser);});
  clearBtn.addEventListener('click',()=>window.clearDrawing());
  function pos(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top,p:e.pressure||0.5};}
  const onCtl=e=>!!(e.target.closest&&e.target.closest('#drawToolbar,#drawToolbarMini,#drawToggleBtn'));
  document.addEventListener('pointerdown',e=>{
    if(!active||e.pointerType!=='pen'||onCtl(e)) return;
    e.preventDefault();isDrawing=true;pid=e.pointerId;const p=pos(e);lastX=p.x;lastY=p.y;
  },{passive:false});
  document.addEventListener('pointermove',e=>{
    if(!active||!isDrawing||e.pointerId!==pid) return;
    e.preventDefault();const p=pos(e);
    ctx.globalCompositeOperation=eraser?'destination-out':'source-over';ctx.strokeStyle=color;
    ctx.lineWidth=(eraser?width*3:width)*(0.6+p.p*0.8);
    ctx.beginPath();ctx.moveTo(lastX,lastY);ctx.lineTo(p.x,p.y);ctx.stroke();lastX=p.x;lastY=p.y;
  },{passive:false});
  const stop=e=>{if(e&&e.pointerId!==undefined&&e.pointerId!==pid) return;isDrawing=false;pid=null;};
  document.addEventListener('pointerup',stop);document.addEventListener('pointercancel',stop);
  document.addEventListener('touchmove',e=>{if(active&&e.touches&&e.touches[0]&&e.touches[0].touchType==='stylus') e.preventDefault();},{passive:false});
})();
</script>
