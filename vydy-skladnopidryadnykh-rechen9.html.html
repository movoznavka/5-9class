<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Види підрядних речень · Тест</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EBDFFB;--bg-soft:#F4EEFD;--card:#FFFBEA;--ink:#241934;--ink-soft:#8577A0;--line:rgba(36,25,52,0.08);
    --c1-a:#C9A6FF;--c1-b:#8B5CF6;--c1-sh:rgba(139,92,246,0.45);
    --c3-b:#17A863;--c2-b:#D8393E;
    --correct-bg:#E6F8EE;--correct-ink:#128A54;--wrong-bg:#FDECEC;--wrong-ink:#D8393E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px;position:relative;}
  .wrap{max-width:760px;margin:0 auto;}
  .topbar{display:flex;justify-content:space-between;align-items:center;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(36,25,52,0.14);}
  .kicker{font-family:'Manrope',sans-serif;font-weight:800;font-size:12.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);opacity:.55;}
  h1{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(24px,5.6vw,36px);line-height:1.08;margin:0 0 22px;text-transform:uppercase;}
  .card{background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:0 20px 44px -28px rgba(36,25,52,0.35);}
  .section-title{font-family:'Manrope',sans-serif;font-weight:800;font-size:20px;margin:0 0 8px;}
  .section-intro{color:var(--ink-soft);font-size:14.5px;line-height:1.6;margin:0 0 18px;}
  .qprog{font-family:'Manrope',sans-serif;font-weight:700;font-size:13px;color:var(--ink-soft);margin-bottom:14px;}
  .qtext{font-family:'Manrope',sans-serif;font-size:19px;font-weight:700;line-height:1.4;margin:0 0 18px;}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--bg-soft);cursor:pointer;font-family:'Inter',sans-serif;font-size:14.5px;font-weight:500;color:var(--ink);transition:transform .12s ease,background .15s ease;}
  .opt:hover{transform:translateY(-1px);}
  .opt[disabled]{cursor:default;}
  .opt[disabled]:hover{transform:none;}
  .tile{position:relative;width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;color:var(--c1-b);background:linear-gradient(150deg,rgba(255,255,255,0.75),rgba(139,92,246,0.22));border:1px solid rgba(255,255,255,0.7);box-shadow:0 4px 12px -7px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,0.8);}
  .badge{position:absolute;top:-5px;right:-5px;width:16px;height:16px;border-radius:50%;border:2px solid var(--card);display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:800;color:#fff;}
  .badge.ok{background:var(--c3-b);}
  .badge.no{background:var(--c2-b);}
  .opt.correct{background:var(--correct-bg);}
  .opt.wrong{background:var(--wrong-bg);}
  .opt.dim{opacity:.5;}

  /* відповідності */
  .mgrid{background:#E4F1FB;border-radius:24px;padding:16px;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:16px;}
  .mleft,.mright{display:flex;flex-direction:column;gap:10px;}
  .mrow{display:flex;align-items:center;gap:8px;}
  .mitem{flex:1 1 auto;min-width:0;background:#fff;border-radius:16px;padding:12px 14px;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;line-height:1.35;}
  .mitem b{color:var(--c1-b);margin-right:4px;}
  .marrow{color:var(--ink-soft);font-size:16px;}
  .mslot{flex:0 0 64px;height:46px;border-radius:14px;border:1.5px dashed rgba(139,92,246,0.5);background:rgba(255,255,255,0.45);font-family:'Manrope',sans-serif;font-weight:800;font-size:16px;color:var(--c1-b);cursor:pointer;}
  .mslot.active{border-style:solid;background:#fff;box-shadow:0 0 0 3px rgba(139,92,246,0.25);}
  .mslot.filled{border-style:solid;border-color:transparent;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;}
  .mslot.ok{background:var(--c3-b);color:#fff;border-color:transparent;}
  .mslot.no{background:var(--c2-b);color:#fff;border-color:transparent;}
  .mslot[disabled]{cursor:default;}
  .mopt{display:block;width:100%;text-align:left;background:#fff;border:none;border-radius:16px;padding:12px 14px;font-family:'Manrope',sans-serif;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;transition:opacity .15s,transform .12s;}
  .mopt b{color:var(--c1-b);margin-right:4px;}
  .mopt:hover{transform:translateY(-1px);}
  .mopt.used{opacity:.4;}
  .mopt[disabled]{cursor:default;}
  .mopt[disabled]:hover{transform:none;}
  @media(max-width:560px){.mgrid{grid-template-columns:1fr;}}
  .feedback{margin-top:16px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600;display:none;align-items:center;gap:9px;}
  .feedback.show{display:flex;}
  .feedback.ok{background:var(--correct-bg);color:var(--correct-ink);}
  .feedback.bad{background:var(--wrong-bg);color:var(--wrong-ink);}
  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:22px;}
  .btn{font-family:'Manrope',sans-serif;font-weight:800;font-size:13px;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;display:flex;align-items:center;gap:6px;}
  .btn.primary{background:linear-gradient(155deg,var(--c1-a),var(--c1-b));color:#fff;box-shadow:0 10px 20px -8px var(--c1-sh);}
  .btn.ghost{background:transparent;color:var(--ink-soft);}
  .btn:disabled{opacity:.3;cursor:default;box-shadow:none;}
  .opt.pressed{transform:scale(0.98);background:#EEE6FB;}
  .btn.pressed{transform:scale(0.95);filter:brightness(0.94);}
  .done-screen{text-align:center;}
  .done-screen .ring{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 16px 30px -12px var(--c1-sh);display:flex;align-items:center;justify-content:center;}
  .done-screen .big{font-family:'Manrope',sans-serif;font-weight:800;font-size:28px;color:#fff;}
  .send-status{font-size:13px;font-weight:600;color:var(--ink-soft);margin-top:10px;min-height:18px;}
  .send-status.ok{color:var(--correct-ink);}
  .send-status.bad{color:var(--c2-b);}
  .btn.ghost.small{padding:8px 14px;font-size:12px;display:inline-flex;}
  footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--ink-soft);font-weight:500;}

  /* малювання (режим "учитель") */
  #drawCanvas{position:absolute;top:0;left:0;z-index:9998;pointer-events:none;}
  #drawToggleBtn{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(150deg,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,var(--c1-a),var(--c1-b));box-shadow:0 14px 28px -10px var(--c1-sh),inset 0 1px 1px rgba(255,255,255,0.6);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .18s;}
  #drawToggleBtn svg{width:24px;height:24px;transition:transform .25s;}
  #drawToggleBtn:active{transform:scale(0.9);}
  #drawToggleBtn.on{background:linear-gradient(150deg,rgba(255,255,255,0.35),rgba(255,255,255,0) 60%),linear-gradient(155deg,#FF8A65,var(--c2-b));}
  #drawToggleBtn.on svg{transform:rotate(90deg);}
  #drawToolbar{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;display:flex;align-items:center;gap:12px;background:linear-gradient(150deg,rgba(255,255,255,0.6),rgba(255,255,255,0.15));backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid rgba(255,255,255,0.7);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(36,25,52,0.45);z-index:9999;transition:transform .25s,opacity .2s;pointer-events:none;}
  #drawToolbar.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
  #drawToolbar.mini{transform:translateX(-50%) translateY(130%) scale(0.94);opacity:0;pointer-events:none;}
  #drawToolbarMini{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(130%) scale(0.9);opacity:0;width:40px;height:26px;border-radius:14px;border:1px solid rgba(255,255,255,0.5);background:linear-gradient(155deg,var(--c1-a),var(--c1-b));display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:9999;transition:transform .25s,opacity .2s;pointer-events:none;}
  #drawToolbarMini svg{width:18px;height:18px;}
  #drawToolbarMini.show{transform:translateX(-50%) translateY(0) scale(1);opacity:1;pointer-events:auto;}
  .swatch{position:relative;width:25px;height:25px;border-radius:50%;border:none;box-shadow:0 3px 8px -2px rgba(36,25,52,0.35);cursor:pointer;padding:0;}
  .swatch::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ink);opacity:0;}
  .swatch.selected{transform:scale(1.08);}
  .swatch.selected::after{opacity:1;}
  .tool-btn{width:34px;height:34px;border-radius:50%;border:none;background:rgba(255,255,255,0.5);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .tool-btn svg{width:16px;height:16px;}
  .tool-btn .dot{border-radius:50%;background:currentColor;}
  #xthinBtn .dot{width:3.5px;height:3.5px;}
  #thinBtn .dot{width:7px;height:7px;}
  #thickBtn .dot{width:12.5px;height:12.5px;}
  .tool-btn.selected{background:var(--c1-b);color:#fff;}
  .tool-sep{width:1px;height:22px;background:rgba(36,25,52,0.14);}
  @media (max-width:480px){
    #drawToolbar{max-width:94vw;overflow-x:auto;padding:8px 13px;gap:9px;}
    .swatch{width:21px;height:21px;}
    .tool-btn{width:30px;height:30px;}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <div class="kicker">Складнопідрядні речення · Тест</div>
  </div>
  <h1>Тест</h1>
  <div class="card" id="lessonArea"></div>
  <footer>@movoznavka</footer>
</div>

<canvas id="drawCanvas"></canvas>
<button id="drawToggleBtn" title="Малювати">
  <svg viewBox="0 0 24 24" fill="none"><path d="M4 20L4.6 16.6C4.7 15.9 5.03 15.26 5.55 14.79L15.3 5.7C16.09 4.96 17.34 4.99 18.09 5.78L18.34 6.04C19.08 6.83 19.04 8.08 18.25 8.81L8.5 17.9C8 18.37 7.37 18.66 6.7 18.75L4 20Z" stroke="white" stroke-width="1.7" stroke-linejoin="round"/><path d="M13.5 7.5L16.5 10.3" stroke="white" stroke-width="1.7" stroke-linecap="round"/></svg>
</button>
<div id="drawToolbar">
  <button class="swatch selected" style="background:#F5304A" data-color="#F5304A"></button>
  <button class="swatch" style="background:#3355EE" data-color="#3355EE"></button>
  <button class="swatch" style="background:#17A863" data-color="#17A863"></button>
  <button class="swatch" style="background:#241934" data-color="#241934"></button>
  <div class="tool-sep"></div>
  <button class="tool-btn selected" id="xthinBtn" title="Дуже тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thinBtn" title="Тонка лінія"><span class="dot"></span></button>
  <button class="tool-btn" id="thickBtn" title="Товста лінія"><span class="dot"></span></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="eraserBtn" title="Ластик"><svg viewBox="0 0 24 24" fill="none"><path d="M18.5 13.5L10.5 21.5H5.5L2.5 18.5C2.11 18.11 2.11 17.48 2.5 17.09L13.5 6.09C13.89 5.7 14.52 5.7 14.91 6.09L18.5 9.68C19.5 10.68 19.5 12.5 18.5 13.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M9 13.5L15 19.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  <button class="tool-btn" id="clearBtn" title="Очистити все"><svg viewBox="0 0 24 24" fill="none"><path d="M5 7H19" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M9.5 7V4.8C9.5 4.36 9.86 4 10.3 4H13.7C14.14 4 14.5 4.36 14.5 4.8V7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M7 7L7.6 19.2C7.63 19.9 8.2 20.5 8.9 20.5H15.1C15.8 20.5 16.37 19.9 16.4 19.2L17 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <div class="tool-sep"></div>
  <button class="tool-btn" id="minimizeBtn" title="Згорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 9L12 15L18 9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
</div>
<button id="drawToolbarMini" title="Розгорнути панель"><svg viewBox="0 0 24 24" fill="none"><path d="M6 15L12 9L18 15" stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>

<script>
/* ============================================================
   ТЕСТ. Два типи питань:
   Q(текст, [варіанти], індексПравильного)               — одна відповідь
   M(текст, [фрагменти], [види підрядного], [індекси])   — відповідність
   testName має збігатись з назвою тесту в TOPICS у Code89.gs
   ============================================================ */
const Q = (q, opts, a) => ({type:"single", q, opts, a});
const M = (q, items, types, a) => ({type:"match", q, items, types, a});

const MATCH_Q = "З’ясуйте, який вид підрядного відповідає кожному фрагментові складного речення.";
const EX_Q = "Доберіть приклад до кожного виду підрядного речення.";
const ADD = (t) => `Складне речення з підрядним ${t} утвориться, якщо до частини `;

const TEST = {
  id: "t1",
  testName: "Види підрядних речень",
  title: "Тест: Види підрядних речень",
  intro: "Питання з однією відповіддю — оберіть варіант. У завданнях на відповідність обрати літеру для кожного номера.",
  questions: [
    M(MATCH_Q, ["… зізнаються, якщо …","… зізналися, бо …","… зізнався, що …","… зізналася, дарма що …"],
      ["місця","умови","допусту","причини","з’ясувальне"], [1,3,4,2]),
    M(MATCH_Q, ["… знав, незважаючи на те що …","… провалився, так що …","… покидаємо, через те що …","… приїдемо, щоб …"],
      ["мети","умови","допусту","причини","наслідку"], [2,4,3,0]),
    M(MATCH_Q, ["… ударив, що аж …","… відмовилася, оскільки …","… допоміг би, якби …","… будинок, у якому …"],
      ["умови","причини","наслідку","означальне","міри і ступеня"], [4,1,0,3]),
    M(MATCH_Q, ["Я твердо переконаний, що …","Настав той день, коли …","… та мати не погодилася.","… то б і горя не знали."],
      ["означальне","з’ясувальне","допустове","умови","місця"], [1,0,2,3]),
    M(MATCH_Q, ["Щоб перемогти, …","Мені наснилося, що …","Пролунав постріл, так що …","Ми залишилися вдома, дарма що …"],
      ["міри і ступеня","з’ясувальне","наслідку","допусту","мети"], [4,1,2,3]),
    M(MATCH_Q, ["Ліс, де … , здивував своєю тишею.","Там, де … , сонце рожеве сідає.","Хоч … , але ми виграли кубок.","Що … , то більше знаєш."],
      ["місця","допусту","способу дії","означальне","міри і ступеня"], [3,0,1,4]),
    Q(ADD("означальним")+"«Ми пішли до річки…» додати", ["хоч і почав накрапати дощ.","бо вирішили трохи поплавати.","про яку складено багато легенд.","щоб наловити карасиків на вечерю."], 2),
    Q("Складнопідрядним із підрядним означальним є речення", ["Для кактуса досить двох крапель води, щоб існувати місяцями під прямим сонцем.","Напровесні, десь надвечір, чуємо, ніби пробують голоси солов’ї.","Бачу за морями золоті дороги, де припав до неба синьоокий степ.","Ми вірили, що своїми руками розіб’ємо скалю, роздробимо граніт."], 2),
    Q(ADD("з’ясувальним")+"«Заспіваю вам …» додати", ["якщо буде настрій.","бо якось сумно стало.","щоб трохи розважитися.","про що інші не наважуються."], 3),
    Q("Складнопідрядним із підрядним з’ясувальним є речення", ["Я люблю, як у вечірній час сопілка заспіває переливно.","Моя вічна пісня та, що з дитинства несу через всі літа.","Я виростав серед пісень, що їх співала тихо мати.","І заручини справимо такі, що й земля гудітиме."], 0),
    Q(ADD("способу дії")+"«Замиси тісто так …» додати", ["як це робила наша бабуся.","бо інакше воно буде глевким.","коли приїдуть онуки на канікули.","якщо на випікання буде мало часу."], 0),
    Q("Складнопідрядним із підрядним способу дії є речення", ["Уживайте якомога більше слів, які підкреслюють шанобливе ставлення до людей.","Важко переоцінити вплив, що його справив на перебіг історії Богдан Хмельницький.","Старий дзвонар розповідав, як десь дівчата дзвонами привертали парубочі серця.","Буває так, що помилка закріплюється в мові, передається нащадкам і стає нормою."], 3),
    Q(ADD("міри і ступеня")+"«Блискавка врізала …» додати", ["як бик хвостом хвисьнув.","коли ми виходили з озера.","що аж батько з братом зойкнули.","щоб нагадати світові про свою силу."], 2),
    Q("Складнопідрядним із підрядним міри і ступеня є речення", ["Лукаш хоче надрізати ножем березу, щоб сточити сік.","Хоч би раз піднятися туди, де й птах ніякий не бував.","Сонце світить так ласкаво, що аж каміння сміється.","Як снасть ламається, чоловік ума набирається."], 2),
    Q(ADD("порівняльним")+"«В очах зникає блиск …» додати", ["коли чуєш невтішні новини.","хоч для цього й немає причини.","бо роки забирають силу й наснагу.","наче сонце ховається за небокрай."], 3),
    Q("Складнопідрядним із підрядним порівняльним є речення", ["На плесі вода така темна, ніби вона на чорному камені настояна.","Високо поросло дерево вгору, укриваючи холодком зелену землю, на котрій буяє розкішна рослина.","Щасливий майстер, що з тяжкої брили прекрасну постать висікає вміло на радість людям.","І блідий місяць на ту пору із хмари де-де виглядав, неначе човен в синім морі то виринав, то потопав."], 0),
    Q("Складне речення з підрядним місця утвориться, якщо частину «де ми познайомилися» поставити на місці пропуску в рядку", ["Біля озера, … , співають солов’ї.","У парку, … , зацвіли магнолії.","Анно, чекатиму тебе, … .","Будь ласка, нагадай, … ."], 2),

/* /exec-посилання Apps Script проєкту бота (те саме, що HOMEWORK_API_URL в index89.html) */
const API_URL = "https://script.google.com/macros/s/AKfycbxWkeJYw7gUdEjM9H2oeMVTMhBLEq1dDa2DcqNS5vSQjJb19aXyR7p7kDz_otyK3sTggw/exec";
let _resultState = 'idle';

async function sendResultOnce_(s){
  if(_resultState === 'sending' || _resultState === 'sent') return;
  const student = new URLSearchParams(location.search).get('student');
  const statusEl = document.getElementById('sendStatus');
  if(!student || !API_URL){ if(statusEl) statusEl.textContent = ''; return; }
  _resultState = 'sending';
  if(statusEl){ statusEl.textContent = 'Надсилаємо результат...'; statusEl.className = 'send-status'; }
  const {correct, answered, total} = quizScore(s.questions);
  const wrongList = [];
  s.questions.forEach((_,i)=>{ const r = quizAnswers[i]; if(r && !r.correct) wrongList.push(i+1); });
  try{
    const resp = await fetch(API_URL, {
      method: 'POST',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify({type:'quiz_result', student, testName: s.testName, correct, answered, total, wrongList, reviewLink:'', flaggedList:[]})
    });
    if(!resp || !resp.ok) throw new Error('bad status');
    _resultState = 'sent';
    if(statusEl){ statusEl.textContent = 'Результат надіслано вчителю ✓'; statusEl.className = 'send-status ok'; }
  }catch(e){
    _resultState = 'failed';
    if(statusEl){
      statusEl.innerHTML = 'Не вдалося надіслати результат (перевірте інтернет). <button class="btn ghost small" id="retrySendBtn">Спробувати ще раз</button>';
      statusEl.className = 'send-status bad';
      const b = document.getElementById('retrySendBtn');
      if(b) b.onclick = ()=>{ _resultState = 'idle'; sendResultOnce_(s); };
    }
  }
}

const LETTERS = ["А","Б","В","Г","Д","Е","Є"];
let quizIdx = 0;
let quizAnswers = {};
let drafts = {};

// ?hw=N — відкрити питання з номером N
(function(){
  const n = parseInt(new URLSearchParams(location.search).get('hw'), 10);
  if(!isNaN(n) && n >= 1 && n <= TEST.questions.length) quizIdx = n - 1;
})();

const lessonArea = document.getElementById('lessonArea');
function resetQuiz(){ quizIdx = 0; quizAnswers = {}; drafts = {}; _resultState = 'idle'; }

const drawStore = {};
function sectionKey(){ return 'q' + quizIdx; }
function saveCurrentDrawing(){ if(window.getDrawingSnapshot) drawStore[sectionKey()] = window.getDrawingSnapshot(); }
function restoreCurrentDrawing(){ if(window.setDrawingSnapshot) window.setDrawingSnapshot(drawStore[sectionKey()] || null); }

function quizScore(qs){
  let correct = 0, answered = 0;
  qs.forEach((_,i)=>{ const r = quizAnswers[i]; if(r){ answered++; if(r.correct) correct++; } });
  return {correct, answered, total: qs.length};
}

function attachTapToggle(el, handler){
  if(!el) return;
  let sx = 0, sy = 0, penTap = false, tracking = false;
  el.addEventListener('pointerdown', (e)=>{
    tracking = true; sx = e.clientX; sy = e.clientY; penTap = e.pointerType === 'pen';
    el.classList.add('pressed');
  }, {passive:true});
  el.addEventListener('pointerup', (e)=>{
    el.classList.remove('pressed');
    if(!tracking) return;
    tracking = false;
    if(penTap && window.isDrawingActive && window.isDrawingActive()) return;
    if(Math.hypot(e.clientX - sx, e.clientY - sy) > 10) return;
    handler(e);
  });
  el.addEventListener('pointercancel', ()=>{ tracking = false; el.classList.remove('pressed'); });
  el.addEventListener('pointerleave', ()=>{ if(tracking) el.classList.remove('pressed'); });
}
window.attachTapToggle = attachTapToggle;

function renderContent(){
  lessonArea.innerHTML = `<p class="section-title">${TEST.title}</p><p class="section-intro">${TEST.intro}</p>`;
  renderQuiz(TEST);
  if(window.resizeDrawCanvas){
    requestAnimationFrame(()=> requestAnimationFrame(()=>{ window.resizeDrawCanvas(); restoreCurrentDrawing(); }));
  }
}

function renderQuiz(s){
  const total = s.questions.length;

  if(quizIdx >= total){
    const {correct} = quizScore(s.questions);
    const extra = document.createElement('div');
    extra.className = 'done-screen';
    extra.innerHTML = `
      <div class="ring"><div class="big">${correct}/${total}</div></div>
      <p class="section-intro" style="margin-top:10px;">${correct===total ? 'Ідеально! Матеріал засвоєно 🎉' : 'Непогано — можна пройти ще раз.'}</p>
      <div class="send-status" id="sendStatus"></div>
      <button class="btn primary" id="quizRestart" style="margin:6px auto 0;">Пройти ще раз</button>`;
    lessonArea.appendChild(extra);
    attachTapToggle(document.getElementById('quizRestart'), ()=>{ resetQuiz(); renderContent(); });
    sendResultOnce_(s);
    return;
  }

  const q = s.questions[quizIdx];
  const rec = quizAnswers[quizIdx];
  const box = document.createElement('div');
  const navHtml = `
    <div class="nav-row">
      <button class="btn ghost" id="quizPrev" ${quizIdx===0?'disabled':''}>← Назад</button>
      <button class="btn primary" id="quizNext" ${rec?'':'disabled'}>${quizIdx===total-1?'До результату':'Далі →'}</button>
    </div>`;

  if(q.type === "match"){
    const picks = rec ? rec.picks : (drafts[quizIdx] || (drafts[quizIdx] = []));
    const fbText = rec ? (rec.correct ? '<b>Правильно.</b>' :
      'Правильна відповідь: ' + q.a.map((c,r)=>`<b>${r+1}–${LETTERS[c]}</b>`).join(', ')) : '';
    box.innerHTML = `
      <div class="qprog">Питання ${quizIdx+1} з ${total}</div>
      <p class="qtext">${q.q}</p>
      <div class="mgrid">
        <div class="mleft">
          ${q.items.map((it,r)=>`
            <div class="mrow">
              <div class="mitem"><b>${r+1}.</b>${it}</div>
              <span class="marrow">→</span>
              <button class="mslot" data-r="${r}" ${rec?'disabled':''}>?</button>
            </div>`).join('')}
        </div>
        <div class="mright">
          ${q.types.map((t,c)=>`<button class="mopt" data-c="${c}" ${rec?'disabled':''}><b>${LETTERS[c]}.</b>${t}</button>`).join('')}
        </div>
      </div>
      <div style="margin-top:16px;"><button class="btn primary" id="matchCheck" ${rec?'disabled':''}>Перевірити</button></div>
      <div class="feedback ${rec?'show '+(rec.correct?'ok':'bad'):''}"><span>${fbText}</span></div>
      ${navHtml}`;
    lessonArea.appendChild(box);

    const slots = box.querySelectorAll('.mslot');
    const opts = box.querySelectorAll('.mopt');
    const checkBtn = document.getElementById('matchCheck');
    let active = rec ? null : picks.findIndex((v,i)=> v===undefined);
    if(active === -1 || (!rec && picks.length < q.items.length && active === undefined)) active = 0;
    if(!rec && active === null) active = 0;

    function paint(){
      slots.forEach((sl,r)=>{
        const v = picks[r];
        sl.textContent = v===undefined ? '?' : LETTERS[v];
        sl.className = 'mslot';
        if(rec) sl.classList.add(v===q.a[r] ? 'ok' : 'no');
        else if(v!==undefined) sl.classList.add('filled');
        if(!rec && active===r) sl.classList.add('active');
      });
      opts.forEach((o,c)=> o.classList.toggle('used', picks.includes(c)));
      if(!rec) checkBtn.disabled = !q.items.every((_,i)=> picks[i]!==undefined);
    }
    paint();

    if(!rec){
      slots.forEach((sl,r)=> sl.addEventListener('click', ()=>{
        if(active===r && picks[r]!==undefined){ picks[r] = undefined; }
        active = r; paint();
      }));
      opts.forEach((o,c)=> o.addEventListener('click', ()=>{
        let target = active;
        if(target===null || target===undefined){ target = q.items.findIndex((_,i)=> picks[i]===undefined); if(target===-1) target = 0; }
        const prev = picks.indexOf(c);
        if(prev !== -1) picks[prev] = undefined;
        picks[target] = c;
        const next = q.items.findIndex((_,i)=> picks[i]===undefined);
        active = next === -1 ? null : next;
        paint();
      }));
      attachTapToggle(checkBtn, ()=>{
        if(checkBtn.disabled || quizAnswers[quizIdx]) return;
        const p = q.items.map((_,i)=> picks[i]);
        quizAnswers[quizIdx] = {picks: p, correct: q.a.every((c,i)=> p[i]===c)};
        renderContent();
      });
    }
  } else {
    box.innerHTML = `
      <div class="qprog">Питання ${quizIdx+1} з ${total}</div>
      <p class="qtext">${q.q}</p>
      <div class="options">
        ${q.opts.map((o,i)=>`
          <button class="opt" data-i="${i}" ${rec?'disabled':''}>
            <span class="tile"><span>${LETTERS[i]}</span></span><span>${o}</span>
          </button>`).join('')}
      </div>
      <div class="feedback ${rec?'show '+(rec.correct?'ok':'bad'):''}">
        ${rec ? (rec.correct ? `<span><b>Правильно.</b></span>` : `<span>Правильна відповідь — ${LETTERS[q.a]}. ${q.opts[q.a]}</span>`) : ''}
      </div>
      ${navHtml}`;
    lessonArea.appendChild(box);

    if(rec){
      box.querySelectorAll('.opt').forEach((btn,i)=>{
        const tile = btn.querySelector('.tile');
        if(i===q.a){ btn.classList.add('correct'); tile.insertAdjacentHTML('beforeend','<span class="badge ok">✓</span>'); }
        else if(i===rec.picked){ btn.classList.add('wrong'); tile.insertAdjacentHTML('beforeend','<span class="badge no">✕</span>'); }
        else btn.classList.add('dim');
      });
    }
    box.querySelectorAll('.opt').forEach(btn=>{
      attachTapToggle(btn, ()=>{
        if(quizAnswers[quizIdx]) return;
        const picked = +btn.dataset.i;
        quizAnswers[quizIdx] = {picked, correct: picked===q.a};
        renderContent();
      });
    });
  }

  attachTapToggle(document.getElementById('quizPrev'), ()=>{ saveCurrentDrawing(); quizIdx--; renderContent(); });
  attachTapToggle(document.getElementById('quizNext'), ()=>{ saveCurrentDrawing(); quizIdx++; renderContent(); });
}

renderContent();

// ===== МАЛЮВАННЯ ПОВЕРХ ЕКРАНА (режим "учитель") =====
(function(){
  const canvas = document.getElementById('drawCanvas');
  const ctx = canvas.getContext('2d');
  const toggleBtn = document.getElementById('drawToggleBtn');
  const toolbar = document.getElementById('drawToolbar');
  const toolbarMini = document.getElementById('drawToolbarMini');
  const minimizeBtn = document.getElementById('minimizeBtn');
  const widthBtns = {xthin:document.getElementById('xthinBtn'), thin:document.getElementById('thinBtn'), thick:document.getElementById('thickBtn')};
  const eraserBtn = document.getElementById('eraserBtn');
  const clearBtn = document.getElementById('clearBtn');
  const swatches = document.querySelectorAll('.swatch');

  let drawingActive = false, isDrawing = false, currentColor = "#F5304A", currentWidth = 2, eraserMode = false;
  let lastX = 0, lastY = 0, activePointerId = null;
  window.isDrawingActive = ()=> drawingActive;

  function resizeCanvas(){
    const w = document.documentElement.clientWidth;
    const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight, window.innerHeight);
    const prev = document.createElement('canvas');
    prev.width = canvas.width; prev.height = canvas.height;
    if(canvas.width && canvas.height) prev.getContext('2d').drawImage(canvas, 0, 0);
    canvas.width = w * devicePixelRatio; canvas.height = h * devicePixelRatio;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if(prev.width && prev.height) ctx.drawImage(prev, 0, 0, prev.width / devicePixelRatio, prev.height / devicePixelRatio);
  }
  window.resizeDrawCanvas = resizeCanvas;
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', resizeCanvas);
  if(window.ResizeObserver) new ResizeObserver(resizeCanvas).observe(document.body);

  window.clearDrawing = ()=> ctx.clearRect(0, 0, canvas.width, canvas.height);
  window.getDrawingSnapshot = function(){ try{ return (canvas.width && canvas.height) ? canvas.toDataURL('image/png') : null; }catch(e){ return null; } };
  window.setDrawingSnapshot = function(url){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if(!url) return;
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img, 0, 0, canvas.width / devicePixelRatio, canvas.height / devicePixelRatio);
    img.src = url;
  };

  function setActive(on){
    drawingActive = on;
    toolbar.classList.toggle('show', on);
    toolbar.classList.remove('mini');
    toolbarMini.classList.remove('show');
    toggleBtn.classList.toggle('on', on);
  }
  toggleBtn.addEventListener('click', ()=> setActive(!drawingActive));
  minimizeBtn.addEventListener('click', ()=>{ toolbar.classList.remove('show'); toolbar.classList.add('mini'); toolbarMini.classList.add('show'); });
  toolbarMini.addEventListener('click', ()=>{ toolbar.classList.remove('mini'); toolbar.classList.add('show'); toolbarMini.classList.remove('show'); });

  swatches.forEach(sw=> sw.addEventListener('click', ()=>{
    swatches.forEach(s=>s.classList.remove('selected'));
    sw.classList.add('selected');
    currentColor = sw.dataset.color;
    eraserMode = false; eraserBtn.classList.remove('selected');
  }));
  const widths = {xthin:2, thin:5, thick:11};
  Object.keys(widthBtns).forEach(k=> widthBtns[k].addEventListener('click', ()=>{
    currentWidth = widths[k];
    Object.values(widthBtns).forEach(b=>b.classList.remove('selected'));
    widthBtns[k].classList.add('selected');
  }));
  eraserBtn.addEventListener('click', ()=>{ eraserMode = !eraserMode; eraserBtn.classList.toggle('selected', eraserMode); });
  clearBtn.addEventListener('click', window.clearDrawing);

  function pos(e){ const r = canvas.getBoundingClientRect(); return {x:e.clientX - r.left, y:e.clientY - r.top, pressure:e.pressure || 0.5}; }
  function onControls(e){ return !!(e.target.closest && e.target.closest('#drawToolbar, #drawToolbarMini, #drawToggleBtn')); }

  document.addEventListener('pointerdown', (e)=>{
    if(!drawingActive || e.pointerType !== 'pen' || onControls(e)) return;
    e.preventDefault();
    isDrawing = true; activePointerId = e.pointerId;
    const p = pos(e); lastX = p.x; lastY = p.y;
  }, {passive:false});
  document.addEventListener('pointermove', (e)=>{
    if(!drawingActive || !isDrawing || e.pointerId !== activePointerId) return;
    e.preventDefault();
    const p = pos(e);
    ctx.globalCompositeOperation = eraserMode ? 'destination-out' : 'source-over';
    ctx.strokeStyle = currentColor;
    ctx.lineWidth = (eraserMode ? currentWidth * 3 : currentWidth) * (0.6 + p.pressure * 0.8);
    ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(p.x, p.y); ctx.stroke();
    lastX = p.x; lastY = p.y;
  }, {passive:false});
  function stop(e){ if(e && e.pointerId !== undefined && e.pointerId !== activePointerId) return; isDrawing = false; activePointerId = null; }
  document.addEventListener('pointerup', stop);
  document.addEventListener('pointercancel', stop);
  document.addEventListener('touchmove', (e)=>{ if(drawingActive && e.touches[0] && e.touches[0].touchType === 'stylus') e.preventDefault(); }, {passive:false});
})();
</script>
