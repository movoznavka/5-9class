<style>
  :root{
    --bg:#FFFEEC;
    --bg-soft:#FBF7DA;
    --card:#FFFFFF;
    --ink:#2D2350;
    --ink-soft:#8C7FA8;
    --line: rgba(45,35,80,0.10);

    --c1-a:#C9B8F5; --c1-b:#A88AED; --c1-sh: rgba(168,138,237,0.45);
    --c3-a:#E2ECA0; --c3-b:#8C9425; --c3-sh: rgba(203,216,59,0.4);
    --c2-b:#4B3480;

    --correct-bg:#F3F6D9;
    --correct-ink:#7C8A16;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:28px 16px 64px;
  }
  .wrap{max-width:960px;margin:0 auto;}

  .topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:16px;
    margin-bottom:22px;
    border-bottom:1.5px solid rgba(19,33,59,0.14);
  }
  .kicker{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--ink);
    opacity:.55;
  }
  .kicker.tag{opacity:.4;}

  h1{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:clamp(26px,6vw,38px);
    line-height:1.05;
    letter-spacing:-0.01em;
    margin:0 0 8px;
    text-transform:uppercase;
  }
  h1 .hl{color:var(--c1-b);}
  .sub{color:var(--ink-soft);font-size:15px;max-width:60ch;margin:0 0 30px;font-weight:500;}

  .block{
    margin-bottom:46px;
  }
  .block-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    margin:0 0 4px;
    padding-bottom:12px;
    border-bottom:2px solid rgba(19,33,59,0.14);
  }
  .block-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:24px;
    letter-spacing:-0.01em;
    margin:0;
  }
  .block-test-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.01em;
    padding:9px 16px;
    border-radius:999px;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .block-test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .block-test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .block-test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.7;
    cursor:default;
    pointer-events:none;
  }

  .subgroup{ margin-bottom:26px; margin-top:24px; }
  .subgroup:first-of-type{ margin-top:22px; }
  .subgroup-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    flex-wrap:wrap;
    margin:0 0 14px 2px;
  }
  .subgroup-title{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:14px;
    letter-spacing:.04em;
    text-transform:uppercase;
    color:var(--c1-b);
    margin:0;
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:5px 14px 5px 12px;
    border-radius:999px;
    background: rgba(168,138,237,0.15);
  }
  .subgroup-title::before{
    content:'';
    width:6px;height:6px;
    border-radius:50%;
    background:var(--c1-b);
  }
  .subgroup-test-pill{
    display:inline-flex;
    align-items:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:11.5px;
    letter-spacing:.01em;
    padding:7px 13px;
    border-radius:999px;
    white-space:nowrap;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .subgroup-test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .subgroup-test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .subgroup-test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.7;
    cursor:default;
    pointer-events:none;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(250px, 1fr));
    gap:14px;
  }

  .card-wrap{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .card{
    background:var(--card);
    border-radius:22px;
    padding:22px 22px 20px;
    box-shadow: 0 14px 30px -24px rgba(19,33,59,0.35);
    text-decoration:none;
    color:var(--ink);
    display:flex;
    flex-direction:column;
    gap:12px;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card.ready:hover{
    transform:translateY(-3px);
    box-shadow: 0 18px 34px -18px rgba(19,33,59,0.4);
  }
  .card.soon{
    opacity:.5;
    cursor:default;
    pointer-events:none;
  }

  .card-top{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    gap:8px;
  }

  .tile{
    width:40px;height:40px;min-width:40px;
    border-radius:12px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:15px;
    color:var(--c1-b);
    background: linear-gradient(150deg, rgba(255,255,255,0.75), rgba(108,140,255,0.22));
    backdrop-filter: blur(6px) saturate(160%);
    -webkit-backdrop-filter: blur(6px) saturate(160%);
    border:1px solid rgba(255,255,255,0.7);
    box-shadow: 0 4px 12px -7px var(--c1-sh), inset 0 1px 1px rgba(255,255,255,0.8);

    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    white-space:nowrap;
  }
  .status.ready{background:var(--correct-bg);color:var(--correct-ink);}
  .status.soon{background:var(--bg-soft);color:var(--ink-soft);}

  .card-title{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:16.5px;
    line-height:1.32;
    margin:0;
  }
  .card-sub{
    font-size:13px;
    color:var(--ink-soft);
    font-weight:500;
    margin:0;
  }

  .pills{
    display:flex;
    gap:8px;
  }
  .pills .test-pill{ flex:1; }

  .test-pill{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    text-decoration:none;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12px;
    letter-spacing:.01em;
    padding:9px 14px;
    border-radius:14px;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .test-pill.ready{
    color:var(--c3-b);
    background:var(--correct-bg);
    cursor:pointer;
  }
  .test-pill.ready:hover{
    transform:translateY(-2px);
    box-shadow: 0 10px 20px -14px var(--c3-sh);
  }
  .test-pill.soon{
    color:var(--ink-soft);
    background:var(--bg-soft);
    opacity:.6;
    cursor:default;
    pointer-events:none;
  }
  .test-pill.tasks.ready{
    color:var(--c1-b);
    background:rgba(168,138,237,0.15);
  }
  .test-pill.tasks.ready:hover{
    box-shadow: 0 10px 20px -14px var(--c1-sh);
  }

    color:#7A3B00 !important;
    background: linear-gradient(135deg, #FFE27A, #FF9A3D) !important;
    animation: hwGlow 1.6s ease-in-out infinite;
  }
  @keyframes hwGlow{
    0%,100%{ box-shadow: 0 0 6px 0 rgba(255,140,40,0.55); }
    50%{ box-shadow: 0 0 18px 6px rgba(255,140,40,0.85); }
  }

    margin-left:6px;
    font-weight:800;
  }

    text-align:center;
    margin-top:36px;
    font-size:12.5px;
    color:var(--ink-soft);
    font-weight:500;
  }

    display:none;
    background: var(--c2-b);
    color:#fff;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:12.5px;
    letter-spacing:.04em;
    text-transform:uppercase;
    text-align:center;
    padding:9px 14px;
    border-radius:12px;
    margin-bottom:20px;

  .open-badge{
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:10.5px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:5px 10px;
    border-radius:999px;
    align-self:flex-start;
    margin-top:-2px;
  }

  .open-badge.closed{ background:rgba(229,72,77,0.12); color:var(--c2-b); }

// того ж бота (Code89.gs / @resultat89_bot), якщо клас додано в CLASSES
// того ж проєкту — тоді позначки ДЗ і доступ до тем працюють однаково.
// ============================================================
const HOMEWORK_API_URL = "ВСТАВТЕ_/exec-ПОСИЛАННЯ_ТУТ";

let _lastHomeworkMap = null;
function applyHomework(map){
  map = map || {};
  _lastHomeworkMap = map;
  document.querySelectorAll('[data-testkey]').forEach(function(el){
    const hw = map[el.getAttribute('data-testkey')];
    if(!hw) return;
    el.classList.add('homework');
    if(!el.querySelector('.hw-badge')){
      const span = document.createElement('span');
      span.className = 'hw-badge';
      span.textContent = ' · ДЗ ' + hw.number;
      el.appendChild(span);
    }
    if (hw.number && el.getAttribute('href') !== '#') {
      const sep = el.getAttribute('href').indexOf('?') > -1 ? '&' : '?';
      el.setAttribute('href', el.getAttribute('href') + sep + 'hw=' + encodeURIComponent(hw.number));
    }
  });
}

function loadHomework(studentCode){
  if(!HOMEWORK_API_URL || HOMEWORK_API_URL.indexOf('ВСТАВТЕ') === 0) return;
  if(!studentCode) return;
  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'callback=applyHomework&student=' + encodeURIComponent(studentCode);
  document.body.appendChild(s);
}

// ============================================================
// ХТО ЩО БАЧИТЬ — заповни, як STUDENT_ACCESS у 8-9-класному index89.html:
// код учня → масив href уроків, які йому відкрито.
// Посилання для учня: .../index5.html?u=Ім'я
// ============================================================
const STUDENT_ACCESS = {
  // "код-учня": ["href-теми-1", "href-теми-2"]
  // Порожній масив = учень має дійсне посилання, теми відкриває бот (кнопка "🔓 Теми").
};

// ============================================================
// ГРУПОВІ КОДИ (одне посилання — двоє учнів), як і в інших класах.
// ============================================================
const GROUP_MEMBERS = {
  // "код групи в нижньому регістрі": ["Ім'я1", "Ім'я2"]
};

function normalizeCode(s){
  return (s || '').trim().replace(/\s+/g, ' ').toLowerCase();
}

const NORMALIZED_ACCESS = {};
Object.keys(STUDENT_ACCESS).forEach(function(code){
  NORMALIZED_ACCESS[normalizeCode(code)] = STUDENT_ACCESS[code];
});

function appendStudentParam_(href, name){
  const sep = href.indexOf('?') > -1 ? '&' : '?';
  return href + sep + 'student=' + encodeURIComponent(name);
}

function applyAccessAndRender_(studentCode, allowed, displayName){
  const desc = document.getElementById('subDesc');
  if (desc) desc.remove();

  document.querySelectorAll('.card-wrap').forEach(function(wrap){
    const card = wrap.querySelector('.card');
    const key = card.getAttribute('data-key');
    if (allowed.indexOf(key) === -1) { wrap.remove(); return; }
    if (card.getAttribute('href') !== '#') {
      card.setAttribute('href', appendStudentParam_(card.getAttribute('href'), displayName));
    }
    wrap.querySelectorAll('.test-pill').forEach(function(pill){
      if (pill.getAttribute('href') !== '#') {
        pill.setAttribute('href', appendStudentParam_(pill.getAttribute('href'), displayName));
      }
    });
  });
  document.querySelectorAll('.subgroup').forEach(function(sg){
    if (!sg.querySelector('.card')) sg.remove();
  });
  document.querySelectorAll('.block').forEach(function(b){
    if (!b.querySelector('.card')) b.remove();
  });

  document.querySelectorAll('#switchWho').forEach(function(el){ el.closest('p').remove(); });
  if (GROUP_MEMBERS[studentCode]) {
    const who = document.createElement('p');
    who.className = 'sub';
    who.style.cssText = 'margin-top:28px;font-size:13px;';
    who.innerHTML = 'Ви зайшли як <b>' + displayName + '</b>. <a href="#" id="switchWho" style="color:var(--c1-b);">Це не я</a>';
    document.querySelector('.wrap').appendChild(who);
    document.getElementById('switchWho').addEventListener('click', function(e){
      e.preventDefault();
      sessionStorage.removeItem('chosenName_' + studentCode);
      location.reload();
    });
  }
}

function finishStudentView_(studentCode, allowedStatic, displayName){
  loadHomework(studentCode);
  applyAccessAndRender_(studentCode, allowedStatic, displayName);

  const stillWaiting = HOMEWORK_API_URL && HOMEWORK_API_URL.indexOf('ВСТАВТЕ') !== 0;
  const blocksEl = document.getElementById('blocks');

  let loadingEl = null;
  if (stillWaiting && !document.querySelector('.card-wrap')) {
    loadingEl = document.createElement('p');
    loadingEl.className = 'sub';
    loadingEl.id = 'accessLoading';
    loadingEl.textContent = 'Завантажуємо ваші теми…';
    document.querySelector('.wrap').insertBefore(loadingEl, blocksEl);
  }

  if (!stillWaiting) return;

  let resolved = false;
  window.applyAccess = function(dynamicList){
    if (resolved) return;
    resolved = true;
    dynamicList = dynamicList || [];
    const extra = dynamicList.filter(function(h){ return allowedStatic.indexOf(h) === -1; });
    if (extra.length > 0) {
      renderBlocks_();
      applyAccessAndRender_(studentCode, allowedStatic.concat(extra), displayName);
      if (_lastHomeworkMap) applyHomework(_lastHomeworkMap);
    }

    const loader = document.getElementById('accessLoading');
    if (loader) loader.remove();

    if (!document.querySelector('.card-wrap')) {
      const msg = document.createElement('p');
      msg.className = 'sub';
      msg.textContent = 'Поки для вас не відкрито жодної теми. Зверніться до вчительки.';
      document.querySelector('.wrap').insertBefore(msg, blocksEl);
    }
  };

  const sep = HOMEWORK_API_URL.indexOf('?') > -1 ? '&' : '?';
  const s = document.createElement('script');
  s.src = HOMEWORK_API_URL + sep + 'mode=access&callback=applyAccess&student=' + encodeURIComponent(studentCode);
  document.body.appendChild(s);
}

function showNamePicker_(studentCode, allowed, members){
  const blocksEl = document.getElementById('blocks');
  blocksEl.style.display = 'none';
  const desc = document.getElementById('subDesc');
  if (desc) desc.remove();

  const box = document.createElement('div');
  box.id = 'namePicker';
  box.innerHTML = '<p class="sub" style="margin-bottom:18px;">Це спільне посилання. Оберіть, хто зараз проходить тести:</p>';

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:12px;flex-wrap:wrap;';

  members.forEach(function(name){
    const btn = document.createElement('button');
    btn.textContent = name;
    btn.style.cssText = 'font-family:Manrope,sans-serif;font-weight:800;font-size:16px;padding:18px 30px;border:none;border-radius:16px;cursor:pointer;background:var(--card);color:var(--ink);box-shadow:0 14px 30px -24px rgba(19,33,59,0.35);';
    btn.addEventListener('click', function(){
      sessionStorage.setItem('chosenName_' + studentCode, name);
      box.remove();
      blocksEl.style.display = '';
      finishStudentView_(studentCode, allowed, name);
    });
    row.appendChild(btn);
  });

  box.appendChild(row);
  document.querySelector('.wrap').insertBefore(box, blocksEl);
}

        finishStudentView_(studentCode, allowed, chosen);
      } else {
        showNamePicker_(studentCode, allowed, members);
      }
    } else {
      finishStudentView_(studentCode, allowed, params.get('u').trim());
    }
  } else {
    const desc = document.getElementById('subDesc');
    if (desc) desc.remove();
    document.querySelectorAll('.block').forEach(function(b){ b.remove(); });
    const msg = document.createElement('p');
    msg.className = 'sub';
    msg.textContent = 'Це посилання недійсне. Зверніться до вчительки за новим.';
    document.querySelector('.wrap').appendChild(msg);
  }
})();
</script>
</body>
</html>
