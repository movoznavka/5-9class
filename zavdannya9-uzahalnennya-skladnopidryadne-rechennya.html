<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Складнопідрядне речення: узагальнення · Завдання</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FADDE7;--soft:#FDEEF3;--card:#FFFAFB;--ink:#3A1624;--mute:#A06A80;--a:#FF9DBB;--b:#D6336C;--sh:rgba(214,51,108,.45);--ok:#17A863;--no:#D63341;--terra:#9C2F55}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',sans-serif;min-height:100vh;padding:28px 16px 64px}
.wrap{max-width:760px;margin:0 auto}
.kicker{font:800 12.5px 'Manrope',sans-serif;letter-spacing:.12em;text-transform:uppercase;opacity:.55;padding-bottom:16px;margin-bottom:22px;border-bottom:1.5px solid rgba(58,22,36,.14)}
h1{font:800 clamp(24px,5.6vw,36px)/1.08 'Manrope',sans-serif;text-transform:uppercase;margin:0 0 18px}
h1 span{color:var(--b)}
.tabbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:10px 15px 10px 10px;border-radius:999px;border:1px solid #fff;background:#fff;color:var(--mute);font:800 12.5px 'Manrope',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 10px 20px -12px rgba(58,22,36,.45)}
.tab i{font-style:normal;min-width:22px;height:22px;border-radius:8px;background:rgba(214,51,108,.16);color:var(--b);display:flex;align-items:center;justify-content:center;font-size:11px;padding:0 4px}
.tab.active,.btn.primary{background:linear-gradient(155deg,var(--a),var(--b));color:#fff;border-color:transparent;box-shadow:0 12px 22px -8px var(--sh)}
.tab.active i{background:rgba(255,255,255,.28);color:#fff}
.card{background:var(--card);border-radius:28px;padding:28px 24px;box-shadow:0 20px 44px -28px rgba(58,22,36,.35)}
.st{font:800 20px 'Manrope',sans-serif;margin:0 0 8px}
.si{color:var(--mute);font-size:14.5px;line-height:1.6;margin:0 0 18px}
.si b,.si i{color:var(--ink)}
.m{background:var(--terra);color:#fff;border-radius:6px;padding:1px 8px;font-weight:700}
.qp{font:700 13px 'Manrope',sans-serif;color:var(--mute);margin-bottom:14px}
.qt{font:700 19px/1.5 'Manrope',sans-serif;margin:0 0 20px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:13px;text-align:left;width:100%;padding:9px 14px 9px 9px;border-radius:18px;border:none;background:var(--soft);cursor:pointer;font:500 14.5px/1.5 'Inter',sans-serif;color:var(--ink)}
.tile{width:30px;height:30px;min-width:30px;border-radius:10px;display:flex;align-items:center;justify-content:center;font:800 13px 'Manrope',sans-serif;color:var(--b);background:linear-gradient(150deg,rgba(255,255,255,.75),rgba(214,51,108,.22))}
.opt.sel{background:#F9D3E1;box-shadow:inset 0 0 0 2px var(--b)}
.opt.correct{background:#E6F8EE}.opt.wrong{background:#FDECEC}.opt.dim{opacity:.5}
.opt.miss{background:#fff;box-shadow:inset 0 0 0 2px var(--ok);opacity:1}
.fb{margin-top:14px;padding:13px 16px;border-radius:16px;font-size:14px;font-weight:600}
.fb.ok{background:#E6F8EE;color:#128A54}.fb.bad{background:#FDECEC;color:var(--no)}
.note{margin-top:6px;font-weight:500;font-size:13px;line-height:1.5;opacity:.9}
.nav{display:flex;justify-content:space-between;margin-top:22px;align-items:center;gap:10px}
.btn{font:800 13px 'Manrope',sans-serif;padding:12px 22px;border-radius:999px;border:none;cursor:pointer;background:transparent;color:var(--mute)}
.btn:disabled{opacity:.3;cursor:default}
.btn.sm{padding:8px 14px;font-size:12px}
.done{text-align:center}
.ring{width:110px;height:110px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(155deg,var(--a),var(--b));display:flex;align-items:center;justify-content:center;font:800 28px 'Manrope',sans-serif;color:#fff}
.ss{font-size:13px;font-weight:600;color:var(--mute);margin-top:10px;min-height:18px}.ss.ok{color:#128A54}.ss.bad{color:var(--no)}
footer{text-align:center;margin-top:22px;font-size:12.5px;color:var(--mute);font-weight:500}
#cv{position:fixed;top:0;left:0;z-index:9998;pointer-events:none;touch-action:none}
#cv.on{pointer-events:auto}
#pen{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;border:none;background:linear-gradient(155deg,var(--a),var(--b));box-shadow:0 14px 28px -10px var(--sh);color:#fff;font-size:22px;cursor:pointer;z-index:9999}
#pen.on{background:linear-gradient(155deg,#6B3A52,#3A1624)}
#tb{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:rgba(255,255,255,.85);backdrop-filter:blur(16px);padding:9px 16px;border-radius:999px;box-shadow:0 24px 48px -20px rgba(58,22,36,.45);z-index:9999}
#tb.show{display:flex}
.sw{width:25px;height:25px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
.sw.sel{border-color:var(--ink)}
.tb2{border:none;background:var(--soft);border-radius:999px;padding:7px 12px;font:800 12px 'Manrope',sans-serif;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <div class="kicker">Складнопідрядне речення · 9 клас · Завдання</div>
  <h1>Узагальнення: <span>завдання</span></h1>
  <div class="tabbar" id="tabs"></div>
  <div class="card" id="area"></div>
  <footer>@movoznavka</footer>
</div>
<canvas id="cv"></canvas>
<button id="pen" title="Малювати">✎</button>
<div id="tb">
  <button class="sw sel" style="background:#F5304A" data-c="#F5304A"></button>
  <button class="sw" style="background:#3355EE" data-c="#3355EE"></button>
  <button class="sw" style="background:#17A863" data-c="#17A863"></button>
  <button class="sw" style="background:#3A1624" data-c="#3A1624"></button>
  <button class="tb2" id="th">Товщ.</button>
  <button class="tb2" id="er">Ластик</button>
  <button class="tb2" id="cl">Очистити</button>
</div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbxWkeJYw7gUdEjM9H2oeMVTMhBLEq1dDa2DcqNS5vSQjJb19aXyR7p7kDz_otyK3sTggw/exec";
const M=t=>`<span class="m">${t}</span>`;
const L=["А","Б","В","Г","Д"];
const TYPES12=['означальна','з’ясувальна','обставинна місця','обставинна часу','обставинна способу дії','обставинна міри і ступеня','порівняльна','обставинна мети','обставинна причини','обставинна умови','допустова','наслідкова'];

/* Типи завдань: s — один варіант; m — кілька правильних; sub — серія речень з однаковим набором відповідей */
const RAW=[
{type:'m',q:'Оберіть <b>всі</b> речення, у яких підрядна частина є <b>означальною</b>.',
 opts:[`Я не знаю, ${M('де ти живеш')}.`,`Це місто, ${M('де я народився')}, давнє.`,`Ми зупинилися там, ${M('де починався ліс')}.`,`Той, ${M('хто працює')}, не голодує.`,`Книжка, ${M('яку ти порадив')}, мені сподобалась.`,`Він сказав, ${M('що прийде')}.`],
 ans:[1,3,4],n:'Означальна пояснює іменник або вказівне слово (місто, той, книжка) і відповідає на питання <i>який?</i> Речення 1 і 6 — з’ясувальні, речення 3 — обставинна місця.'},
{type:'sub',q:'Визначте вид виділеної підрядної частини.',choices:TYPES12,items:[
 [`Ми вирушили в дорогу, ${M('щойно зійшло сонце')}.`,'обставинна часу','Питання: коли? Сполучник «щойно».'],
 [`Він мовчав, ${M('ніби води в рот набрав')}.`,'порівняльна','Порівняння зі сполучником «ніби».'],
 [`${M('Хоч як ми поспішали')}, на потяг ми не встигли.`,'допустова','Сполучник «хоч як»: перешкода, що не завадила результату.'],
 [`Я не розумію, ${M('чому він так вчинив')}.`,'з’ясувальна','Пояснює «не розумію» — що? Сполучне слово «чому».'],
 [`Це та школа, ${M('де навчалася моя мама')}.`,'означальна','Пояснює іменник «школа» — яка? Сполучне слово «де».'],
 [`Батько вийшов раніше, ${M('аби ми встигли на потяг')}.`,'обставинна мети','Сполучник «аби» — навіщо?']]},
{type:'m',q:'Оберіть <b>всі</b> складнопідрядні речення.',
 opts:['Сонце зайшло, і в лісі стало тихо.','Стало тихо, бо сонце зайшло.','Не знаю, де ти був і що з тобою сталося.','Вітер стих, дощ ущух, небо прояснилося.','Хто вчиться змолоду, той не знає нудьги.','Ми прийшли, але нікого вдома не було.'],
 ans:[1,2,4],n:'Речення 1 і 6 — сполучникові сурядні, речення 4 — безсполучникове складне. У реченні 3 дві однорідні підрядні, тому перед «і» коми немає.'},
{type:'sub',q:'Визначте вид підрядності.',choices:['однорідна','неоднорідна','послідовна','мішана'],items:[
 ['Учитель сказав, що завтра ми підемо в похід, якщо буде гарна погода.','послідовна','«Якщо буде гарна погода» залежить від «підемо» у підрядній.'],
 ['Ми чули, як шумить ліс, як співають птахи, як дзюрчить струмок.','однорідна','Підрядні відповідають на одне питання й залежать від одного слова «чули».'],
 ['Коли настав вечір, мама сказала, що гості прийдуть пізно.','неоднорідна','Обидві підрядні залежать від головної, але відповідають на різні питання.'],
 ['Я переконаний, що настане час, коли люди зрозуміють, чому це важливо і що їх чекає.','мішана','Є ланцюжок «що → коли» та однорідні підрядні «чому… і що…».']]},
{type:'s',q:'Оберіть рядок, у якому <b>всі</b> слова є лише <b>сполучниками</b> (не сполучними словами).',
 opts:['що, який, чи, хоч','аби, мов, оскільки, хоча','який, де, коли, щоб','бо, куди, нібито, якщо','чому, навіщо, поки, доки'],ans:1,
 n:'Лише сполучники: аби, мов, оскільки, хоча. У решті рядків є сполучні слова: який, де, коли, куди, чому, навіщо, поки, доки.'},
{type:'sub',q:'Скільки ком потрібно поставити в реченні? Розділові знаки пропущено.',choices:['0','1','2','3','4'],items:[
 ['Вони вирішили що коли настане літо то вирушать у подорож.','2','Кома перед «що» і перед «то»; між «що» і «коли» коми немає, бо далі є «то».'],
 ['Я хочу зрозуміти не чому він зник а що з ним сталося.','1','Кома лише перед «а». Перед підрядною з «не» коми немає.'],
 ['Після того як дощ закінчився ми вийшли на вулицю.','1','Кома після підрядної; усередині складеного сполучника коми немає.'],
 ['Я не знаю чи прийде він і коли саме.','1','Кома перед «чи»; між однорідними підрядними перед «і» коми немає.']]},
{type:'s',q:'Яке речення відповідає схемі?<br><b style="font-size:18px">(коли) ← [ ] → (що)</b>',
 opts:['Коли настала осінь, ми побачили, що листя пожовкло.','Ми знаємо, що осінь настає тоді, коли дні стають коротшими.','Ми побачили, що листя жовтіє і що ліс порожніє.','Ми побачили, що листя, яке ще недавно було зеленим, пожовкло.'],ans:0,
 n:'У схемі обидві підрядні залежать від головної: перша стоїть перед нею, друга — після (неоднорідна підрядність). У реченнях 2 і 4 друга підрядна залежить від першої (послідовна), у реченні 3 підрядні однорідні.'},
{type:'sub',q:'Визначте, чи правильно розставлено розділові знаки.',choices:['правильно','неправильно'],items:[
 ['Батьки хотіли, щоб син учився, але щоб і відпочивав.','правильно','Кома перед «але», а між «але» і «щоб» кома не ставиться.'],
 ['Я сказав, що, якщо він запізниться, то ми підемо без нього.','неправильно','Є «то», тому кома між «що» і «якщо» зайва.'],
 ['Учитель пояснив, що, коли знати правило, помилок не буде.','правильно','Немає «то» чи «так», тому між «що» і «коли» кома потрібна.'],
 ['Він мріяв що коли виросте, то стане пілотом.','неправильно','Бракує коми перед «що».']]},
{type:'sub',q:'Яку роль виконує виділене слово?',choices:['сполучник','сполучне слово','частка'],items:[
 ['<b>Як</b> гарно зацвіли сади!','частка','В окличному реченні підрядного зв’язку немає — «як» частка.'],
 ['Розкажи, <b>як</b> ти провів літо.','сполучне слово','Член речення: провів — як?'],
 ['Я певен, <b>що</b> вони вже вдома.','сполучник','«Що» не є членом речення.'],
 ['Він не розумів, <b>що</b> йому говорять.','сполучне слово','Додаток: говорять — що?'],
 ['<b>Що</b> за дивовижний світ відкрився перед нами!','частка','«Що за» в окличному реченні — частка.'],
 ['Ми шукали місце, <b>де</b> колись стояла хата.','сполучне слово','Обставина місця: стояла — де?']]},
{type:'s',q:'Речення: <i>Хлопець, який учора прийшов, сказав, що завтра піде в похід, якщо не буде дощу.</i><br>Оберіть <b>хибне</b> твердження.',
 opts:['Речення має три підрядні частини.','Підрядна «який учора прийшов» означальна, вона розриває головну частину.','Підрядна «що завтра піде в похід» з’ясувальна.','Підрядна «якщо не буде дощу» залежить від головної частини.','У реченні мішана підрядність.'],ans:3,
 n:'«Якщо не буде дощу» пояснює слово «піде» у з’ясувальній підрядній, тобто залежить від неї, а не від головної. Це послідовна підрядність; разом з означальною підрядною, що залежить від головної, — мішана.'}
];

/* перетворення на серії питань (детермінована перестановка варіантів) */
const GR=RAW.map((t,gi)=>{
  const g={tab:"Завдання "+(gi+1),name:"Складнопідрядне речення: узагальнення — завдання "+(gi+1),title:"Завдання "+(gi+1),intro:t.q};
  if(t.type==='sub'){
    g.qs=t.items.map((it,i)=>{
      let o;
      if(t.choices.length<=5)o=t.choices.slice();
      else{const c=t.choices.indexOf(it[1]),d=[];let k=1+(i%5);
        while(d.length<3){const j=(c+k)%t.choices.length;if(j!==c&&!d.includes(j))d.push(j);k+=3;}
        o=d.map(j=>t.choices[j]);o.splice((i+gi)%4,0,it[1]);}
      return {k:'s',t:it[0],o,a:o.indexOf(it[1]),n:it[2]};});
  }else if(t.type==='m')g.qs=[{k:'m',t:'',o:t.opts,a:t.ans,n:t.n}];
  else g.qs=[{k:'s',t:'',o:t.opts,a:t.ans,n:t.n}];
  return g;});

let gi=0,qi=0,ans=GR.map(()=>({})),tmp={},sent={};
const P=new URLSearchParams(location.search),hw=P.get("hw");
if(hw&&+hw>=1&&+hw<=GR.length)gi=+hw-1;
const tabs=document.getElementById("tabs"),area=document.getElementById("area");
function renderTabs(){
  tabs.innerHTML=GR.map((g,i)=>`<button class="tab ${i===gi?"active":""}" data-i="${i}"><i>${i+1}</i>${g.tab}</button>`).join("");
  tabs.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{gi=+b.dataset.i;qi=0;clearInk();renderTabs();render();});
}
async function send(g,c){
  const st=document.getElementById("ss"),student=P.get("student");
  if(!student||sent[gi]==="sending"||sent[gi]==="ok"){if(st&&sent[gi]==="ok"){st.textContent="Результат надіслано вчителю ✓";st.className="ss ok";}return;}
  sent[gi]="sending";st.textContent="Надсилаємо результат...";
  const A=ans[gi],wrong=[];g.qs.forEach((_,i)=>{if(A[i]&&!A[i].ok)wrong.push(i+1);});
  try{
    const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({type:"quiz_result",student,testName:g.name,correct:c,answered:Object.keys(A).length,total:g.qs.length,wrongList:wrong,reviewLink:"",flaggedList:[]})});
    if(!r.ok)throw 0;sent[gi]="ok";st.textContent="Результат надіслано вчителю ✓";st.className="ss ok";
  }catch(e){sent[gi]="";st.innerHTML='Не вдалося надіслати результат. <button class="btn sm" id="rt">Ще раз</button>';st.className="ss bad";document.getElementById("rt").onclick=()=>send(g,c);}
}
function optsHtml(q,r,sel){
  const multi=q.k==='m';
  return `<div class="opts">${q.o.map((o,i)=>{
    let cls="opt";
    if(r){
      const right=multi?q.a.includes(i):i===q.a,chosen=multi?r.sel.includes(i):i===r.p;
      if(chosen)cls+=right?" correct":" wrong";else if(right)cls+=multi?" miss":" correct";else cls+=" dim";
    }else if(multi&&sel.includes(i))cls+=" sel";
    return `<button class="${cls}" data-i="${i}" ${r?"disabled":""}><span class="tile">${L[i]}</span><span>${o}</span></button>`;}).join("")}</div>`;
}
function render(){
  const g=GR[gi],n=g.qs.length,A=ans[gi];
  let h=`<p class="st">${g.title}</p><p class="si">${g.intro}</p>`;
  if(qi>=n){
    const c=g.qs.filter((_,i)=>A[i]&&A[i].ok).length;
    area.innerHTML=h+`<div class="done"><div class="ring">${c}/${n}</div><p class="si">${c===n?"Ідеально! 🎉":"Непогано — можна пройти ще раз."}</p><div class="ss" id="ss"></div><button class="btn primary" id="rs" style="margin-top:8px">Пройти ще раз</button></div>`;
    document.getElementById("rs").onclick=()=>{ans[gi]={};sent[gi]="";qi=0;clearInk();render();};
    send(g,c);return;
  }
  const q=g.qs[qi],r=A[qi],key=gi+"_"+qi,sel=tmp[key]||[];
  if(n>1)h+=`<div class="qp">Речення ${qi+1} з ${n}</div>`;
  if(q.t)h+=`<p class="qt">${q.t}</p>`;
  h+=optsHtml(q,r,sel);
  if(r){
    const txt=r.ok?"<b>Правильно.</b>":(q.k==='m'?"Правильні відповіді — "+q.a.map(i=>L[i]).join(", ")+".":"Правильна відповідь — "+L[q.a]+". "+q.o[q.a]);
    h+=`<div class="fb ${r.ok?"ok":"bad"}">${txt}<div class="note">${q.n}</div></div>`;
  }
  const canNext=!!r,needCheck=q.k==='m'&&!r;
  h+=`<div class="nav"><button class="btn" id="pv" ${qi===0?"disabled":""}>← Назад</button>${needCheck?`<button class="btn primary" id="ck" ${sel.length?"":"disabled"}>Перевірити</button>`:`<button class="btn primary" id="nx" ${canNext?"":"disabled"}>${qi===n-1?"До результату":"Далі →"}</button>`}</div>`;
  area.innerHTML=h;
  if(!r)area.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;
    if(q.k==='m'){const s=tmp[key]=tmp[key]||[],p=s.indexOf(i);p>=0?s.splice(p,1):s.push(i);render();}
    else{A[qi]={p:i,ok:i===q.a};render();}});
  const ck=document.getElementById("ck");
  if(ck)ck.onclick=()=>{const s=(tmp[key]||[]).slice().sort((x,y)=>x-y);A[qi]={sel:s,ok:s.length===q.a.length&&q.a.every(x=>s.includes(x))};render();};
  document.getElementById("pv").onclick=()=>{qi--;clearInk();render();};
  const nx=document.getElementById("nx");if(nx)nx.onclick=()=>{qi++;clearInk();render();};
}
/* малювання */
const cv=document.getElementById("cv"),cx=cv.getContext("2d"),pen=document.getElementById("pen"),tb=document.getElementById("tb");
let on=false,dr=false,col="#F5304A",w=4,er=false,lx=0,ly=0;
function fit(){cv.width=innerWidth;cv.height=innerHeight;}fit();addEventListener("resize",fit);
function clearInk(){cx.clearRect(0,0,cv.width,cv.height);}
pen.onclick=()=>{on=!on;pen.classList.toggle("on",on);tb.classList.toggle("show",on);cv.classList.toggle("on",on);};
tb.querySelectorAll(".sw").forEach(s=>s.onclick=()=>{tb.querySelectorAll(".sw").forEach(x=>x.classList.remove("sel"));s.classList.add("sel");col=s.dataset.c;er=false;});
document.getElementById("th").onclick=()=>{w=w===4?10:4;};
document.getElementById("er").onclick=()=>{er=!er;};
document.getElementById("cl").onclick=clearInk;
cv.addEventListener("pointerdown",e=>{dr=true;lx=e.clientX;ly=e.clientY;cv.setPointerCapture(e.pointerId);});
cv.addEventListener("pointermove",e=>{if(!dr)return;cx.globalCompositeOperation=er?"destination-out":"source-over";cx.strokeStyle=col;cx.lineWidth=er?w*3:w;cx.lineCap="round";cx.beginPath();cx.moveTo(lx,ly);cx.lineTo(e.clientX,e.clientY);cx.stroke();lx=e.clientX;ly=e.clientY;});
cv.addEventListener("pointerup",()=>dr=false);
renderTabs();render();
</script>
</body>
